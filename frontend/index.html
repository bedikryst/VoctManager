<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.png" />
    <!-- `interactive-widget=resizes-content` makes the on-screen keyboard shrink
         the LAYOUT viewport, so `dvh` boxes and bottom-anchored composers stay
         above it without script. Chrome/Android honours it; iOS does not, and is
         handled by `useKeyboardInset`. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>VoctManager | Panel</title>
    <meta name="robots" content="noindex,nofollow" />

    <!--
      Earliest-possible capture of the install prompt. Chromium fires
      `beforeinstallprompt` once, often before the app bundle evaluates; buffering
      it here (synchronously, during parse) guarantees the in-app install button
      never misses it. Drained on boot by shared/pwa/installController.ts.
    -->
    <script>
      window.__voctInstall = { event: null, installed: false };
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__voctInstall.event = e;
      });
      window.addEventListener("appinstalled", function () {
        window.__voctInstall.event = null;
        window.__voctInstall.installed = true;
      });
    </script>

    <!--
      The theme, resolved during parse — before the stylesheet paints anything.
      The app bundle is lazy, so by the time React (or even the entry chunk)
      evaluates, the ground has already been painted in whatever the CSS
      defaults to; without this attribute every dark start opens with a cream
      flash. Same class of reason as the install buffer above.

      Kept in lockstep with shared/theme/themeController.ts, which owns the
      attribute from boot onwards: same key, same media query, same rule (an
      unrecognised stored value falls back to following the OS). `try/catch`
      because a locked-down browser throws on localStorage, and a throw here
      would abandon the page unstyled.
    -->
    <script>
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("voct.theme") || "system";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "dark" : "light",
        );
      })();
    </script>

    <!--
      Installable PWA. Static manifest in /public (no plugin HTML injection, so
      the install criteria are auditable here).

      These two metas are only the PRE-BOOT default: they are keyed on the OS,
      which is wrong for a member who forces light inside a dark-mode phone. The
      theme controller prepends an un-keyed `theme-color` meta once it resolves,
      and the first matching meta in tree order wins. Both values mirror
      `--color-ethereal-canvas` per theme — a theme-color that drifts from the
      ground is a visible seam along the top edge on installed iOS. The
      manifest's own `background_color` is a different surface (the one-second
      splash) and stays at #060607.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#EBE5D9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120F" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VoctManager" />

    <!--
      Self-hosted variable fonts: GDPR-compliant, zero data transfer to third-party
      providers (Google / Bunny / Adobe). Variable wght = single file per family
      covers the full weight range. Unicode-range subsetting splits latin / latin-ext
      so the browser only downloads what the page actually renders.
      Mirrors the Astro public site strategy for a consistent typographic stack.

      EVERY subset the panel sets text in is preloaded — both Plex Sans faces and
      all four Cormorant faces — because at this point the choice is one of
      SCHEDULING, not of bytes: `vite.config.ts` precaches `fonts/*.woff2`
      wholesale, so a first visit pulls all ten files whatever this list says.
      What a missing preload buys is latency. The @font-face rules below are
      inert until React renders a glyph that needs them, which puts the request
      behind the entry chunk's download, parse and first render — and lands the
      `swap` as a reflow of text the user has already started reading.

      Cormorant is the display face and all four of its subsets are on the FIRST
      screen. `Heading` and `Metric` are upright; `Emphasis` and `Unit` are
      italic, and `PageHeader` sets every page's `titleHighlight` through
      `Emphasis`. The dashboard passes the member's own first name in the
      vocative there, which is exactly where Polish diacritics turn up — so the
      italic `latin-ext` file is load-bearing for a name like "Małgorzato",
      on the largest piece of type on the screen.

      EN and FR draw nothing from any `latin-ext` file — French accents and the
      œ ligature all sit inside Latin-1, i.e. inside `latin` — so those two
      locales are scheduled ~92 KB they will not use; that is the deliberate
      trade for the primary locale rendering in one pass. `crossorigin` is not
      optional on any of these — a preload whose CORS mode differs from the
      @font-face fetch is downloaded twice and warms nothing.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/CormorantGaramond-Variable.latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/CormorantGaramond-Variable.latin-ext.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/CormorantGaramond-Italic-Variable.latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/CormorantGaramond-Italic-Variable.latin-ext.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/IBMPlexSans-Variable.latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/IBMPlexSans-Variable.latin-ext.woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url("/fonts/CormorantGaramond-Variable.latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url("/fonts/CormorantGaramond-Variable.latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: italic;
        font-weight: 300 700;
        font-display: swap;
        src: url("/fonts/CormorantGaramond-Italic-Variable.latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: italic;
        font-weight: 300 700;
        font-display: swap;
        src: url("/fonts/CormorantGaramond-Italic-Variable.latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* IBM Plex Sans carries the UI text — same family as the Plex Mono below, so
         the panel speaks two voices (Cormorant for display, Plex for everything set
         small) instead of three. Its figures are uniform-width by DEFAULT (0.6em,
         every digit), which is what the ~40 `tabular-nums` sites rely on: the
         subset ships no `tnum` feature and needs none. The weight axis really does
         stop at 700 — never ask for 800/900 (`font-synthesis: none` on the body
         means a request past the axis clamps rather than fakes it).

         size-adjust: 105.8% — Plex draws a 0.516em x-height where the panel's scale
         was drawn around 0.546em, so every size from `text-sm` body down to the 10px
         overline would read a step small. 0.546/0.516 restores the panel's optical
         size exactly, without rebasing a single `text-*` token (which would have
         missed the arbitrary values like `text-[11px]` anyway). It MUST be identical
         on all six Plex faces: Sans and Mono share one skeleton (both 0.516/0.698)
         and sit inline together in ledger cells and section badges, and a value that
         differed between the `latin` and `latin-ext` subsets would render Polish
         diacritics at a different size than the ASCII around them. Caps land 1.5%
         above Inter's and the text still sets 1.8% narrower — both below notice.
         Dial to 100% to see the family at its natural size. */
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 100 700;
        font-display: swap;
        size-adjust: 105.8%;
        src: url("/fonts/IBMPlexSans-Variable.latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 100 700;
        font-display: swap;
        size-adjust: 105.8%;
        src: url("/fonts/IBMPlexSans-Variable.latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        size-adjust: 105.8%;
        src: url("/fonts/IBMPlexMono-300.latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        size-adjust: 105.8%;
        src: url("/fonts/IBMPlexMono-300.latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        size-adjust: 105.8%;
        src: url("/fonts/IBMPlexMono-400.latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        size-adjust: 105.8%;
        src: url("/fonts/IBMPlexMono-400.latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>

    <meta
      name="description"
      content="Secure VoctManager panel for projects, schedules, materials, logistics, and ensemble operations."
    />
    <meta
      name="keywords"
      content="VoctManager, panel, ensemble operations, project management, logistics"

    <meta property="og:type" content="website" />

    <meta property="og:title" content="VoctManager | Panel" />

    <meta property="og:image" content="/icons/icon-512.png" />

    <!--
      Google Maps API is NOT loaded here, and no panel route loads it either. The
      SDK is mounted by the four logistics surfaces that actually draw a map, via
      features/logistics/components/MapsProvider — so ~350-500 kB of third-party
      JS (plus the `places` and `geocoding` libraries) arrives on the first venue
      popover or map screen, never on a session start. A route-level provider was
      the previous shape and cost every dashboard load the full download.
    -->
  </head>
  <body class="antialiased overflow-x-hidden theme-panel">
    <div id="root" class="min-h-screen w-full"></div>
