concert.aeternam.video.note: "C. Shaw — and the swallow (psaume 84) · captation depuis la nef · son direct"
concert.bobola.about.blurb: "L'accompagnement musical de la liturgie au jour du centenaire des provinces jésuites polonaises, pendant la messe célébrée par Mgr Adrian Galbas, archevêque, avec l'homélie du P. Arturo Sosa SJ."
concert.bobola.about.place: "Sanctuaire national Saint-André-Bobola · Varsovie"
concert.bobola.essence: "Ici la musique servait la liturgie. Pour le centenaire des deux provinces polonaises de la Compagnie de Jésus, le chant s'inscrivait dans le rite, présidé par Mgr Adrian Galbas, archevêque ; l'homélie a été prononcée par le P. Arturo Sosa SJ."
concert.bobola.facts.0: "Varsovie"
concert.bobola.facts.1: "16 mai 2026"
concert.bobola.facts.2: "Centenaire des provinces jésuites"
