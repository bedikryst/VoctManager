concert.hymn-poleglym.about.blurb: "Un concert spirituel en hommage à ceux qui ont donné leur vie pour la liberté, et une prière pour la paix — pour l'Ukraine et pour les générations à venir."
concert.hymn-poleglym.about.place: "Basilique Sainte-Marie · Cracovie"
concert.hymn-poleglym.credits.0.role: "Direction"
concert.hymn-poleglym.credits.1.role: "Parole et bénédiction"
concert.hymn-poleglym.credits.2.role: "Chantre de la basilique"
concert.hymn-poleglym.essence: "Un hommage à ceux qui ont donné leur vie pour défendre l'Ukraine, et une prière pour la paix de ceux qui portent plus loin le poids de la guerre. Au sommet de la soirée, le retable de la basilique Sainte-Marie ouvert, une improvisation d'orgue sur l'hymne ukrainien a retenti."
concert.hymn-poleglym.facts.0: "Basilique Sainte-Marie"
concert.hymn-poleglym.facts.1: "Une prière pour la paix"
concert.hymn-poleglym.facts.2: "Mémoire de l'Ukraine"
concert.hymn-poleglym.gallery.kd-hymn-0.alt: "VoctEnsemble pendant le concert Hymne aux morts dans la basilique Sainte-Marie à Cracovie"
concert.hymn-poleglym.gallery.kd-hymn-1.alt: "VoctEnsemble pendant le concert Hymne aux morts dans la basilique Sainte-Marie à Cracovie"
