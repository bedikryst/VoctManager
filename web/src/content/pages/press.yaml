about:
  eyebrow: "O zespole"
  # The character counts are NOT written here: the page measures each text after stripping its
  # markup and prints the real number.
  lede: >-
    Ten sam tekst w trzech miarach: do noty w programie, do zapowiedzi i do pełnego biogramu.
  # ~300 characters: who, what, and the one thing that makes the cycle a cycle.
  shortHtml: >-
    <p>VoctEnsemble to zespół wokalny pod kierownictwem Florenta de Bazelaire, poświęcony
    muzyce sakralnej od renesansu po współczesność. W autorskim cyklu <em>Koncertów
    Duchowych</em> przywraca tradycję dawnych <em>Concerts Spirituels</em>, wieczorów,
    w których muzyka, słowo i światło prowadzą jedną narrację.</p>
  # ~1000 characters: the above, plus the record a programmer checks — who recorded the debut,
  # which evenings exist, who builds the light.
  mediumHtml: |-
    <p><strong>VoctEnsemble</strong> to nowoczesna formacja wokalna, która pod kierownictwem
    <strong>Florenta de Bazelaire</strong> wnosi na polską scenę muzyczną nową jakość estetyczną
    i duchową. W autorskim cyklu <em>Koncertów Duchowych</em> zespół przywraca tradycję dawnych
    <em>Concerts Spirituels</em>, budując pomost między historyczną świadomością a potrzebami
    współczesnego słuchacza.</p>
    <p>Repertuar obejmuje siedem wieków muzyki sakralnej: dzieła mistrzów renesansu i baroku
    spotykają się w nim z kompozycjami Arvo Pärta i Bernata Vivancosa. Debiutancki projekt
    <em>Kontemplacja Wcielenia</em> (2024) zarejestrował Jakub Garbacz z Ars Sonora Studio;
    kolejne wieczory — <em>Hymn Poległym</em> w Bazylice Mariackiej i <em>Aeternam — Epitafium
    dla Gazy</em> — wzięły się z wrażliwości zespołu na los drugiego człowieka. Dzięki współpracy
    z reżyserką świateł Adą Bystrzycką koncerty nabierają formy nowoczesnych misteriów.
    Działalność zespołu prowadzi Fundacja VoctFoundation z siedzibą w Krakowie.</p>
  # The team's own text, verbatim. It is the one legitimately brochure-voiced artifact on this
  # site and it is not ours to rewrite — the two shorter measures above are condensations OF it,
  # and they introduce no fact it does not carry.
  longHtml: |-
    <p><strong>VoctEnsemble</strong> to nowoczesna formacja wokalna, która pod kierownictwem
    <strong>Florenta de Bazelaire</strong> wnosi na polską scenę muzyczną nową jakość estetyczną
    i duchową. Misją zespołu jest zgłębianie człowieczeństwa za pomocą muzyki sakralnej, przy
    jednoczesnym zachowaniu niezwykłej czujności na współczesne tragizmy i nadzieje świata.
    W ramach autorskiego cyklu <em>Koncertów Duchowych</em>, grupa przywraca tradycję dawnych
    <em>Concerts Spirituels</em>, budując pomost między historyczną świadomością a potrzebami
    współczesnego słuchacza.</p>
    <p>Twórczość VoctEnsemble to fascynujący kalejdoskop stylów, w którym dzieła mistrzów
    Renesansu i Baroku spotykają się z kompozycjami Arvo Pärta czy Bernata Vivancosa.
    Ta artystyczna wymiana pozwala na odkrywanie uniwersalnych prawd ukrytych w dźwiękach,
    czyniąc każdy koncert podróżą w głąb sacrum.</p>
    <p>Zespół od początku istnienia stawia na interdyscyplinarną współpracę z wybitnymi twórcami.
    Debiutancki projekt <em>Kontemplacja Wcielenia</em> (2024) został zarejestrowany przez Jakuba
    Garbacza (Ars Sonora Studio), co otworzyło grupie drogę na ogólnopolskie festiwale — m.in.
    do Archikatedry Łódzkiej pod auspicjami Fundacji Carpe Diem. Wrażliwość zespołu na los
    drugiego człowieka zaowocowała takimi wydarzeniami jak <em>Hymn Poległym</em> w Bazylice
    Mariackiej — modlitwą o pokój na Ukrainie — oraz <em>Aeternam — Epitafium dla Gazy</em>,
    prezentowanym m.in. w krakowskich Mistrzejowicach i Niedzicy.</p>
    <p>VoctEnsemble to także dbałość o wizualny wymiar duchowości. Dzięki współpracy z reżyserką
    świateł Adą Bystrzycką oraz artystami takimi jak Sebastian Kuźma (ART Agencja Rzemieślników
    Teatralnych), koncerty zespołu — m.in. <em>Wołanie Gór</em> czy <em>9 Kart z Księgi
    Psalmów</em> — nabierają formy nowoczesnych misteriów.</p>
    <p>Zespół konsekwentnie buduje swoją tożsamość, opierając ją na jedności artystycznej
    i ludzkiej harmonii. VoctEnsemble to nie tylko głosy — to wspólnota artystyczna, która poprzez
    arcy-elegancką formę i minimalistyczny przekaz dąży do autentycznego spotkania z publicznością,
    przywracając muzyce jej pierwotną siłę dotykania serc.</p>
  logo: "Logotyp"
  # On the page and beside the files in the pack (logo/UZYCIE.txt).
  logoUsage: >-
    Logotypu prosimy używać w jednym kolorze, bez cienia, obrysu i przekształceń proporcji.
    Wersja SVG jest wzorcem; pliki PNG przygotowano na jasne i na ciemne tło. Złoty znak służy
    do publikacji w internecie, wyłącznie na ciemnym tle. Wokół znaku prosimy zostawić odstęp
    nie mniejszy niż wysokość jego poprzeczki.

