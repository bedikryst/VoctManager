# The editorial text of /press — Polish, and Polish only.
#
# WHAT THIS PAGE IS. A counter, not a pitch. Its reader is an editor, an organiser or a
# social-media manager who has already decided to write about the ensemble and needs a text, a
# photograph and a poster before a deadline. So the page leads with the next concert, lets every
# file be seen before it is downloaded, and hands over texts that are already checked.
# docs/specs/web-press-v2-2026-09.md.
#
# FOUR SOURCES, AND ONLY ONE OF THEM IS THIS FILE. The concert kit's texts (release, announcements,
# post, hashtags) are `src/content/press-kits/<concert>.yaml`; the concert's facts come from
# `concerts.yaml`; the registry numbers, accounts and addresses from `src/data/foundation.ts`; the
# social handles from `src/data/social.ts`. What is left here is the page's own voice: the head,
# the rubrics, the section ledes, the usage terms, the biograms.
#
# THE USAGE TERMS ARE A LEGAL STATEMENT and Ania approves them before they ship. They explicitly
# allow cropping and scaling, because every social-media manager crops; a text that forbade any
# modification would forbid the use it exists to permit.
#
# TRANSLATIONS ARE NOT HERE. They would live in `src/content/pages.{en,fr}.yaml` under
# `page.press.` + the dotted path below. There are none: the page is outside TRANSLATED_ROUTES
# while its Polish is being written.
#
# NO TYPOGRAPHY. Write the prose plainly: `lib/typo.ts` pins Polish orphans at build.

