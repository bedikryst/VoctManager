    Zdjęcia, plakat i grafiki z tej paczki można publikować w materiałach redakcyjnych
    i promocyjnych o VoctEnsemble, Fundacji VoctFoundation i ich koncertach: w zapowiedziach,
    relacjach, programach, na plakatach i w mediach społecznościowych. Przy każdym zdjęciu prosimy
    podać autora, w formie z listy niżej. Zdjęcia wolno kadrować, skalować i korygować jasność;
    nie wolno zmieniać ich treści ani łączyć ich z innymi obrazami. Na każde inne użycie, także
    komercyjne, potrzebna jest nasza zgoda.

