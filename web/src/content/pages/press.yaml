# Published coverage — REAL links only. Each entry is a verifiable external document; a headline
# is the publication's own words and is never translated. No pull-quotes until somebody re-reads
# the pieces and picks them by hand.
#
# THE PAGE NO LONGER RENDERS THIS, and the reason is arithmetic rather than taste: four links, but
# TWO events. Gość Niedzielny and Onet/KAI are the same Niedzica evening; the Episkopat photo
# report and the broadcast are the same Bobola Mass. A band headed "our trace in the media" that
# resolves to two evenings reads thinner than saying nothing, and a reader who clicks twice sees
# it in ten seconds.
#
# Nothing is lost by hiding it: these links already ship inside the pack (`nagrania.txt`), which
# is where the one reader who actually wants them — a journalist writing a piece — is looking.
# The poster-maker this page is written for never needed them. So this list stays here as
# ARCHIVE-ONLY copy, on the same footing as `pack.photoUsage` and `pack.logoUsage`.
#
# WHAT BRINGS THE SECTION BACK is not a number of links but a number of distinct EVENINGS: six
# links about two concerts is still two concerts. Three or four separate evenings, or one
# publication with real weight (a review in a national daily, a broadcast feature). Its heading,
# lede and rubric were deleted rather than left standing unrendered — dead copy on the desk
# spends an editor's attention on a band nobody can see.
