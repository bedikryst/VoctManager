# The editorial text of /fundacja — Polish, and Polish only.
#
# The foundation's institutional page: what VoctFoundation is, what it has made, who answers for
# it, and how to support it. Written for someone checking the foundation first — a patron after a
# conversation, a festival, a grant body, a journalist — and for someone who came to give, whom the
# hero sends straight to `#wsparcie`. Spec: docs/specs/web-foundation-rebuild-2026-09.md §4.
#
# Tone: restraint and precision, names and numbers, nothing that sounds like an offer. Impersonal
# or "my"; plain imperative for instructions.
#
# WHAT IS NOT HERE. Every number is data: budgets and accounts from `data/foundationSupport.ts`,
# the record's counts from the concert corpus, registry facts and board functions from
# `data/foundation.ts`. A `{slot}` in a sentence is where the page puts one. The realisation's
# title, date, place, performers and composers come from `concerts.yaml`; the board's domains and
# the statutory goals from /o-nas's copy, their one home.
#
# THE REALISATION SHEET IS SHARED. `realisation.*` labels the module /mecenat prints too; /mecenat
# reads them from here rather than keeping a second copy.
#
# TRANSLATIONS ARE NOT HERE. They live in `src/content/pages.{en,fr}.yaml` under `page.fundacja.` +
# the dotted path below, written by the copy desk. Drafts sit in `copydesk/drafts/{en,fr}/fundacja.yaml`.
#
# NO TYPOGRAPHY. `lib/typo.ts` pins orphans and bindings at build. Spell `&nbsp;` only for a
# binding those rules do not make.

meta:
  title: "Fundacja VoctFoundation | VoctEnsemble"
  description: >-
    VoctFoundation to krakowska fundacja kultury, zaplecze projektów artystycznych zespołu
    VoctEnsemble. Realizacje, ludzie, dokumenty i formy wsparcia: darowizna, mecenat, partnerstwo.

hero:
  eyebrow: "Fundacja VoctFoundation"
  # Two lines; the break is compositional. A translation decides its own split. Anna Marcisz's core
  # sentence ("środki dobiera się do idei, a nie ideę do dostępnych środków") in positive form; the
  # `<em>` is set light against the bold first line.
  title1: "Środki dobieramy"
  title2Html: "<em>do idei.</em>"
  # The paragraph a search result and an assistant quote: what, where, since when, with whom. The
  # third sentence names its subject: after "…jest VoctEnsemble." a bare "Łączy" reads as the
  # ensemble's verb.
  lead: >-
    VoctFoundation to krakowska fundacja kultury, ustanowiona w 2026 roku. Jej zespołem-rezydentem
    jest VoctEnsemble. Fundacja łączy twórców, kompetencje i finansowanie wokół konkretnej idei
    artystycznej, a idea wyznacza formę projektu, jego skład i sposób realizacji.
  supportLink: "Wsparcie"
  registryLink: "Dane i dokumenty"

# The page's index — the rail on desktop, the hero's contents on a phone, and each section's own
# label. The anchors are structural and shared by every locale and by other pages' links; only the
# labels are copy.
index:
  label: "Na tej stronie"
  items:
    - id: "realizacje"
      anchor: "realizacja"
      label: "Realizacje"
    - id: "dorobek"
      anchor: "dorobek"
      label: "Dorobek VoctEnsemble"
    - id: "misja"
      anchor: "misja"
      label: "Misja i ludzie"
    - id: "wsparcie"
      anchor: "wsparcie"
      label: "Wsparcie"
    - id: "dokumenty"
      anchor: "fundacja-i-dokumenty"
      label: "Dane i dokumenty"
  # The realisations entry's name while the foundation has exactly one realisation; from the
  # second one on, the entry's own label above ("Realizacje") prints.
  firstRealisation: "Pierwsza realizacja"

# The realisation module, as both /fundacja and /mecenat print it.
realisation:
  # One lead per realisation, keyed by its id in data/foundationSupport.ts. The page fails the
  # build when a realisation has no lead here. A work's title goes in `<em>`.
  leads:
    - id: "pochwala-stworzenia"
      textHtml: >-
        Koncert inspirowany <em>Laudes creaturarum</em> św. Franciszka z Asyżu. Muzyka prowadzi od
        zachwytu nad stworzeniem ku doświadczeniu człowieka: jego kruchości, przemijaniu i nadziei.
  # The form the rubric above the title names before the year, for a concert of the numbered cycle.
  formCycle: "Koncert Duchowy"
  sheet:
    when: "Kiedy"
    where: "Gdzie"
    performers: "Wykonawcy"
    programme: "Program"
    within: "W ramach"
    admission: "Wstęp"
    budget: "Budżet"
  # `{name}` is the festival's name as the corpus writes it. The second line replaces the first
  # when the corpus confirms the concert closes the festival (`festival.role: finale`).
  festival: "festiwal {name}"
  festivalFinale: "koncert zamykający festiwal {name}"
  admissionFree: "wolny"
  admissionPaid: "biletowany"
  # The budget cell: the amount as a figure beside "wolny", the date under it. `{amount}` is the
  # budget in the locale's grouping, `{date}` the day the board confirmed it.
  budgetAmount: "ok. {amount} zł"
  budgetAsOf: "stan na {date}"
  budgetNote: >-
    Tyle kosztuje koncert w przyjętym kształcie: honoraria wykonawców, rejestracja, transport
    i pobyt. Część pracy koncepcyjnej i organizacyjnej to wkład własny fundacji.
  # Printed while the concert is ahead, then — until its account is entered — the past form.
  whoPaysAhead: "Koszt pokrywają mecenasi, darczyńcy i fundacja. Dzięki temu wstęp jest wolny."
  whoPaysPast: >-
    Koncert odbył się dzięki mecenasom, darczyńcom i fundacji. Jego rozliczenie opublikujemy tutaj.
  account:
    heading: "Rozliczenie"
    total: "Koszt koncertu"
    patrons: "Mecenasi"
    donors: "Darczyńcy"
    partners: "Partnerzy"
    grants: "Granty"
    own: "Wkład własny fundacji"
    note: "Kwoty brutto, stan na {date}."
  concertLink: "Strona koncertu"
  # Opens the vault; printed only while the concert is ahead.
  supportLink: "Wesprzyj ten koncert"

record:
  h2: "VoctFoundation wyrasta z doświadczeń VoctEnsemble."
  bodyHtml: >-
    Od stycznia 2024 roku VoctEnsemble przygotowuje autorskie Koncerty Duchowe, nawiązujące do
    francuskiej tradycji <em>Concerts Spirituels</em>. Każdy program powstaje od początku, dla konkretnego
    miejsca, we współpracy z artystami, realizatorami i instytucjami. Fundacja, ustanowiona
    w kwietniu 2026 roku, daje tej pracy stałe zaplecze: pozwala zapraszać kolejnych twórców
    i budować bardziej złożone produkcje.
  # The three figures are counted from the corpus: the cycle's evenings before the foundation.
  # Each label follows its number; the build fails if a number ever needs another Polish form.
  statProgrammes: "programów"
  statConcerts: "koncertów"
  statFree: "z wolnym wstępem"
  # A rehearsal: who · the context, nothing more (the press pack's caption rule).
  photoCaption: "Florent de Bazelaire · próba VoctEnsemble"
  allLink: "Wszystkie koncerty"

mission:
  # Anna Marcisz's motto, one sentence per line, set roman; only "Człowiek" is italic, as she set it.
  motto1: "Muzyka jest naszym językiem."
  motto2Html: "<em>Człowiek</em> — właściwym tematem."
  body: >-
    Wspieramy twórczość, która wyrasta z doświadczeń istotnych dla człowieka, i tworzymy warunki,
    żeby mogła stać się doświadczeniem wspólnym.
  boardLabel: "Zarząd"
  # The KRS functions, in the register's words; who holds which is data/foundation.ts.
  president: "prezes zarządu"
  vicePresident: "wiceprezes zarządu"
  aboutLink: "O VoctEnsemble"

support:
  # Names the three columns below, in their order.
  h2: "Nasze projekty powstają dzięki darczyńcom, mecenasom i partnerom."
  # Each `quote` is a reason to give, in a supporter's voice, set in italic. Not a testimonial —
  # nobody is being quoted, so there are no quotation marks.
  donation:
    label: "Darowizna"
    quote: "Chcę, żebyście mogli robić dalej to, co robicie."
    body: >-
      Jednorazowo albo co miesiąc, w dowolnej kwocie. Zlecenie stałe ustawiasz w swoim banku i tam
      też je zmieniasz albo odwołujesz.
    # Printed only while the featured realisation is ahead. `{people}` is its budget divided by a
    # year of `{monthly}` a month, rounded up; the build fails if the count needs another form.
    scale: >-
      Budżet jednego koncertu to tyle, ile przez rok wpłaciłyby {people} osoby, przekazując po
      {monthly} zł miesięcznie.
    promise: "Po każdym koncercie publikujemy, ile kosztował i z jakich źródeł go sfinansowano."
    vaultAction: "Wpłać online"
    transferLink: "Dane do przelewu"
  mecenat:
    label: "Mecenat"
    quote: "Chcę być przy powstawaniu określonych rzeczy."
    # Names the patronage contact (MECENAT_CONTACT in data/foundationSupport.ts) in the instrumental
    # case. The name is written here, not filled in; a different contact means a new sentence.
    body: >-
      Mecenas wspiera konkretny projekt od początku: cały koncert albo jego część. Mecenat może
      pozostać prywatny albo wejść do historii projektu. Pierwszym krokiem jest rozmowa z Anną
      Marcisz.
    link: "Mecenat"
  partnership:
    label: "Partnerstwo"
    quote: "Chcemy wesprzeć konkretny projekt tym, co mamy."
    body: >-
      Firmy i instytucje wspierają nas darowizną albo tym, czego potrzebuje projekt: przestrzenią
      na próby, transportem, drukiem, realizacją dźwięku. Z festiwalami, parafiami i instytucjami
      kultury współorganizujemy koncerty. Zakres ustalamy w rozmowie.
    mailLink: "Napisz w sprawie współpracy"
    # Prefilled into the reader's mail client — copy, so a French reader's message arrives with a
    # French subject.
    mailSubject: "Współpraca z VoctFoundation"
    pressLink: "Materiały dla mediów"
    bookingLink: "Zaproś VoctEnsemble na koncert"
    bookingSubject: "Zaproszenie VoctEnsemble"

transfer:
  h3: "Dane do przelewu"
  recipientLabel: "Odbiorca"
  accountLabel: "Numer konta"
  eurLabel: "Konto w euro (dla przelewów z zagranicy)"
  titleLabel: "Tytuł przelewu"
  scope: "Darowizny wspierają działalność statutową fundacji, w tym koncerty VoctEnsemble."
  # Two standing rules. The second is what makes "Wesprzyj ten koncert" more than a project's name
  # on general support: a gift to one concert that exceeds its cost is not lost to the donor's intent.
  namesRule: "Nazwisk darczyńców nie publikujemy; rozliczenie koncertu podaje sumy według źródeł."
  surplusRule: "Jeśli koncert zbierze więcej, niż kosztował, nadwyżka przechodzi na kolejne realizacje."
  # Printed only once the accountant has confirmed it in writing (TAX_LINE_CONFIRMED).
  tax: >-
    Darowiznę można odliczyć od dochodu: w PIT do 6%, w CIT do 10%. Wystarczy potwierdzenie
    przelewu.

join:
  summary: "Wpłacasz przelewem? Daj nam znać."
  note: >-
    Zostaw kontakt, a podziękujemy osobiście. Formularz nie przekazuje pieniędzy i nie uruchamia
    zlecenia.
  # The lawful basis for keeping a supporter's contact details (art. 6(1)(a) RODO). The three data
  # points are named on purpose — a consent that does not say what it covers covers nothing.
  supportConsentHtml: >-
    Wyrażam zgodę na przetwarzanie moich danych (imię, nazwisko, e-mail) w celu kontaktu w sprawie
    wsparcia fundacji, zgodnie z <a href="/polityka-prywatnosci">Polityką prywatności</a>.
  successTitle: "Dziękujemy."
  successBody: "Zgłoszenie trafiło do fundacji."

registry:
  h2: "Dane i dokumenty"
  name: "Nazwa"
  seat: "Siedziba"
  founded: "Ustanowiona"
  supervisionLabel: "Nadzór"
  # The register's own wording (office file kartoteka/dane-rejestrowe.md).
  supervision: "minister właściwy do spraw kultury i ochrony dziedzictwa narodowego"
  representationLabel: "Reprezentacja"
  # § 13 has two modes, and an institution checking a signature needs both.
  representation: >-
    prezes albo wiceprezes zarządu samodzielnie, albo dwóch członków zarządu łącznie (statut, § 13)
  relation: >-
    VoctEnsemble jest zespołem-rezydentem fundacji (statut, § 6 ust. 3). Darowizny przyjmuje
    i umowy zawiera fundacja.
  goalsLabel: "Cele statutowe"
  # The statutory purposes, numbered by the list. Each is a category, then a colon, then what the
  # foundation may do inside it — a shape the statute itself uses and a rendering should keep.
  # `id` is what the desk keys a goal by, so reordering them re-keys nothing.
  goals:
    - id: "tworczosc"
      text: >-
        Twórczość muzyczna: produkcja, koprodukcja, organizacja i prezentacja projektów w kraju
        i za granicą.
    - id: "dziedzictwo"
      text: >-
        Dziedzictwo: dokumentowanie, archiwizowanie i udostępnianie muzyki oraz praktyk
        wykonawczych.
    - id: "edukacja"
      text: "Edukacja i dostępność: popularyzowanie kultury oraz wspieranie uczestnictwa w niej."
    - id: "mlodzi"
      text: "Młodzi artyści: rozwój, promocja, mentoring, rezydencje i projekty wykonawcze."
    - id: "wspolpraca"
      text: >-
        Współpraca: praca z artystami, instytucjami kultury, uczelniami, mediami i organizacjami
        społecznymi.
  # The non-distribution clause, in the statute's own terms. /kontakt states the same fact in one
  # clause ("Dochód przeznaczamy w całości na cele statutowe"); this is the full form, and the two
  # may read differently but may never say different things.
  legalNote: >-
    Dochody fundacji przeznaczane są w całości na realizację celów statutowych. Nie podlegają
    podziałowi między fundatora, członków organów ani osoby związane z fundacją; działalność
    gospodarcza, jeżeli jest prowadzona, pozostaje pomocnicza wobec misji statutowej.
  documentsLabel: "Dokumenty"
  statuteLink: "Statut fundacji (PDF)"
  privacyLink: "Polityka prywatności"
  # Links the terms' own page, /regulamin-darowizn.
  termsLink: "Regulamin darowizn"
  pressLink: "Materiały dla mediów"
  # `{year}` is the foundation's first financial year, `{approvalYear}` the year after it.
  reports: >-
    Pierwsze sprawozdanie, za rok {year}, opublikujemy tutaj po jego zatwierdzeniu
    w {approvalYear} roku.
  socialLead: "Fundacja w mediach społecznościowych:"
  contactLead: "Kontakt z fundacją:"
