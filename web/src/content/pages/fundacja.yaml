# The editorial text of /fundacja — Polish, and Polish only.
#
# The page explains what allows VoctEnsemble's music to continue and gives a person or an
# organisation a practical way to help. It is the foundation's home on the ensemble's site, and it
# reads as the practical pages of a concert programme: a human opening, an account of preparation,
# then particulars a reader can act on. Brief: docs/specs/web-foundation-brief-2026-09.md.
#
# WHAT IS NOT HERE. The recipient, the accounts and the registry numbers come from
# `data/foundation.ts`; the transfer title from the vault's config; the featured concert and the
# two record programmes from the concert corpus (`data/foundationSupport.ts` only points at them);
# the board's role lines from /o-nas's copy (one home, no drift); the foundation's mission
# sentence from /kontakt's. This file holds only what this page says in its own voice.
#
# NO NUMBERS THAT ARE NOT APPROVED. The cost band names categories and what each enables. It
# carries no totals, percentages, secured sums or a goal — the board has approved none, and an
# empty cell would be a claim. The standing-order amounts are examples and say so.
#
# TRANSLATIONS ARE NOT HERE. They live in `src/content/pages.{en,fr}.yaml` under `page.fundacja.` +
# the dotted path below, written by the copy desk. Drafts sit in `copydesk/drafts/{en,fr}/fundacja.yaml`.
#
# NO TYPOGRAPHY. `lib/typo.ts` pins orphans and bindings at build. Spell `&nbsp;` only for a
# binding those rules do not make.

meta:
  title: "Fundacja i wsparcie — VoctEnsemble | Fundacja VoctFoundation"
  description: >-
    Fundacja VoctFoundation tworzy zaplecze organizacyjne i finansowe VoctEnsemble. Zobacz,
    z czego powstaje koncert, i pomóż przygotować kolejne programy cyklu Concerts Spirituels —
    regularnie, jednorazowo albo jako firma lub instytucja.

hero:
  # Gloss of the Latin rubric `Fundatio`, which the site already uses for the foundation on
  # /kontakt and /kolofon and which stays in the markup unchanged in every locale.
  eyebrow: "Fundacja VoctFoundation"
  # Two lines; the break is compositional. A translation decides its own split.
  title1: "Żeby muzyka"
  title2Html: "miała <em>ciąg dalszy.</em>"
  lede: >-
    VoctFoundation tworzy zaplecze organizacyjne i finansowe VoctEnsemble. Pomagamy przygotowywać
    kolejne koncerty cyklu Concerts Spirituels — od pracy nad programem i prób po spotkanie
    z publicznością.
  primary: "Chcę wesprzeć"
  secondary: "Dla firm i instytucji"
  indexLabel: "Na tej stronie"
  # The anchors are structural and identical in every locale: /mecenat redirects to
  # `/fundacja#mecenat`, and other pages link to these ids. Only the labels are copy.
  index:
    - id: "koszty"
      anchor: "na-co-ida-srodki"
      label: "Na co idą środki"
    - id: "mecenat"
      anchor: "mecenat"
      label: "Mecenat"
    - id: "partnerstwo"
      anchor: "partnerstwo"
      label: "Partnerstwo"
    - id: "dokumenty"
      anchor: "fundacja-i-dokumenty"
      label: "Fundacja i dokumenty"

costs:
  # Gloss of `Impensae`.
  eyebrow: "Na co idą środki"
  h2: "Z czego powstaje koncert"
  intro: >-
    Publiczność słyszy gotowy program. Wsparcie idzie na to, czego nie słychać: na przygotowanie
    i na ludzi, którzy je wykonują.
  body: >-
    Zanim spotkamy się na koncercie, trzeba ułożyć program, zdobyć partytury i przepracować go
    na próbach. Potem dochodzą dojazdy oraz — tam, gdzie wymaga tego wnętrze — realizacja dźwięku
    i światła. Wsparcie pomaga pokryć tę pracę, przede wszystkim honoraria śpiewaków.
  itemsLabel: "Z czego składa się koszt"
  # Ordered by weight, as the landing already states it: fees first, then scores, rehearsals,
  # travel, production. Categories and what each enables — no amounts, no shares.
  items:
    - id: "honoraria"
      term: "Honoraria śpiewaków"
      what: >-
        Największy koszt każdego koncertu. Zespół tworzą zawodowi śpiewacy — próby i wieczór
        koncertowy to ich praca.
    - id: "partytury"
      term: "Partytury i program"
      what: "Zakup nut, opracowanie programu i materiały dla śpiewaków."
    - id: "proby"
      term: "Próby"
      what: "Sala i cykl prób, w których program nabiera kształtu, zanim usłyszy go publiczność."
    - id: "dojazdy"
      term: "Dojazdy"
      what: "Podróż zespołu na próby i na koncerty poza Krakowem."
    - id: "realizacja"
      term: "Dźwięk i światło"
      what: "Realizacja tam, gdzie wymaga jej wnętrze i program. Nie każdy koncert jej potrzebuje."
  current:
    # Two complete states over the same concert, decided at build: ahead → the first label; sung →
    # the second. The page never picks a newer concert on its own (data/foundationSupport.ts).
    labelAhead: "Nad czym teraz pracujemy"
    labelPast: "Ostatni przygotowany program"
    programLink: "Zobacz program →"
    note: >-
      To przykład bieżącej pracy zespołu, nie osobna zbiórka. Darowizny wspierają działalność
      statutową fundacji, w tym ten i kolejne koncerty.

record:
  # Gloss of `Opera`.
  eyebrow: "Dorobek"
  h2: "Muzyka, która już wybrzmiała"
  intro: >-
    Każdy z tych programów został ułożony od początku: repertuar, dramaturgia wieczoru i wnętrze,
    w którym miał zabrzmieć. To dorobek VoctEnsemble — i miara tego, na co idzie wsparcie.
  allLink: "Poznaj pozostałe koncerty →"

support:
  # Gloss of `Auxilium`.
  eyebrow: "Wsparcie"
  h2: "Pomóż przygotować kolejne koncerty"
  intro: "Dwie proste drogi. Regularna pierwsza, bo to ona pozwala planować."
  monthly:
    label: "Wspieraj co miesiąc"
    body: >-
      Regularne wsparcie pomaga planować próby i kolejne programy z wyprzedzeniem. Zlecenie stałe
      ustawiasz w swoim banku; tam też zmieniasz kwotę lub je odwołujesz — bez kontaktu z nami.
    # `{amounts}` is replaced with the examples from data/foundationSupport.ts, listed per locale
    # ("50, 100 lub 200"). The unit stays in the sentence, where a translation can place it.
    amounts: "Na przykład {amounts} zł miesięcznie. To przykłady, nie progi — każda kwota jest mile widziana."
    transferLink: "Dane do przelewu"
  once:
    label: "Wesprzyj jednorazowo"
    body: "Wpłać online przez bramkę płatności albo zrób zwykły przelew na konto fundacji."
    vaultAction: "Wpłać online"
    transferLink: "Wolę zwykły przelew"

transfer:
  h3: "Dane do przelewu"
  recipientLabel: "Odbiorca"
  accountLabel: "Numer konta"
  eurLabel: "Konto w euro"
  eurNote: "Dla przelewów spoza Polski."
  titleLabel: "Tytuł przelewu"
  standingOrderHint: "Zlecenie stałe: te same dane, w Twoim banku, z wybraną częstotliwością."
  scope: >-
    Darowizny wspierają działalność statutową VoctFoundation, w tym przygotowanie koncertów
    VoctEnsemble.

join:
  h3: "Daj nam znać, że dołączasz"
  body: >-
    Jeśli ustawiasz zlecenie stałe, zostaw nam kontakt — podziękujemy osobiście i damy znać, co
    powstało z Twojego wsparcia. Formularz jest dobrowolny: nie przekazuje pieniędzy i nie
    uruchamia zlecenia.
  # The lawful basis for keeping a patron's contact details (art. 6(1)(a) RODO). The three data
  # points are named on purpose — a consent that does not say what it covers covers nothing.
  consentHtml: >-
    Wyrażam zgodę na przetwarzanie moich danych (imię, nazwisko, e-mail) w celu kontaktu w sprawie
    mecenatu, zgodnie z <a href="/polityka-prywatnosci">Polityką prywatności</a>.
  successTitle: "Dziękujemy za zgłoszenie."
  successBody: >-
    Przekazaliśmy je fundacji. Jeśli chcesz wspierać nas regularnie, ustaw zlecenie stałe w swoim
    banku.
  # Followed by the patronage address as a link, so the sentence has to end pointing at it.
  contactLead: "Pytania o wsparcie:"

partnership:
  # Gloss of `Societas`.
  eyebrow: "Partnerstwo"
  h2: "Współtwórz z nami koncert"
  intro: >-
    Firma, instytucja, parafia, festiwal — są trzy rzeczy, o których możemy porozmawiać.
  rows:
    - id: "produkcja"
      term: "Wsparcie konkretnej produkcji"
      what: >-
        Udział w kosztach uzgodnionego koncertu albo jednej, nazwanej pozycji — na przykład
        honorariów lub partytur.
    - id: "ciaglosc"
      term: "Wsparcie ciągłości"
      what: >-
        Współpraca na określony czas wokół działalności koncertowej zespołu — sezon albo cykl
        programów.
    - id: "zasoby"
      term: "Zasoby zamiast pieniędzy"
      what: >-
        Przestrzeń na próby lub koncert, transport, druk, realizacja — tam, gdzie odpowiada to
        realnej potrzebie. To możliwości do omówienia, nie lista braków.
  next: >-
    Napisz, jaki projekt lub rodzaj współpracy Cię interesuje. Ustalimy zakres wsparcia, sposób
    podziękowania i podsumowanie realizacji.
  thanks: >-
    Podziękowanie ustalamy razem: wzmianka lub logo w programie i na stronie koncertu — tam, gdzie
    pozwala na to miejsce i organizator.
  mailLabel: "Napisz w sprawie współpracy"
  # Prefilled mail subject — copy, so a French reader's message arrives with a French subject.
  mailSubject: "Współpraca z VoctFoundation"
  bookingLead: "Chcesz zaprosić zespół na koncert?"
  bookingLink: "Napisz na adres koncertowy →"
  bookingSubject: "Zaproszenie VoctEnsemble"

who:
  # Gloss of `Fundatio`, again — this is the section /kontakt and /o-nas send a reader to.
  eyebrow: "Fundacja i dokumenty"
  h2: "Kto za tym stoi"
  relation: >-
    VoctEnsemble jest zespołem-rezydentem Fundacji VoctFoundation: zespół śpiewa, fundacja
    organizuje, rozlicza i odpowiada za dane. Wpłaty przyjmuje fundacja.
  boardLabel: "Zarząd fundacji"
  boardNote: "Odpowiadamy wspólnie. Pytania o wsparcie kieruj na adres patronatu — trafią do całej trójki."
  identityLabel: "Dane fundacji"
  documentsLabel: "Dokumenty"
  statuteLink: "Statut fundacji (PDF)"
  privacyLink: "Polityka prywatności"
  # The donation terms exist inside the vault only, so this opens the vault where they are read.
  termsLink: "Regulamin darowizn — przy wpłacie online"
  help:
    label: "Krótko"
    items:
      - id: "zlecenie"
        q: "Czy mogę zmienić albo odwołać zlecenie stałe?"
        a: "Tak, w każdej chwili — w swoim banku, bez kontaktu z nami."
      - id: "formularz"
        q: "Czy muszę wypełnić formularz, żeby wpłacić?"
        a: "Nie. Formularz jest dobrowolny; do przelewu wystarczą dane konta."
      - id: "kontakt"
        q: "Do kogo napisać w sprawie wsparcia?"
        a: "Na adres patronatu poniżej — czyta go zarząd fundacji."
      - id: "dokumenty"
        q: "Gdzie są dokumenty fundacji?"
        a: "Statut, polityka prywatności i regulamin darowizn są obok. Wpis w KRS można sprawdzić po numerze powyżej."
  contactLabel: "Kontakt w sprawie wsparcia"
