page.skarbiec.qr.hintHtml: "Open your bank's app, choose <strong>“QR transfer”</strong> and scan. You enter the amount in the app."
page.skarbiec.qr.note: "Scan the code with the camera in your banking app — every field fills itself in."
page.skarbiec.qr.recurringLabel: "Monthly support · standing order"
page.skarbiec.qr.recurringNoteHtml: "Would you like to support the cycle regularly? Copy the details above and set them up in your banking app as a <strong>standing order</strong> (under “standing orders” / “recurring payments”) — say 25, 50 or 100 zł a month. The QR code above makes a one-off transfer; a recurring order is entered by hand. It stays entirely under your control — you can change or cancel it at any time in your banking, without contacting us. No commission, and no card details to hand over."
