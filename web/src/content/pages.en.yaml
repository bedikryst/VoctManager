page.kontakt.after.languages: "Write in Polish, English or French — we answer in the language you begin in. As quickly as the rehearsal and concert calendar allows; usually within a few days."
page.kontakt.after.pressHtml: "Journalists and promoters will find biographies, high-resolution photographs and full programmes in the <a href=\"/press\">press materials →</a>"
page.kontakt.channels.eyebrow: "Three doors"
page.kontakt.channels.h2: "Tell us what brings you."
page.kontakt.channels.introHtml: "We have laid the post out across three addresses, so that a message goes straight to the matter it concerns. Behind all three are <em>the same three people</em> — the foundation's board."
page.kontakt.channels.items.booking.hint: "Tell us where and when: the name of the place, a rough date, the occasion. We will write back with a programme shaped for that acoustic."
