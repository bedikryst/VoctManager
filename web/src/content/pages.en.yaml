page.o-nas.cantus.eyebrow: "What we sing"
page.o-nas.cantus.h2: "Music as a reflection of the soul of the word."
page.o-nas.cantus.lead: "We share song and carefully considered narratives — woven from works in which music and word are each other's mirror image."
page.o-nas.cantus.moreLink: "Seven centuries of repertoire — from Renaissance polyphony to the present day →"
page.o-nas.cantus.p2: "The world interests us: the visible one — nature and all creation — and the immaterial one we seek and try to understand. Sacred music is a good companion on that journey."
page.o-nas.cantus.p3: "It draws on human genius, on the Bible and on the wisdom of our forebears — to which composers still reach in order to express, in a wholly personal way, what they live through and what touches them most."
page.o-nas.cta.concerts: "Spiritual Concerts"
page.o-nas.cta.h2: "Invite us into a space that needs a voice."
page.o-nas.cta.lede: "A spiritual concert, music for a liturgy, an important celebration, patronage or an artistic collaboration. We look forward to hearing from you."
page.o-nas.cta.support: "Support the foundation"
page.o-nas.cta.write: "Write to us"
page.o-nas.doings.cards.dialog.body: "We sang during the 28th Day of Judaism in the Catholic Church, in Kraków's Chapel of St Dorothy, and performed at the Tempel Synagogue — music as a meeting place."
page.o-nas.doings.cards.dialog.title: "A dialogue of traditions"
page.o-nas.doings.cards.koncerty.body: "Our own cycle — a contemporary form of the old Concerts Spirituels. Evening after evening, built around separate intentions."
page.o-nas.doings.cards.koncerty.cta: "See the path of the concerts →"
page.o-nas.doings.cards.koncerty.title: "Spiritual Concerts"
page.o-nas.doings.cards.liturgia.body: "Music for Mass and church feasts. Most recently — the liturgy for the feast of St Andrew Bobola in Warsaw, marking the centenary of the Polish Jesuit provinces."
page.o-nas.doings.cards.liturgia.title: "Liturgy and celebrations"
page.o-nas.doings.cards.sluby.body: "We have provided music for wedding liturgies at St Anne's Collegiate Church in Kraków and at the Benedictine Abbey in Tyniec. We are available for such occasions."
page.o-nas.doings.cards.sluby.title: "Weddings and sacraments"
page.o-nas.doings.eyebrow: "What we do"
page.o-nas.doings.h2: "Spiritual concerts, liturgy, occasions that matter."
page.o-nas.doings.lead: "Our main current is the Spiritual Concerts — a contemporary form of the old Concerts Spirituels. Beyond them we sing in the liturgy: Masses, feasts and celebrations we are invited to."
page.o-nas.ensemble.collabLabel: "Collaboration"
page.o-nas.ensemble.collabText: "On stage and in production we work with, among others, lighting director Ada Bystrzycka, sound engineer Jakub Garbacz (Ars Sonora Studio), Sebastian Kuźma (visual animation) and violinist Radu Ropotan; and, institutionally, with the Carpe Diem Foundation and the Norwid Cultural Centre in Kraków's Mistrzejowice district."
page.o-nas.ensemble.eyebrow: "The ensemble"
page.o-nas.ensemble.h2: "A Kraków vocal ensemble led as a chamber community."
page.o-nas.ensemble.lead: "On stage there are usually twelve voices — professional and pre-professional musicians. Depending on the piece, we sing as a quartet, as an octet, or at full strength."
page.o-nas.ensemble.p2: "The line-up is alive: around a stable core, the roster changes from project to project — we choose the voices to fit the programme and the space it has to sound in."
page.o-nas.ensemble.p3Html: "Under the direction of Florent de Bazelaire we build a sound in which discipline and tenderness hold together. The name joins <em>voces</em> (voices), <em>octo</em> (eight) and <em>ensemble</em> — a promise of voices that listen to one another."
page.o-nas.foundation.eyebrow: "The foundation"
page.o-nas.foundation.goals.dziedzictwo.text: "Heritage: documenting, archiving and sharing music and performance practice."
page.o-nas.foundation.goals.edukacja.text: "Education and access: fostering culture and supporting participation in it."
page.o-nas.foundation.goals.mlodzi.text: "Young artists: development, promotion, mentoring, residencies and performance projects."
page.o-nas.foundation.goals.tworczosc.text: "Musical creation: production, co-production, organisation and presentation of projects at home and abroad."
page.o-nas.foundation.goals.wspolpraca.text: "Collaboration: working with artists, cultural institutions, universities, media and civil-society organisations."
page.o-nas.foundation.h2: "A form that lets music endure."
page.o-nas.foundation.lead: "The VoctFoundation is the legal and organisational backbone of the artistic work. It is what lets the ensemble think not only about the next concert, but about an archive, education, production and the long life of the repertoire."
page.o-nas.foundation.legalNote: "The Foundation's income is devoted entirely to its statutory purposes. It is not distributed among the founder, the members of its bodies, or persons connected with the Foundation; any economic activity, if conducted, remains ancillary to the statutory mission."
page.o-nas.foundation.p2Html: "By its statute, the Foundation works in the field of <strong>culture, the arts, and the protection of cultural goods and national heritage</strong>. It may run artistic and interdisciplinary projects, make recordings, support young artists, and act through a permanent artistic ensemble in a resident-ensemble arrangement."
page.o-nas.foundation.statuteLabel: "Foundation statute ↗"
page.o-nas.governance.eyebrow: "The board"
page.o-nas.governance.h2: "Responsibility scored for three voices."
page.o-nas.governance.intro: "Artistic direction is set by one person; the foundation's decisions are taken by majority vote — that is what the statute provides. The same people then stand backstage on the night of the concert."
page.o-nas.governance.roles.ania.role: "Organisation · communication"
page.o-nas.governance.roles.florent.role: "Artistic direction · conductor"
page.o-nas.governance.roles.krystian.role: "Technology · tools"
page.o-nas.hero.eyebrow: "About"
page.o-nas.hero.lede: "VoctEnsemble — a Kraków vocal ensemble and the resident ensemble of the VoctFoundation. We begin with three questions: where we came from, what we do, and what we sing."
page.o-nas.hero.scrollCue: "Read the letter"
page.o-nas.hero.title1: "It began"
page.o-nas.hero.title2Html: "with <em>longing.</em>"
page.o-nas.letter.eyebrow: "Founder's letter"
page.o-nas.letter.h2: "Where did we come from?"
page.o-nas.letter.leadHtml: "Florent de Bazelaire answers."
page.o-nas.letter.portraitAlt: "Florent de Bazelaire conducting VoctEnsemble"
page.o-nas.letter.portraitCaption: "Florent de Bazelaire · artistic direction"
page.o-nas.letter.signatureMeta: "artistic direction · 2024"
page.o-nas.letter.stanzas.I.label: "Out of longing"
page.o-nas.letter.stanzas.I.paraHtml: "Out of longing, inspiration and a dream. Like anchorites, in seclusion, far from the clamour and from music, a longing for music was born. A vision of music as a breath of the spirit that transforms the world with its polyphony, enfolding a person and reaching into their depths — resonating and finding a place in the soul like a living organism."
page.o-nas.letter.stanzas.II.label: "In silence"
page.o-nas.letter.stanzas.II.paraHtml: "In silence, music is born. In silence, one contemplates. Music is the soul's contemplation in time. So Voct came to be — out of silence and contemplation."
page.o-nas.letter.stanzas.III.label: "Exchange"
page.o-nas.letter.stanzas.III.paraHtml: "The exchange of thought, and the attempt to immerse oneself in another person's reading, kindled musical invention and opened new paths of interpretation. Interpretation rests on an exchange of human skills and intuitions that weave together, dynamically, to uncover the depths hidden within a work."
page.o-nas.letter.stanzas.IV.label: "Fragility"
page.o-nas.letter.stanzas.IV.paraHtml: "We would not feel ourselves singing music that did not embrace the whole person, touch their depths, and try to enthral them with beauty in spite of their complexity and fragility."
page.o-nas.meta.description: "VoctEnsemble — a Kraków vocal ensemble and the resident ensemble of the VoctFoundation. Spiritual concerts, liturgies and sacred music from medieval polyphony to contemporary minimalism."
page.o-nas.meta.title: "About — VoctEnsemble | VoctFoundation"
page.o-nas.milestones.cardLink: "Concert page →"
page.o-nas.milestones.eyebrow: "What has sounded"
page.o-nas.milestones.h2: "A short road, but already marked by places and intentions."
page.o-nas.milestones.moreLink: "See the repertoire and concert details →"
page.o-nas.plate.quote: "Above all, we share."
page.obrazy.colophon.back: "Back to the Spiritual Concerts"
page.obrazy.colophon.eyebrow: "Photographs"
page.obrazy.colophon.note: "The remaining photographs come from the ensemble's own archive."
page.obrazy.head.eyebrow: "Photographic archive"
page.obrazy.head.lede: "This is everything left of those evenings apart from the sound. The photographs run in the order they were taken — from the first rehearsal to the last concert."
page.obrazy.head.title: "Images"
page.obrazy.meta.description: "VoctEnsemble's photographic archive. Documentary photographs of the Spiritual Concerts, in the order the evenings happened."
page.obrazy.meta.galleryName: "Images — photographs of the Spiritual Concerts"
page.obrazy.meta.title: "Images — photographs of the Spiritual Concerts · VoctEnsemble"
page.polityka-prywatnosci.head.kicker: "Document · GDPR"
page.polityka-prywatnosci.head.ledeHtml: "The <em>voctensemble.com</em> website is an informational website and a channel for receiving donations towards the Foundation's statutory purposes. We use no marketing cookies and no analytics tools, we do not profile our visitors, and we take no automated decisions about them. Below we set out precisely what data may be processed while you use the site — including while you make a donation — and who is responsible for it."
page.polityka-prywatnosci.head.tocLabel: "Contents"
page.polityka-prywatnosci.history.entries.v1-0.note: "The original version of the policy, published together with the launch of the voctensemble.com site."
page.polityka-prywatnosci.history.entries.v1-1.note: "Clarified how an online payment proceeds: payment follows a redirect onto the operator's hosted page, and full payment details do not pass through the Foundation's servers. Added an account of recurring transfers (standing orders) as a form of regular support. Added the handling of the patronage form (submissions recorded: first name, surname, e-mail — on the basis of consent; data held on servers in the European Union)."
page.polityka-prywatnosci.history.entries.v1-2.note: "Added § 12: the policy is also published in English and French translation, the Polish version remaining the binding one. Clarified § 4: the payment is handled by the operator — the earlier wording spoke of the Foundation acting as an intermediary in transmitting payment data, which contradicted § 11."
page.polityka-prywatnosci.history.label: "Version history"
page.polityka-prywatnosci.meta.description: "What data we process and why. Privacy policy of the VoctFoundation (voctensemble.com)."
page.polityka-prywatnosci.s1.p1Html: "The controller of the personal data processed in connection with your use of the <em>voctensemble.com</em> website is:"
page.polityka-prywatnosci.s1.p2: "The Foundation pursues statutory purposes in the field of culture and sacred art. This site is its informational website and a channel for receiving donations."
page.polityka-prywatnosci.s1.title: "Data controller"
page.polityka-prywatnosci.s10.gateway.items.fraud.text: "detect abuse (fraud detection, device fingerprinting),"
page.polityka-prywatnosci.s10.gateway.items.sca.text: "handle 3-D Secure / Strong Customer Authentication (PSD2 SCA)."
page.polityka-prywatnosci.s10.gateway.items.session.text: "authorise the payment and maintain its session,"
page.polityka-prywatnosci.s10.gateway.items.tokenization.text: "tokenise card data,"
page.polityka-prywatnosci.s10.gateway.p1Html: "When you press “Support us” you are redirected to the operator's hosted payment page. It is on that page — already outside voctensemble.com — that the <strong>technical JavaScript libraries supplied by BNP Paribas / PayU</strong> load, and they may set cookies or use other browser storage mechanisms in order to:"
page.polityka-prywatnosci.s10.gateway.p2Html: "These mechanisms are <strong>strictly necessary</strong> to carrying out a payment safely and require no separate consent. The controller of the data processed by those scripts is <em>BNP Paribas Bank Polska S.A.</em> and — for card payments — <em>PayU S.A.</em>, on the terms set out in their privacy policies (the links are in “Recipients of the data”). They never appear on our site: they run only on the operator's page, after the redirect, once you begin the payment."
page.polityka-prywatnosci.s10.gateway.title: "The payment gateway's technical scripts and cookies"
page.polityka-prywatnosci.s10.own.p1Html: "<strong>We use no cookies of our own</strong> — neither analytical nor marketing. The site carries no Google Analytics, no Meta Pixel and no comparable profiling tool."
page.polityka-prywatnosci.s10.own.title: "Our own cookies"
page.polityka-prywatnosci.s10.storage.items.audio.note: "Your choice at the entrance gate (“with voice” / “in silence”). The entry expires 3 hours after it is written."
page.polityka-prywatnosci.s10.storage.items.preloaderLastLoad.note: "A technical timestamp of the document's last load, used for one thing only: telling a page reload apart from navigation within the site."
page.polityka-prywatnosci.s10.storage.items.preloaderSeen.note: "A flag recording that you have already seen the entrance rite in this session; it lets the site skip the rite when you return to the home page from a subpage. Cleared automatically when the tab is closed and when the page is reloaded."
page.polityka-prywatnosci.s10.storage.p1: "We use the browser's localStorage and sessionStorage solely to remember a few technical interface preferences. None of the entries below identifies a user, none contains personal data, and none serves any tracking purpose. They are “strictly necessary” to functions of the site that you have chosen — which, under recital 30 of Directive 2002/58/EC and the case law, means they require no prior consent."
page.polityka-prywatnosci.s10.storage.title: "The browser's localStorage and sessionStorage"
page.polityka-prywatnosci.s10.title: "Cookies, localStorage and third-party scripts"
page.polityka-prywatnosci.s11.items.cards.textHtml: "<strong>We store no full payment card details and no BLIK codes</strong> on the Foundation's servers — you enter them directly on the operator's hosted page (Axepta BNP Paribas / PayU), which tokenises them and answers for their security under the PCI DSS standard."
page.polityka-prywatnosci.s11.items.hsts.textHtml: "We enforce <em>HTTP Strict Transport Security</em> (HSTS) with preload — a browser will not allow an unencrypted connection to our domain."
page.polityka-prywatnosci.s11.items.mailboxes.textHtml: "E-mail addresses are held in mailboxes protected by multi-factor authentication."
page.polityka-prywatnosci.s11.items.relay.textHtml: "Our server is not an intermediary in the transmission of payment data — all we pass to the gateway is the amount, the currency, the e-mail address and the donation identifier, over an encrypted TLS connection alone, in order to generate the link to the payment page."
page.polityka-prywatnosci.s11.items.tls.textHtml: "The site is served only over an encrypted <strong>HTTPS (TLS 1.3)</strong> connection."
page.polityka-prywatnosci.s11.title: "Security"
page.polityka-prywatnosci.s12.p1: "We update the policy whenever the way we process data changes — when we add a payment method, add a form, or change our technical infrastructure. Every change carries a new version number and a date from which it applies (at the head of this document)."
page.polityka-prywatnosci.s12.p2: "This policy is published in Polish, and also in English and French translation. The Polish version is the binding one; the translations are for information only, and in the event of any discrepancy between the language versions the Polish wording prevails."
page.polityka-prywatnosci.s12.p3Html: "You may always obtain the full history of changes by writing to <a href=\"mailto:rodo@voctensemble.com\">rodo@voctensemble.com</a>."
page.polityka-prywatnosci.s12.title: "Changes to this policy"
page.polityka-prywatnosci.s2.cardNote: "or by post, to the Foundation's registered office"
page.polityka-prywatnosci.s2.p1: "For anything to do with the processing of personal data, please write to:"
page.polityka-prywatnosci.s2.p2: "We have not appointed a Data Protection Officer — the scope and nature of our processing do not require one (art. 37 GDPR)."
page.polityka-prywatnosci.s2.title: "Contact about your data"
page.polityka-prywatnosci.s3.audio.p1Html: "When you choose “Enter with voice” or “Enter in silence”, we save your choice in your browser's local storage (<em>localStorage</em>) under the key <code>voct.demo.audio</code>. The entry expires after 3 hours and holds nothing but the preference and a timestamp. It is not personal data and it never leaves your browser."
page.polityka-prywatnosci.s3.audio.title: "Audio preference (localStorage)"
page.polityka-prywatnosci.s3.donors.p1: "When a donation is made, we process the data needed to carry out the transaction, to issue any donation certificate, and to meet the Foundation's accounting obligations. What is processed, and how, depends on the method chosen:"
page.polityka-prywatnosci.s3.donors.title: "Donors"
page.polityka-prywatnosci.s3.email.p1: "If you write to one of our addresses, we process the data contained in that correspondence — the sender's e-mail address, the signature, the content of the message — solely in order to reply."
page.polityka-prywatnosci.s3.email.title: "E-mail correspondence"
page.polityka-prywatnosci.s3.gateway.items.handoff.textHtml: "Once you have chosen an amount and given an e-mail address, our server passes the gateway only <strong>the amount, the currency, the e-mail address and the donation identifier</strong>, and receives in return a single-use link to a payment page."
page.polityka-prywatnosci.s3.gateway.items.redirect.textHtml: "You are redirected to the <strong>operator's hosted payment page</strong>, where you enter your payment details directly (a BLIK code, card details, or your choice of bank for an instant transfer). When it is done you return to our site with the status of the transaction."
page.polityka-prywatnosci.s3.gateway.p1Html: "We use the <strong>Axepta BNP Paribas</strong> payment gateway, operated by <em>BNP Paribas Bank Polska S.A.</em> For card transactions the acquirer is <em>PayU S.A.</em> Payment follows a redirect model, onto the operator's own secure page:"
page.polityka-prywatnosci.s3.gateway.p2Html: "Full payment details (card number, BLIK code, online banking credentials) are entered on the operator's page and nowhere else — <strong>they do not pass through the Foundation's servers and we do not store them</strong>. It is the operator that tokenises them and that carries the burden of authorisation and the security obligations of the <strong>PCI DSS</strong> standard. On the Foundation's side we keep only the donor's e-mail address, the amount, the currency, the date, the transaction identifier and its status — no more than is needed for our accounting records and to issue a confirmation of the donation."
page.polityka-prywatnosci.s3.gateway.title: "The Axepta BNP Paribas payment gateway (BLIK, instant transfers, Apple Pay, Google Pay, cards)"
page.polityka-prywatnosci.s3.patronage.p1Html: "If you decide to join the patrons of the cycle and fill in the form in the “Patronage” section, we process the <strong>first name, surname and e-mail address</strong> you give us. We record them for one purpose only: to be in touch with you about regular support. The form <strong>collects no payment details whatsoever</strong> — the support itself is made by transfer (a standing order) that you set up and control in your own banking. Your data is held on our servers in the European Union; the internal notice of a new submission that we send ourselves <strong>contains none of your personal data</strong>."
page.polityka-prywatnosci.s3.patronage.title: "Joining the patrons (the regular-support form)"
page.polityka-prywatnosci.s3.title: "What data we process"
page.polityka-prywatnosci.s3.transfer.p1: "The data comes from the transfer instruction itself (sender, reference, amount) and reaches us only through the bank that holds our account. The same applies to recurring transfers (standing orders): setting one up, changing it and cancelling it all happen entirely within the donor's own banking — we store neither your card details nor a debit mandate for the purpose, and the instruction remains under your sole control."
page.polityka-prywatnosci.s3.transfer.title: "Bank transfer (one-off or standing order)"
page.polityka-prywatnosci.s3.visitors.items.headers.text: "HTTP headers (browser type, language and referrer, among others),"
page.polityka-prywatnosci.s3.visitors.items.ip.text: "the device's IP address,"
page.polityka-prywatnosci.s3.visitors.items.resource.text: "the address of the resource requested."
page.polityka-prywatnosci.s3.visitors.items.timestamp.text: "the date and time of the request,"
page.polityka-prywatnosci.s3.visitors.p1: "Simply opening the site causes technical data to be processed automatically by the hosting servers and the content delivery networks (CDN):"
page.polityka-prywatnosci.s3.visitors.p2: "These are standard HTTP server logs. We do not combine them with any other data and we do not use them for profiling or marketing. They serve only to keep the site running and secure (blocking abusive traffic, for instance)."
page.polityka-prywatnosci.s3.visitors.title: "Visitors to the site"
page.polityka-prywatnosci.s3.zrzutka.p1Html: "What data is processed is determined by Zrzutka.pl's own policy; within that service the controller of contributors' data is <em>Zrzutka Sp. z o.o.</em>"
page.polityka-prywatnosci.s3.zrzutka.title: "Zrzutka.pl"
page.polityka-prywatnosci.s4.items.claims.textHtml: "<strong>Establishing, pursuing or defending claims</strong> — art. 6(1)(f) GDPR, the Foundation's legitimate interest (in connection with a mistaken payment or a dispute, for instance)."
page.polityka-prywatnosci.s4.items.correspondence.textHtml: "<strong>Replying to correspondence</strong> — art. 6(1)(f) GDPR, our legitimate interest in communicating with people interested in the Foundation's work."
page.polityka-prywatnosci.s4.items.donation.textHtml: "<strong>Carrying out a donation</strong> — art. 6(1)(b) GDPR (necessary for the performance of the donation contract) together with (c) (legal obligations relating to a foundation's accounts and reporting). To that extent the payment is handled by the operator Axepta BNP Paribas / PayU."
page.polityka-prywatnosci.s4.items.hosting.textHtml: "<strong>Keeping the site running and secure</strong> (server logs) — art. 6(1)(f) GDPR, the controller's legitimate interest in the continuity and security of the site."
page.polityka-prywatnosci.s4.items.patronage.textHtml: "<strong>Contact about patronage</strong> — art. 6(1)(a) GDPR (the consent you give in the form). You may withdraw that consent at any time by writing to <a href=\"mailto:rodo@voctensemble.com\">rodo@voctensemble.com</a>; withdrawal does not affect the lawfulness of processing carried out before it."
page.polityka-prywatnosci.s4.items.receipt.textHtml: "<strong>Issuing a donation certificate</strong> — art. 6(1)(c) GDPR, in performance of obligations arising from tax law."
page.polityka-prywatnosci.s4.p1: "We process your data for the following purposes and on the following legal bases under the GDPR:"
page.polityka-prywatnosci.s4.title: "Purposes and legal bases"
page.polityka-prywatnosci.s5.items.accountant.badge: "Accountancy office"
page.polityka-prywatnosci.s5.items.accountant.textHtml: "<strong>The Foundation's accountancy office</strong> — to the extent needed to keep the books and the record of donations."
page.polityka-prywatnosci.s5.items.bnp.badge: "BNP Paribas"
page.polityka-prywatnosci.s5.items.bnp.textHtml: "<strong>BNP Paribas Bank Polska S.A.</strong> (ul. Kasprzaka 2, 01-211 Warszawa) — operator of the <em>Axepta BNP Paribas</em> gateway. It processes transaction data (BLIK, instant transfers, Apple Pay, Google Pay) in order to authorise and settle payments. Under the agreement we have with it, it is a <strong>separate (independent) controller</strong> of the personal data processed to carry out a payment. Privacy policy: <a href=\"https://www.bnpparibas.pl/repozytorium/rodo\">bnpparibas.pl/repozytorium/rodo</a>."
page.polityka-prywatnosci.s5.items.infra.badge: "IT infrastructure providers"
page.polityka-prywatnosci.s5.items.infra.textHtml: "<strong>Providers of technical infrastructure (hosting, CDN)</strong> — trusted parties supplying the servers and the content delivery network the site needs to run and to stay protected. They act as processors on our instructions. We serve our fonts locally and pass no IP addresses to third-party font providers."
page.polityka-prywatnosci.s5.items.payu.badge: "PayU"
page.polityka-prywatnosci.s5.items.payu.textHtml: "<strong>PayU S.A.</strong> (ul. Grunwaldzka 186, 60-166 Poznań) — the acquirer for card transactions. It handles authorisation and tokenisation and processes card data in line with the PCI DSS standard. It too is a <strong>separate (independent) controller</strong> of personal data. Privacy policy: <a href=\"https://poland.payu.com/prywatnosc/\">poland.payu.com/prywatnosc</a>."
page.polityka-prywatnosci.s5.items.zrzutka.badge: "Zrzutka.pl"
page.polityka-prywatnosci.s5.items.zrzutka.textHtml: "<strong>Zrzutka Sp. z o.o.</strong> — from the moment you follow the link to our fundraiser and give through Zrzutka. It is a separate controller; its policy: <a href=\"https://zrzutka.pl/privacy\">https://zrzutka.pl/privacy</a>."
page.polityka-prywatnosci.s5.p1: "Depending on what you are doing, your data may reach the following parties (either as processors or as separate controllers):"
page.polityka-prywatnosci.s5.title: "Recipients of the data"
page.polityka-prywatnosci.s6.p1: "The Foundation limits transfers of data outside the European Economic Area wherever it can. Our main server infrastructure is located within the European Union."
page.polityka-prywatnosci.s6.p2: "Where the technical operation of the site does involve a transfer outside the EEA (through content delivery networks, for instance), it takes place solely on the basis of Standard Contractual Clauses (SCCs) or another safeguard provided for by the GDPR."
page.polityka-prywatnosci.s6.p3: "The payment gateway's operator (BNP Paribas Bank Polska S.A.) and the card acquirer (PayU S.A.) are both established in Poland. They may nonetheless — within their own anti-fraud systems — process data outside the EEA as well, for which they answer on the terms set out in their own privacy policies."
page.polityka-prywatnosci.s6.title: "Transfers outside the EEA"
page.polityka-prywatnosci.s7.items.audio.textHtml: "<strong>Audio preference</strong> in localStorage — 3 hours from when it is written, or until the user clears their browser data."
page.polityka-prywatnosci.s7.items.correspondence.textHtml: "<strong>E-mail correspondence</strong> — until the matter is closed, and no longer than 3 years from the last exchange. That period may be extended until any claims become time-barred, where the correspondence is evidence in a case."
page.polityka-prywatnosci.s7.items.donors.textHtml: "<strong>Donors' data (accounting records and proof of payment)</strong> — for 5 years, counted from the beginning of the year following the financial year the data concerns. This obligation follows directly from art. 74 of the Polish Accounting Act and from the provisions of the Tax Ordinance."
page.polityka-prywatnosci.s7.items.logs.textHtml: "<strong>HTTP server logs</strong> — up to 12 months as a rule, unless the law or an ongoing procedure (an abuse investigation, for instance) justifies keeping them longer."
page.polityka-prywatnosci.s7.items.patronage.textHtml: "<strong>Patronage submissions</strong> — until contact about patronage ends or consent is withdrawn. If a lasting relationship follows, the data moves into the retention regime for donors (accounting records, 5 years); otherwise we delete it as soon as the contact ends."
page.polityka-prywatnosci.s7.title: "How long we keep it"
page.polityka-prywatnosci.s8.items.access.textHtml: "<strong>The right of access</strong> to your data and to obtain a copy of it (art. 15 GDPR)."
page.polityka-prywatnosci.s8.items.complaint.textHtml: "<strong>The right to lodge a complaint</strong> with the President of the Personal Data Protection Office (ul. Stawki 2, 00-193 Warszawa, <a href=\"https://uodo.gov.pl/\">uodo.gov.pl</a>)."
page.polityka-prywatnosci.s8.items.erasure.textHtml: "<strong>The right to erasure</strong> of your data (“the right to be forgotten”, art. 17)."
page.polityka-prywatnosci.s8.items.objection.textHtml: "<strong>The right to object</strong> to processing based on the controller's legitimate interest (art. 21)."
page.polityka-prywatnosci.s8.items.portability.textHtml: "<strong>The right to data portability</strong>, where processing is based on consent or on a contract and is carried out by automated means (art. 20)."
page.polityka-prywatnosci.s8.items.rectification.textHtml: "<strong>The right to rectification</strong> of inaccurate or incomplete data (art. 16)."
page.polityka-prywatnosci.s8.items.restriction.textHtml: "<strong>The right to restriction of processing</strong> (art. 18)."
page.polityka-prywatnosci.s8.p1: "Under the GDPR you have the following rights:"
page.polityka-prywatnosci.s8.p2Html: "To exercise any of these rights, write to <a href=\"mailto:rodo@voctensemble.com\">rodo@voctensemble.com</a>. We answer without undue delay, and within one month of receiving the request at the latest."
page.polityka-prywatnosci.s8.title: "Your rights"
page.polityka-prywatnosci.s9.items.anonymous.textHtml: "<strong>Fully anonymous:</strong> we collect no IP addresses, no location data and no information that would allow any individual to be identified."
page.polityka-prywatnosci.s9.items.cookieless.textHtml: "<strong>No cookies:</strong> the tool uses no cookie files and writes nothing into your browser's storage."
page.polityka-prywatnosci.s9.items.minimal.textHtml: "<strong>Minimal:</strong> we process only raw, aggregated statistics (visit counts, the most-read pages), and we use them for nothing but improving the site."
page.polityka-prywatnosci.s9.p1Html: "To improve the site and to understand what content interests you, we use <strong>Plausible Analytics</strong>. It is a privacy-first tool:"
page.polityka-prywatnosci.s9.p2Html: "Full details of how the tool protects privacy can be found in Plausible's official <a href=\"https://plausible.io/data-policy\">Data Policy</a>."
page.polityka-prywatnosci.s9.title: "Visit statistics"
page.regulamin-darowizn.head.kicker: "Document · donations"
page.regulamin-darowizn.head.lede: "These terms set out how donations are made to the VoctFoundation through the voctensemble.com website — by online payment and by bank transfer."
page.regulamin-darowizn.head.title: "Terms of donation"
page.regulamin-darowizn.history.entries.v1-0.note: "The first version of the Terms, published when the voctensemble.com website went live."
page.regulamin-darowizn.history.entries.v1-1.note: "§ 2 extended with the ways of giving outside the online payment gateway: an ordinary bank transfer (one-off, or as a standing order) and the Zrzutka.pl fundraising service."
page.regulamin-darowizn.history.entries.v1-2.note: "Added § 5(3): the Terms are also published in English and French translation, the Polish version remaining the binding one."
page.regulamin-darowizn.history.label: "Version history"
page.regulamin-darowizn.s1.p1Html: "These terms set out the rules for making donations to <strong>Fundacja VoctFoundation</strong>, with its registered office in Kraków (ul. Św. Filipa 23/3, 31-150 Kraków), entered in the National Court Register under KRS: 0001237252, NIP: 6762718992, REGON: 544621525, hereinafter “the Foundation”."
page.regulamin-darowizn.s1.p2Html: "Under § 5 and § 6 of the <a href=\"/docs/Statut-VoctFoundation.pdf\">Foundation's Statute</a>, published on the Foundation's website, every donation made to the Foundation is devoted solely to its statutory purposes, in particular artistic activity, including music, the development and dissemination of musical creation, the documentation, protection and dissemination of musical heritage, educational and outreach work in the field of culture, widening access to culture, support for young artists and the realisation of artistic projects, including the work of the Foundation's resident ensemble."
page.regulamin-darowizn.s1.p3: "A donor may be any adult natural person, any legal person or any organisational unit without legal personality."
page.regulamin-darowizn.s1.p4: "Under art. 890 § 1 sentence 2 of the Polish Civil Code, a contract for the donation of money becomes valid and effective at the moment the payment is made (that is, when the funds reach the Foundation's account), irrespective of the form of the declaration of intent."
page.regulamin-darowizn.s1.title: "General provisions"
page.regulamin-darowizn.s2.p1: "Donations are made online through the support form available on the voctensemble.com website."
page.regulamin-darowizn.s2.p2: "The online payment operator is BNP Paribas Bank Polska S.A., with its registered office in Warsaw (the Axepta BNP Paribas gateway), and the acquirer for card transactions is PayU S.A., with its registered office in Poznań."
page.regulamin-darowizn.s2.p3: "A donor may give using modern, encrypted payment methods, in particular: payment cards (Visa, Mastercard), the BLIK system, instant bank transfers (Pay-By-Link) and electronic wallets (Apple Pay, Google Pay)."
page.regulamin-darowizn.s2.p4: "Independently of online payment, a donor may give by ordinary bank transfer straight to the Foundation's account — once, or as a standing order (a recurring transfer), which the donor sets up, changes and cancels themselves in their own banking; the Foundation stores neither card details nor a debit mandate for this purpose. A donation may also be made through the Zrzutka.pl fundraising service, on the terms set out in that service's own regulations."
page.regulamin-darowizn.s2.p5: "Donations may be made in PLN and in EUR. Which payment methods are available depends on the currency chosen."
page.regulamin-darowizn.s2.p6: "Clicking the button that confirms the intention to give, and making the payment, constitutes the conclusion of a donation contract and acceptance of these Terms."
page.regulamin-darowizn.s2.title: "Rules for making donations, and payment methods"
page.regulamin-darowizn.s3.p1: "A donor has the right to raise a complaint about any irregularity in the donation process (for example, a technical fault in the payment system)."
page.regulamin-darowizn.s3.p2Html: "Please send complaints by e-mail to: <a href=\"mailto:kontakt@voctensemble.com\">kontakt@voctensemble.com</a>."
page.regulamin-darowizn.s3.p3: "The Foundation considers complaints with the greatest care and without delay, and in any event within 14 days of receiving them."
page.regulamin-darowizn.s3.p4: "Where a payment was made in error, or a fault on the side of the donor's bank resulted in a double charge, the donor has the right to request a refund of the donation within 14 days of it being made. The request should be sent to the address given in paragraph 2, quoting the transaction identifier and the e-mail address used for the payment."
page.regulamin-darowizn.s3.p5: "For the financial safety of donors, all refunds are made solely to the same payment method (the same bank account or payment card) as the one used for the original payment, as required by law and by the payment operators' own regulations."
page.regulamin-darowizn.s3.title: "Complaints and refunds"
page.regulamin-darowizn.s4.p1: "The controller of donors' personal data is the VoctFoundation."
page.regulamin-darowizn.s4.p2Html: "Detailed information about the processing of personal data, the purposes of that processing, the roles of the payment operators (Axepta BNP Paribas, PayU) and the rights available to donors can be found in the <a href=\"/polityka-prywatnosci\">Privacy policy</a> available on the voctensemble.com website."
page.regulamin-darowizn.s4.title: "Personal data (GDPR)"
page.regulamin-darowizn.s5.p1: "The Foundation reserves the right to amend these Terms, and will give notice of any amendment by updating their text on its website."
page.regulamin-darowizn.s5.p2: "Matters not governed by these Terms are subject to the relevant provisions of Polish law, in particular the Civil Code."
page.regulamin-darowizn.s5.p3: "These Terms are published in Polish, and also in English and French translation. The Polish version is the binding one; the translations are for information only, and in the event of any discrepancy between the language versions the Polish wording prevails."
page.regulamin-darowizn.s5.title: "Final provisions"
