page.kontakt.locus.foundationLabel: "Foundation"
page.kontakt.locus.foundationLink: "Meet the foundation and its board →"
page.kontakt.locus.h2: "Behind the voice stands a foundation."
page.kontakt.locus.mission: "The VoctFoundation works in the field of culture, the arts and the protection of heritage; VoctEnsemble is its resident ensemble. Our income is devoted entirely to our statutory purposes."
page.kontakt.meta.description: "Write to VoctEnsemble and the VoctFoundation: concerts and music for liturgies, patronage, general enquiries. We answer personally — in Polish, English and French."
page.kontakt.meta.title: "Contact — VoctEnsemble | VoctFoundation"
page.kontakt.voices.label: "Read and answered by"
page.kontakt.voices.note: "The board of the VoctFoundation. We answer together — and we mean it to stay that way even once we have grown."
page.o-nas.cantus.eyebrow: "What we sing"
page.o-nas.cantus.h2: "Music as a reflection of the soul of the word."
page.o-nas.cantus.lead: "We share song and carefully considered narratives — woven from works in which music and word are each other's mirror image."
page.o-nas.cantus.moreLink: "Seven centuries of repertoire — from Renaissance polyphony to the present day →"
page.o-nas.cantus.p2: "The world interests us: the visible one — nature and all creation — and the immaterial one we seek and try to understand. Sacred music is a good companion on that journey."
page.o-nas.cantus.p3: "It draws on human genius, on the Bible and on the wisdom of our forebears — to which composers still reach in order to express, in a wholly personal way, what they live through and what touches them most."
page.o-nas.cta.concerts: "Spiritual Concerts"
page.o-nas.cta.h2: "Invite us into a space that needs a voice."
page.o-nas.cta.lede: "A spiritual concert, music for a liturgy, an important celebration, patronage or an artistic collaboration. We look forward to hearing from you."
page.o-nas.cta.support: "Support the foundation"
page.o-nas.cta.write: "Write to us"
page.o-nas.doings.cards.dialog.body: "We sang during the 28th Day of Judaism in the Catholic Church, in Kraków's Chapel of St Dorothy, and performed at the Tempel Synagogue — music as a meeting place."
page.o-nas.doings.cards.dialog.title: "A dialogue of traditions"
page.o-nas.doings.cards.koncerty.body: "Our own cycle — a contemporary form of the old Concerts Spirituels. Evening after evening, built around separate intentions."
page.o-nas.doings.cards.koncerty.cta: "See the path of the concerts →"
page.o-nas.doings.cards.koncerty.title: "Spiritual Concerts"
page.o-nas.doings.cards.liturgia.body: "Music for Mass and church feasts. Most recently — the liturgy for the feast of St Andrew Bobola in Warsaw, marking the centenary of the Polish Jesuit provinces."
page.o-nas.doings.cards.liturgia.title: "Liturgy and celebrations"
page.o-nas.doings.cards.sluby.body: "We have provided music for wedding liturgies at St Anne's Collegiate Church in Kraków and at the Benedictine Abbey in Tyniec. We are available for such occasions."
page.o-nas.doings.cards.sluby.title: "Weddings and sacraments"
page.o-nas.doings.eyebrow: "What we do"
page.o-nas.doings.h2: "Spiritual concerts, liturgy, occasions that matter."
page.o-nas.doings.lead: "Our main current is the Spiritual Concerts — a contemporary form of the old Concerts Spirituels. Beyond them we sing in the liturgy: Masses, feasts and celebrations we are invited to."
page.o-nas.ensemble.collabLabel: "Collaboration"
page.o-nas.ensemble.collabText: "On stage and in production we work with, among others, lighting director Ada Bystrzycka, sound engineer Jakub Garbacz (Ars Sonora Studio), Sebastian Kuźma (visual animation) and violinist Radu Ropotan; and, institutionally, with the Carpe Diem Foundation and the Norwid Cultural Centre in Kraków's Mistrzejowice district."
page.o-nas.ensemble.eyebrow: "The ensemble"
page.o-nas.ensemble.h2: "A Kraków vocal ensemble led as a chamber community."
page.o-nas.ensemble.lead: "On stage there are usually twelve voices — professional and pre-professional musicians. Depending on the piece, we sing as a quartet, as an octet, or at full strength."
page.o-nas.ensemble.p2: "The line-up is alive: around a stable core, the roster changes from project to project — we choose the voices to fit the programme and the space it has to sound in."
page.o-nas.ensemble.p3Html: "Under the direction of Florent de Bazelaire we build a sound in which discipline and tenderness hold together. The name joins <em>voces</em> (voices), <em>octo</em> (eight) and <em>ensemble</em> — a promise of voices that listen to one another."
page.o-nas.foundation.eyebrow: "The foundation"
page.o-nas.foundation.goals.dziedzictwo.text: "Heritage: documenting, archiving and sharing music and performance practice."
page.o-nas.foundation.goals.edukacja.text: "Education and access: fostering culture and supporting participation in it."
page.o-nas.foundation.goals.mlodzi.text: "Young artists: development, promotion, mentoring, residencies and performance projects."
page.o-nas.foundation.goals.tworczosc.text: "Musical creation: production, co-production, organisation and presentation of projects at home and abroad."
page.o-nas.foundation.goals.wspolpraca.text: "Collaboration: working with artists, cultural institutions, universities, media and civil-society organisations."
page.o-nas.foundation.h2: "A form that lets music endure."
page.o-nas.foundation.lead: "The VoctFoundation is the legal and organisational backbone of the artistic work. It is what lets the ensemble think not only about the next concert, but about an archive, education, production and the long life of the repertoire."
page.o-nas.foundation.legalNote: "The Foundation's income is devoted entirely to its statutory purposes. It is not distributed among the founder, the members of its bodies, or persons connected with the Foundation; any economic activity, if conducted, remains ancillary to the statutory mission."
page.o-nas.foundation.p2Html: "By its statute, the Foundation works in the field of <strong>culture, the arts, and the protection of cultural goods and national heritage</strong>. It may run artistic and interdisciplinary projects, make recordings, support young artists, and act through a permanent artistic ensemble in a resident-ensemble arrangement."
page.o-nas.foundation.statuteLabel: "Foundation statute ↗"
page.o-nas.governance.eyebrow: "The board"
page.o-nas.governance.h2: "Responsibility scored for three voices."
page.o-nas.governance.intro: "Artistic direction is set by one person; the foundation's decisions are taken by majority vote — that is what the statute provides. The same people then stand backstage on the night of the concert."
page.o-nas.governance.roles.ania.role: "Organisation · communication"
page.o-nas.governance.roles.florent.role: "Artistic direction · conductor"
page.o-nas.governance.roles.krystian.role: "Technology · tools"
page.o-nas.hero.eyebrow: "About"
page.o-nas.hero.lede: "VoctEnsemble — a Kraków vocal ensemble and the resident ensemble of the VoctFoundation. We begin with three questions: where we came from, what we do, and what we sing."
page.o-nas.hero.scrollCue: "Read the letter"
page.o-nas.hero.title1: "It began"
page.o-nas.hero.title2Html: "with <em>longing.</em>"
page.o-nas.letter.eyebrow: "Founder's letter"
page.o-nas.letter.h2: "Where did we come from?"
page.o-nas.letter.leadHtml: "Florent de Bazelaire answers."
page.o-nas.letter.portraitAlt: "Florent de Bazelaire conducting VoctEnsemble"
page.o-nas.letter.portraitCaption: "Florent de Bazelaire · artistic direction"
page.o-nas.letter.signatureMeta: "artistic direction · 2024"
page.o-nas.letter.stanzas.I.label: "Out of longing"
page.o-nas.letter.stanzas.I.paraHtml: "Out of longing, inspiration and a dream. Like anchorites, in seclusion, far from the clamour and from music, a longing for music was born. A vision of music as a breath of the spirit that transforms the world with its polyphony, enfolding a person and reaching into their depths — resonating and finding a place in the soul like a living organism."
page.o-nas.letter.stanzas.II.label: "In silence"
page.o-nas.letter.stanzas.II.paraHtml: "In silence, music is born. In silence, one contemplates. Music is the soul's contemplation in time. So Voct came to be — out of silence and contemplation."
page.o-nas.letter.stanzas.III.label: "Exchange"
page.o-nas.letter.stanzas.III.paraHtml: "The exchange of thought, and the attempt to immerse oneself in another person's reading, kindled musical invention and opened new paths of interpretation. Interpretation rests on an exchange of human skills and intuitions that weave together, dynamically, to uncover the depths hidden within a work."
page.o-nas.letter.stanzas.IV.label: "Fragility"
page.o-nas.letter.stanzas.IV.paraHtml: "We would not feel ourselves singing music that did not embrace the whole person, touch their depths, and try to enthral them with beauty in spite of their complexity and fragility."
page.o-nas.meta.description: "VoctEnsemble — a Kraków vocal ensemble and the resident ensemble of the VoctFoundation. Spiritual concerts, liturgies and sacred music from medieval polyphony to contemporary minimalism."
page.o-nas.meta.title: "About — VoctEnsemble | VoctFoundation"
