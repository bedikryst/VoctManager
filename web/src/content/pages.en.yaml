page.skarbiec.mecenat.howHtml: "Patronage rests on a <strong>standing order</strong> — a monthly transfer you set up and control entirely from your own banking (say 50, 100 or 200 zł a month). You can change or cancel it at any time, without contacting us. No commission, and no card details to hand over."
page.skarbiec.mecenat.howLabel: "How it works"
page.skarbiec.mecenat.joinLabel: "Let us know you are joining"
page.skarbiec.mecenat.note: "Patronage is more than a single donation — it is a lasting relationship with the ensemble and its music. Your regular support lets us plan ahead: rehearsals, recordings and the next instalments of the Spiritual Concerts cycle. In return we invite you closer to what we do."
page.skarbiec.mecenat.tag: "regular support · a relationship"
page.skarbiec.mecenat.talkLabel: "Would you rather talk first?"
page.skarbiec.mecenat.talkNote: "Write to us — we will answer personally and help you find the form of support that suits you."
