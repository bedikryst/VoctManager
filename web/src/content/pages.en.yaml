page.landing.coda.captionHtml: "The silence <em>sounds on.</em>"
page.landing.director.p1: "The cycle takes its name from Paris in 1725: the Concert Spirituel sang on the evenings when the opera fell silent. Three hundred years later Florent de Bazelaire takes up that tradition in the basilicas of Kraków and Łódź, in Szczawnica and Niedzica."
page.landing.director.p2Html: "He builds every programme around a single intention. <em>Contemplation of the Incarnation</em> for the debut (2024), nine leaves from the Book of Psalms, a prayer for peace in St Mary's Basilica, an epitaph for Gaza."
page.landing.director.p3: "Alongside it he leads the VoctFoundation. The foundation exists to give this music a place of its own."
page.landing.director.portraitAlt: "Florent de Bazelaire conducting VoctEnsemble"
page.landing.director.role: "Artistic direction"
page.landing.ensemble.eyebrow: "Where did we come from?"
page.landing.ensemble.facts.debut.label: "debut · Contemplation of the Incarnation · Sacred Heart Basilica"
page.landing.ensemble.facts.evenings.label: "evenings"
page.landing.ensemble.facts.singers.label: "singers in the community · twelve voices on stage"
page.landing.ensemble.origin: "Like anchorites — in seclusion, far from the clamour — we came to long for music that enfolds a person, reaches into them and stays in the soul like a living organism. That is how Voct began: out of silence and contemplation."
page.landing.ensemble.p2: "There are more than forty of us today; twelve voices usually go on stage. We adore heterophony, polytonality and polyphony — we weave our programmes out of works in which word and music are each other's mirror image."
page.landing.ensemble.title1: "It began"
page.landing.ensemble.title2: "with longing."
