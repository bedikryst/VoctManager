page.kontakt.legal.rodoHtml: "When you write to us, you entrust us with your data (your name, e-mail address and the content of your message). We process it solely in order to answer your message (Art. 6(1)(f) GDPR). You have the right to access, rectify and erase it — <a href=\"mailto:rodo@voctensemble.com\">rodo@voctensemble.com</a>. More in the <a href=\"/polityka-prywatnosci\">privacy policy</a>."
