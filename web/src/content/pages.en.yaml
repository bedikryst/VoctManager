page.koncerty.coda.aboutLink: "Meet the ensemble"
page.koncerty.coda.contactLink: "Write to us"
page.koncerty.coda.h2: "We have sung in basilicas, in a cathedral and in a village church."
page.koncerty.coda.lede: "The Sacred Heart and St Mary's basilicas in Kraków, St Anthony's in Rybnik, Łódź Cathedral, the shrine in Warsaw, the spa manor house in Szczawnica, the church in Niedzica. Every time, we composed the programme anew — for that place and that occasion. We will prepare a spiritual concert, the music of a liturgy or of a celebration."
page.koncerty.coda.supportLink: "Support the foundation"
page.koncerty.intro.eyebrow: "The path of the concerts"
page.koncerty.intro.lede: "Every evening in this cycle has an intention of its own — and a programme of its own, grown out of it."
page.koncerty.intro.noteHtml: "It is a contemporary form of the old <em lang=\"fr\">Concerts Spirituels</em> — walk them in order, towards the one that has not happened yet."
page.koncerty.intro.scrollCue: "Step onto the path"
page.koncerty.intro.title1: "Spiritual"
page.koncerty.intro.title2Html: "<em>Concerts.</em>"
page.koncerty.meta.description: "The programmes of VoctEnsemble's Spiritual Concerts — from the Contemplation of the Incarnation to the liturgy for St Andrew Bobola — and a repertoire of seven centuries of sacred music."
page.koncerty.meta.title: "Spiritual Concerts — VoctEnsemble"
page.koncerty.next.cta: "Help it ring out →"
page.koncerty.next.essence: "This concert already exists in the scores and the rehearsals — all it lacks is the space in which to ring out. Donations bring its date closer."
page.koncerty.next.meta: "Its date and space will be set by donors"
page.koncerty.next.title: "A concert with no date."
page.koncerty.repertoire.eyebrow: "Seven centuries"
page.koncerty.repertoire.h2: "The repertoire our programmes are built from."
page.koncerty.repertoire.lede: "Renaissance polyphony, the Baroque and contemporary minimalism stand side by side in one evening. We build the programme out of the tension between them."
page.koncerty.rites.eyebrow: "The rules of the evening"
page.koncerty.rites.h2: "The same four rules lead every evening."
page.koncerty.rites.items.cisza.text: "Silence stays between the pieces. We ask for it plainly, in print in the programme — including the silence after the last chord."
page.koncerty.rites.items.cisza.title: "The silence"
page.koncerty.rites.items.porzadek.text: "The order of the pieces is part of the composition. The same note comes back beside every programme in the ensemble's notes: “order matters very much”."
page.koncerty.rites.items.porzadek.title: "The order"
page.koncerty.rites.items.slowo.text: "Before the music comes in, somebody names the intention of the evening. Every concert is preceded by a short introduction — most often by a Jesuit, such as Fr Jarek Naliwajko or Fr Przemysław Wysogląd."
page.koncerty.rites.items.slowo.title: "The word"
page.koncerty.rites.items.swiatlo.text: "The light has a score of its own: the fades and the cues are settled together with the programme. Ada Bystrzycka has watched over the lighting of many of these evenings."
page.koncerty.rites.items.swiatlo.title: "The light"
page.koncerty.rites.ledeHtml: "When the opera fell silent in eighteenth-century Paris for the feast days, <em lang=\"fr\">Concerts Spirituels</em> were given in a hall of the Tuileries Palace — sacred music outside the frame of a service. We are returning to that tradition."
page.kontakt.after.languages: "Write in Polish, English or French — we answer in the language you begin in. As quickly as the rehearsal and concert calendar allows; usually within a few days."
page.kontakt.after.pressHtml: "Journalists and promoters will find biographies, high-resolution photographs and full programmes in the <a href=\"/press\">press materials →</a>"
page.kontakt.channels.eyebrow: "Three doors"
page.kontakt.channels.h2: "Tell us what brings you."
page.kontakt.channels.introHtml: "We have laid the post out across three addresses, so that a message goes straight to the matter it concerns. Behind all three are <em>the same three people</em> — the foundation's board."
page.kontakt.channels.items.booking.hint: "Tell us where and when: the name of the place, a rough date, the occasion. We will write back with a programme shaped for that acoustic."
page.kontakt.channels.items.booking.role: "Concerts and liturgies"
page.kontakt.channels.items.booking.subject: "VoctEnsemble invitation"
page.kontakt.channels.items.ogolne.hint: "Everything else: questions, artistic collaboration, the foundation's affairs. If you do not know which address to choose, choose this one."
page.kontakt.channels.items.ogolne.role: "General enquiries"
page.kontakt.channels.items.ogolne.subject: "VoctEnsemble general enquiries"
page.kontakt.channels.items.patronat.hint: "A donation, honorary patronage or an institutional partnership. Tell us what interests you — we will say where the support goes and what will come of it."
page.kontakt.channels.items.patronat.role: "Patronage and sponsorship"
page.kontakt.channels.items.patronat.subject: "VoctEnsemble patronage and sponsorship"
page.kontakt.coda.concertsLink: "See the concerts →"
page.kontakt.coda.h2: "Until we hear one another."
page.kontakt.coda.lede: "And best of all — live, in an acoustic that remembers."
page.kontakt.coda.supportLink: "Support the foundation →"
page.kontakt.hero.eyebrow: "Contact"
page.kontakt.hero.lede: "Łódź Cathedral, a manor house in Szczawnica, the Tempel Synagogue, weddings at Tyniec Abbey — every one of those evenings began with somebody's invitation. The next could be yours."
page.kontakt.hero.scrollCue: "Choose a door"
page.kontakt.hero.title1: "Write"
page.kontakt.hero.title2Html: "to <em>us.</em>"
page.kontakt.legal.controllerLabel: "Data controller"
page.kontakt.legal.rodoHtml: "When you write to us, you entrust us with your data (your name, e-mail address and the content of your message). We process it solely in order to answer your message (Art. 6(1)(f) GDPR). You have the right to access, rectify and erase it — <a href=\"mailto:rodo@voctensemble.com\">rodo@voctensemble.com</a>. More in the <a href=\"/polityka-prywatnosci\">privacy policy</a>."
page.kontakt.locus.addressLabel: "Correspondence address"
page.kontakt.locus.addressNote: "We keep no office there — we meet where we sing."
