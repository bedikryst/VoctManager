page.kontakt.channels.items.ogolne.subject: "VoctEnsemble general enquiries"
page.kontakt.channels.items.patronat.hint: "A donation, honorary patronage or an institutional partnership. Tell us what interests you — we will say where the support goes and what will come of it."
page.kontakt.channels.items.patronat.role: "Patronage and sponsorship"
page.kontakt.channels.items.patronat.subject: "VoctEnsemble patronage and sponsorship"
page.kontakt.coda.concertsLink: "See the concerts →"
page.kontakt.coda.h2: "Until we hear one another."
page.kontakt.coda.lede: "And best of all — live, in an acoustic that remembers."
page.kontakt.coda.supportLink: "Support the foundation →"
page.kontakt.hero.eyebrow: "Contact"
page.kontakt.hero.lede: "Łódź Cathedral, a manor house in Szczawnica, the Tempel Synagogue, weddings at Tyniec Abbey — every one of those evenings began with somebody's invitation. The next could be yours."
page.kontakt.hero.scrollCue: "Choose a door"
page.kontakt.hero.title1: "Write"
page.kontakt.hero.title2Html: "to <em>us.</em>"
page.kontakt.legal.controllerLabel: "Data controller"
page.kontakt.legal.rodoHtml: "When you write to us, you entrust us with your data (your name, e-mail address and the content of your message). We process it solely in order to answer your message (Art. 6(1)(f) GDPR). You have the right to access, rectify and erase it — <a href=\"mailto:rodo@voctensemble.com\">rodo@voctensemble.com</a>. More in the <a href=\"/polityka-prywatnosci\">privacy policy</a>."
page.kontakt.locus.addressLabel: "Correspondence address"
page.kontakt.locus.addressNote: "We keep no office there — we meet where we sing."
page.kontakt.locus.eyebrow: "The foundation"
page.kontakt.locus.foundationLabel: "Foundation"
page.kontakt.locus.foundationLink: "Meet the foundation and its board →"
page.kontakt.locus.h2: "Behind the voice stands a foundation."
page.kontakt.locus.mission: "The VoctFoundation works in the field of culture, the arts and the protection of heritage; VoctEnsemble is its resident ensemble. Our income is devoted entirely to our statutory purposes."
page.kontakt.meta.description: "Write to VoctEnsemble and the VoctFoundation: concerts and music for liturgies, patronage, general enquiries. We answer personally — in Polish, English and French."
page.kontakt.meta.title: "Contact — VoctEnsemble | VoctFoundation"
page.kontakt.voices.label: "Read and answered by"
page.kontakt.voices.note: "The board of the VoctFoundation. We answer together — and we mean it to stay that way even once we have grown."
