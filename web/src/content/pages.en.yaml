page.kontakt.channels.introHtml: "We have laid the post out across three addresses, so that a message goes straight to the matter it concerns. Behind all three are <em>the same three people</em> — the foundation's board."
page.kontakt.channels.items.booking.hint: "Tell us where and when: the name of the place, a rough date, the occasion. We will write back with a programme shaped for that acoustic."
