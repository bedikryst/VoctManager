page.koncerty.coda.aboutLink: "Découvrez l'ensemble"
page.koncerty.coda.contactLink: "Écrivez-nous"
page.koncerty.coda.h2: "Nous avons chanté dans des basiliques, dans une cathédrale et dans une église de village."
page.koncerty.coda.lede: "Les basiliques du Sacré-Cœur et Sainte-Marie à Cracovie, Saint-Antoine à Rybnik, la cathédrale de Łódź, le sanctuaire de Varsovie, le manoir thermal de Szczawnica, l'église de Niedzica. Chaque fois, nous avons recomposé le programme — pour ce lieu et pour cette occasion. Nous préparerons un concert spirituel, la musique d'une liturgie ou d'une célébration."
page.koncerty.coda.supportLink: "Soutenir la fondation"
page.koncerty.intro.eyebrow: "Le chemin des concerts"
page.koncerty.intro.lede: "Chaque soirée de ce cycle a son intention propre — et son propre programme, qui en naît."
page.koncerty.intro.noteHtml: "C'est une forme contemporaine des anciens <em lang=\"fr\">Concerts Spirituels</em> — parcourez-les dans l'ordre, vers celui qui n'a pas encore eu lieu."
page.koncerty.intro.scrollCue: "Entrez sur le chemin"
page.koncerty.intro.title1: "Concerts"
page.koncerty.intro.title2Html: "<em>Spirituels.</em>"
page.koncerty.meta.description: "Les programmes des Concerts Spirituels de VoctEnsemble — de la Contemplation de l'Incarnation à la liturgie de saint André Bobola — et un répertoire de sept siècles de musique sacrée."
page.koncerty.meta.title: "Concerts Spirituels — VoctEnsemble"
page.koncerty.next.cta: "Aidez-le à résonner →"
page.koncerty.next.essence: "Ce concert existe déjà dans les partitions et les répétitions — il ne lui manque que l'espace où résonner. Les dons rapprochent sa date."
page.koncerty.next.meta: "La date et l'espace seront fixés par les donateurs"
page.koncerty.next.title: "Un concert sans date."
page.koncerty.repertoire.eyebrow: "Sept siècles"
page.koncerty.repertoire.h2: "Le répertoire dont nous faisons nos programmes."
page.koncerty.repertoire.lede: "La polyphonie de la Renaissance, le baroque et le minimalisme contemporain se tiennent côte à côte dans une même soirée. Nous construisons le programme à partir de la tension entre eux."
page.koncerty.rites.eyebrow: "Les règles de la soirée"
page.koncerty.rites.h2: "Les quatre mêmes règles conduisent chaque soirée."
page.koncerty.rites.items.cisza.text: "Le silence demeure entre les pièces. Nous le demandons explicitement, imprimé dans le programme — y compris celui qui suit le dernier accord."
page.koncerty.rites.items.cisza.title: "Le silence"
page.koncerty.rites.items.porzadek.text: "L'ordre des pièces fait partie de la composition. La même note revient à côté de chaque programme dans les notes de l'ensemble : « l'ordre compte beaucoup »."
page.koncerty.rites.items.porzadek.title: "L'ordre"
page.koncerty.rites.items.slowo.text: "Avant que la musique n'entre, quelqu'un nomme l'intention de la soirée. Chaque concert est précédé d'une brève introduction — le plus souvent par un jésuite, comme le P. Jarek Naliwajko ou le P. Przemysław Wysogląd."
page.koncerty.rites.items.slowo.title: "La parole"
page.koncerty.rites.items.swiatlo.text: "La lumière a sa propre partition : les fondus et les entrées se règlent avec le programme. Ada Bystrzycka a veillé sur la mise en lumière de bien des soirées."
page.koncerty.rites.items.swiatlo.title: "La lumière"
page.koncerty.rites.ledeHtml: "Quand l'opéra se taisait à Paris au XVIIIe siècle pour le temps des fêtes, on donnait dans une salle du palais des Tuileries des <em lang=\"fr\">Concerts Spirituels</em> — de la musique sacrée hors du cadre de l'office. Nous revenons à cette tradition."
page.kontakt.after.languages: "Écrivez en polonais, en anglais ou en français — nous répondrons dans la langue de votre message. Aussi vite que le calendrier des répétitions et des concerts le permet ; en général sous quelques jours."
page.kontakt.after.pressHtml: "Les journalistes et les organisateurs trouveront les biographies, les photographies en haute résolution et les programmes complets dans le <a href=\"/press\">dossier de presse →</a>"
