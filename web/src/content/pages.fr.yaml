page.koncerty.coda.aboutLink: "Découvrez l'ensemble"
page.koncerty.coda.contactLink: "Écrivez-nous"
page.koncerty.coda.h2: "Nous avons chanté dans des basiliques, dans une cathédrale et dans une église de village."
page.koncerty.coda.lede: "Les basiliques du Sacré-Cœur et Sainte-Marie à Cracovie, Saint-Antoine à Rybnik, la cathédrale de Łódź, le sanctuaire de Varsovie, le manoir thermal de Szczawnica, l'église de Niedzica. Chaque fois, nous avons recomposé le programme — pour ce lieu et pour cette occasion. Nous préparerons un concert spirituel, la musique d'une liturgie ou d'une célébration."
page.koncerty.coda.supportLink: "Soutenir la fondation"
page.koncerty.intro.eyebrow: "Le chemin des concerts"
page.koncerty.intro.lede: "Chaque soirée de ce cycle a son intention propre — et son propre programme, qui en naît."
page.koncerty.intro.noteHtml: "C'est une forme contemporaine des anciens <em>Concerts Spirituels</em> — parcourez-les dans l'ordre, vers celui qui n'a pas encore eu lieu."
page.koncerty.intro.scrollCue: "Entrez sur le chemin"
page.koncerty.intro.title1: "Concerts"
page.koncerty.intro.title2Html: "<em>Spirituels.</em>"
page.koncerty.meta.description: "Les programmes des Concerts Spirituels de VoctEnsemble — de la Contemplation de l'Incarnation à la liturgie de saint André Bobola — et un répertoire de sept siècles de musique sacrée."
page.koncerty.meta.title: "Concerts Spirituels — VoctEnsemble"
page.koncerty.next.cta: "Aidez-le à résonner →"
page.koncerty.next.essence: "Ce concert existe déjà dans les partitions et les répétitions — il ne lui manque que l'espace où résonner. Les dons rapprochent sa date."
page.koncerty.next.meta: "La date et l'espace seront fixés par les donateurs"
page.koncerty.next.title: "Un concert sans date."
page.koncerty.repertoire.eyebrow: "Sept siècles"
page.koncerty.repertoire.h2: "Le répertoire dont nous faisons nos programmes."
page.koncerty.repertoire.lede: "La polyphonie de la Renaissance, le baroque et le minimalisme contemporain se tiennent côte à côte dans une même soirée. Nous construisons le programme à partir de la tension entre eux."
page.koncerty.rites.eyebrow: "Les règles de la soirée"
page.koncerty.rites.h2: "Les quatre mêmes règles conduisent chaque soirée."
page.koncerty.rites.items.cisza.text: "Le silence demeure entre les pièces. Nous le demandons explicitement, imprimé dans le programme — y compris celui qui suit le dernier accord."
page.koncerty.rites.items.cisza.title: "Le silence"
page.koncerty.rites.items.porzadek.text: "L'ordre des pièces fait partie de la composition. La même note revient à côté de chaque programme dans les notes de l'ensemble : « l'ordre compte beaucoup »."
page.koncerty.rites.items.porzadek.title: "L'ordre"
page.koncerty.rites.items.slowo.text: "Avant que la musique n'entre, quelqu'un nomme l'intention de la soirée. Chaque concert est précédé d'une brève introduction — le plus souvent par un jésuite, comme le P. Jarek Naliwajko ou le P. Przemysław Wysogląd."
page.koncerty.rites.items.slowo.title: "La parole"
page.koncerty.rites.items.swiatlo.text: "La lumière a sa propre partition : les fondus et les entrées se règlent avec le programme. Ada Bystrzycka a veillé sur la mise en lumière de bien des soirées."
page.koncerty.rites.items.swiatlo.title: "La lumière"
page.koncerty.rites.ledeHtml: "Quand l'opéra se taisait à Paris au XVIIIe siècle pour le temps des fêtes, on donnait dans une salle du palais des Tuileries des <em>Concerts Spirituels</em> — de la musique sacrée hors du cadre de l'office. Nous revenons à cette tradition."
page.kontakt.after.languages: "Écrivez en polonais, en anglais ou en français — nous répondrons dans la langue de votre message. Aussi vite que le calendrier des répétitions et des concerts le permet ; en général sous quelques jours."
page.kontakt.after.pressHtml: "Les journalistes et les organisateurs trouveront les biographies, les photographies en haute résolution et les programmes complets dans le <a href=\"/press\">dossier de presse →</a>"
page.kontakt.channels.eyebrow: "Trois portes"
page.kontakt.channels.h2: "Dites-nous ce qui vous amène."
page.kontakt.channels.introHtml: "Nous avons réparti le courrier sur trois adresses, pour qu'un message arrive tout de suite là où il faut. Derrière les trois, <em>les trois mêmes personnes</em> — le conseil de la fondation."
page.kontakt.channels.items.booking.hint: "Dites-nous où et quand : le nom du lieu, une date approximative, l'occasion. Nous répondrons par une proposition de programme conçue pour cette acoustique."
page.kontakt.channels.items.booking.role: "Concerts et liturgies"
page.kontakt.channels.items.booking.subject: "Invitation VoctEnsemble"
page.kontakt.channels.items.ogolne.hint: "Tout le reste : questions, collaboration artistique, affaires de la fondation. Si vous ne savez pas quelle adresse choisir, choisissez celle-ci."
page.kontakt.channels.items.ogolne.role: "Questions générales"
page.kontakt.channels.items.ogolne.subject: "Questions générales VoctEnsemble"
page.kontakt.channels.items.patronat.hint: "Un don, un patronage d'honneur ou une collaboration institutionnelle. Dites-nous ce qui vous intéresse — nous vous dirons à quoi servira ce soutien et ce qui en naîtra."
page.kontakt.channels.items.patronat.role: "Mécénat et patronage"
page.kontakt.channels.items.patronat.subject: "Mécénat et patronage VoctEnsemble"
page.kontakt.coda.concertsLink: "Voir les concerts →"
page.kontakt.coda.h2: "Au plaisir de vous entendre."
page.kontakt.coda.lede: "Et mieux encore — de vive voix, dans une acoustique qui se souvient."
page.kontakt.coda.supportLink: "Soutenir la fondation →"
page.kontakt.hero.eyebrow: "Contact"
page.kontakt.hero.lede: "La cathédrale de Łódź, un manoir à Szczawnica, la synagogue Tempel, des mariages à l'abbaye de Tyniec — chacune de ces soirées a commencé par l'invitation de quelqu'un. La prochaine peut être la vôtre."
page.kontakt.hero.scrollCue: "Choisissez une porte"
page.kontakt.hero.title1: "Écrivez-nous"
page.kontakt.hero.title2Html: "un <em>mot.</em>"
page.kontakt.legal.controllerLabel: "Responsable du traitement"
page.kontakt.legal.rodoHtml: "En nous écrivant, vous nous confiez vos données (nom, adresse e-mail et contenu du message). Nous ne les traitons que pour répondre à votre message, au titre de l'art. 6, § 1, f) RGPD. Vous avez le droit d'y accéder, de les rectifier et de les effacer — <a href=\"mailto:rodo@voctensemble.com\">rodo@voctensemble.com</a>. Plus d'informations dans la <a href=\"/polityka-prywatnosci\">politique de confidentialité</a>."
page.kontakt.locus.addressLabel: "Adresse postale"
page.kontakt.locus.addressNote: "Nous n'y tenons pas de bureau — nous nous retrouvons là où nous chantons."
page.kontakt.locus.eyebrow: "La fondation"
page.kontakt.locus.foundationLabel: "Fondation"
page.kontakt.locus.foundationLink: "Découvrez la fondation et son conseil →"
page.kontakt.locus.h2: "Derrière la voix se tient une fondation."
page.kontakt.locus.mission: "La Fondation VoctFoundation agit dans le domaine de la culture, des arts et de la protection du patrimoine ; VoctEnsemble en est l'ensemble en résidence. Nous affectons l'intégralité de nos revenus aux buts statutaires."
page.kontakt.meta.description: "Écrivez à VoctEnsemble et à la Fondation VoctFoundation : concerts et musique pour la liturgie, mécénat, questions générales. Nous répondons personnellement — en polonais, en anglais et en français."
page.kontakt.meta.title: "Contact — VoctEnsemble | Fondation VoctFoundation"
page.kontakt.voices.label: "Qui lit et qui répond"
page.kontakt.voices.note: "Le conseil de la Fondation VoctFoundation. Nous répondons ensemble — et nous voulons qu'il en soit encore ainsi quand nous aurons grandi."
page.obrazy.colophon.back: "Retour aux Concerts Spirituels"
