page.landing.coda.captionHtml: "Le silence <em>résonne encore.</em>"
page.landing.director.p1: "Le nom du cycle remonte au Paris de 1725 : le Concert Spirituel chantait les soirs où l'opéra se taisait. Trois cents ans plus tard, Florent de Bazelaire reprend cette tradition dans les basiliques de Cracovie et de Łódź, à Szczawnica et à Niedzica."
page.landing.director.p2Html: "Il bâtit chaque programme autour d'une seule intention. <em>Contemplation de l'Incarnation</em> pour les débuts (2024), neuf feuillets du Livre des Psaumes, une prière pour la paix à la Basilique Sainte-Marie, une épitaphe pour Gaza."
page.landing.director.p3: "Parallèlement, il dirige la Fondation VoctFoundation. La fondation doit donner à cette musique un lieu qui lui soit propre."
page.landing.director.portraitAlt: "Florent de Bazelaire dirigeant VoctEnsemble"
page.landing.director.role: "Direction artistique"
page.landing.ensemble.eyebrow: "D'où venons-nous ?"
page.landing.ensemble.facts.debut.label: "début · Contemplation de l'Incarnation · Basilique du Sacré-Cœur"
