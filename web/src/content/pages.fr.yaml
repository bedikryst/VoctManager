page.landing.ensemble.facts.singers.label: "chanteurs dans la communauté · douze voix sur scène"
page.landing.ensemble.origin: "Comme des anachorètes — dans le retrait, loin du vacarme — nous est venue la nostalgie d'une musique qui enveloppe, qui pénètre et qui trouve place en l'âme comme un organisme vivant. Ainsi est né Voct : du silence et de la contemplation."
page.landing.ensemble.p2: "Nous sommes aujourd'hui plus de quarante ; sur scène montent d'ordinaire douze voix. Nous adorons l'hétérophonie, la polytonalité et la polyphonie — nous tissons nos programmes d'œuvres où le mot et la musique sont l'image l'un de l'autre."
