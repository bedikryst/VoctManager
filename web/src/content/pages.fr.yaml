page.o-nas.cantus.eyebrow: "Ce que nous chantons"
page.o-nas.cantus.h2: "La musique comme reflet de l'âme du mot."
page.o-nas.cantus.lead: "Nous partageons le chant et des récits mûrement pensés — tissés d'œuvres où la musique et le mot sont l'image l'un de l'autre."
page.o-nas.cantus.moreLink: "Sept siècles de répertoire — de la polyphonie de la Renaissance à aujourd'hui →"
page.o-nas.cantus.p2: "Le monde nous intéresse : le visible — la nature et toute la création — et l'immatériel, que nous cherchons et tentons de comprendre. La musique sacrée est une bonne compagne sur ce chemin."
page.o-nas.cantus.p3: "Elle puise dans le génie humain, dans la Bible et dans la sagesse des anciens, vers laquelle les compositeurs se tournent encore pour exprimer, de façon tout intime, ce qu'ils vivent et ce qui les touche le plus."
page.o-nas.cta.concerts: "Concerts Spirituels"
page.o-nas.cta.h2: "Invitez-nous dans un espace qui a besoin d'une voix."
page.o-nas.cta.lede: "Un concert spirituel, la musique d'une liturgie, une célébration importante, un mécénat ou une collaboration artistique. Nous attendons votre message."
page.o-nas.cta.support: "Soutenir la fondation"
page.o-nas.cta.write: "Écrivez-nous"
page.o-nas.doings.cards.dialog.body: "Nous avons chanté lors de la 28ᵉ Journée du judaïsme dans l'Église catholique, dans la chapelle Sainte-Dorothée à Cracovie, et nous nous sommes produits à la synagogue Tempel — la musique comme lieu de rencontre."
page.o-nas.doings.cards.dialog.title: "Dialogue des traditions"
page.o-nas.doings.cards.koncerty.body: "Notre propre cycle — une forme contemporaine des concerts spirituels d'autrefois. Soir après soir, autour d'intentions distinctes."
page.o-nas.doings.cards.koncerty.cta: "Voir le chemin des concerts →"
page.o-nas.doings.cards.koncerty.title: "Concerts Spirituels"
page.o-nas.doings.cards.liturgia.body: "La musique de la messe et des fêtes de l'Église. Récemment — la liturgie de la fête de saint André Bobola à Varsovie, pour le centenaire des provinces jésuites polonaises."
page.o-nas.doings.cards.liturgia.title: "Liturgie et célébrations"
page.o-nas.doings.cards.sluby.body: "Nous avons assuré la musique de liturgies de mariage à la collégiale Sainte-Anne de Cracovie et à l'abbaye bénédictine de Tyniec. Nous sommes disponibles pour de telles célébrations."
page.o-nas.doings.cards.sluby.title: "Mariages et sacrements"
page.o-nas.doings.eyebrow: "Ce que nous faisons"
page.o-nas.doings.h2: "Concerts spirituels, liturgie, grandes célébrations."
page.o-nas.doings.lead: "Notre courant principal, ce sont les Concerts Spirituels — une forme contemporaine des concerts spirituels d'autrefois. Au-delà, nous chantons dans la liturgie : messes, fêtes et célébrations auxquelles on nous invite."
page.o-nas.ensemble.collabLabel: "Collaboration"
page.o-nas.ensemble.collabText: "Sur scène et en production, nous collaborons notamment avec la conceptrice lumière Ada Bystrzycka, l'ingénieur du son Jakub Garbacz (Ars Sonora Studio), Sebastian Kuźma (animation visuelle) et le violoniste Radu Ropotan ; et, sur le plan institutionnel, avec la Fondation Carpe Diem et le Centre culturel Norwid, dans le quartier de Mistrzejowice à Cracovie."
page.o-nas.ensemble.eyebrow: "L'ensemble"
page.o-nas.ensemble.h2: "Un ensemble vocal cracovien mené comme une communauté de chambre."
page.o-nas.ensemble.lead: "Sur scène se rencontrent d'ordinaire douze voix — des musiciens professionnels et pré-professionnels. Selon l'œuvre, nous chantons à quatre, à huit ou au grand complet."
page.o-nas.ensemble.p2: "L'effectif est vivant : autour d'un noyau stable, la distribution change de projet en projet — nous choisissons les voix selon le programme et selon le lieu où il doit sonner."
page.o-nas.ensemble.p3Html: "Sous la direction de Florent de Bazelaire, nous bâtissons une sonorité où la discipline et la tendresse tiennent ensemble. Le nom réunit <em>voces</em> (les voix), <em>octo</em> (huit) et <em>ensemble</em> — la promesse de voix qui s'écoutent les unes les autres."
page.o-nas.foundation.eyebrow: "La fondation"
page.o-nas.foundation.goals.dziedzictwo.text: "Patrimoine : documenter, archiver et rendre accessibles la musique et les pratiques d'interprétation."
page.o-nas.foundation.goals.edukacja.text: "Éducation et accessibilité : diffuser la culture et soutenir la participation à celle-ci."
page.o-nas.foundation.goals.mlodzi.text: "Jeunes artistes : développement, promotion, mentorat, résidences et projets d'interprétation."
page.o-nas.foundation.goals.tworczosc.text: "Création musicale : production, coproduction, organisation et présentation de projets en Pologne et à l'étranger."
page.o-nas.foundation.goals.wspolpraca.text: "Coopération : travailler avec des artistes, des institutions culturelles, des universités, des médias et des organisations de la société civile."
page.o-nas.foundation.h2: "Une forme qui permet à la musique de durer."
page.o-nas.foundation.lead: "La Fondation VoctFoundation est le socle juridique et organisationnel de l'activité artistique. C'est grâce à elle que l'ensemble peut penser non seulement au prochain concert, mais à un archivage, à l'éducation, à la production et à la longue vie du répertoire."
page.o-nas.foundation.legalNote: "Les revenus de la Fondation sont intégralement affectés à la réalisation de ses buts statutaires. Ils ne sont pas répartis entre le fondateur, les membres des organes ou les personnes liées à la Fondation ; l'activité économique, si elle est exercée, demeure accessoire à la mission statutaire."
page.o-nas.foundation.p2Html: "Selon ses statuts, la Fondation agit dans le domaine de <strong>la culture, des arts et de la protection des biens culturels et du patrimoine national</strong>. Elle peut mener des projets artistiques et interdisciplinaires, réaliser des enregistrements, soutenir de jeunes artistes et agir par un ensemble artistique permanent, en résidence."
page.o-nas.foundation.statuteLabel: "Statuts de la fondation ↗"
page.o-nas.governance.eyebrow: "Le conseil"
page.o-nas.governance.h2: "La responsabilité répartie sur trois voix."
page.o-nas.governance.intro: "La direction artistique revient à une personne ; les décisions de la fondation se prennent à la majorité — ainsi le veulent les statuts. Ce sont les mêmes personnes qui se tiennent ensuite en coulisses le soir du concert."
page.o-nas.governance.roles.ania.role: "Organisation · communication"
page.o-nas.governance.roles.florent.role: "Direction artistique · chef de chœur"
page.o-nas.governance.roles.krystian.role: "Technologie · outils"
page.o-nas.hero.eyebrow: "À propos"
page.o-nas.hero.lede: "VoctEnsemble — un ensemble vocal cracovien et l'ensemble en résidence de la Fondation VoctFoundation. Nous commençons par trois questions : d'où nous venons, ce que nous faisons et ce que nous chantons."
page.o-nas.hero.scrollCue: "Lire la lettre"
page.o-nas.hero.title1: "Tout a commencé"
page.o-nas.hero.title2Html: "par la <em>nostalgie.</em>"
page.o-nas.letter.eyebrow: "Lettre du fondateur"
page.o-nas.letter.h2: "D'où venons-nous ?"
page.o-nas.letter.leadHtml: "Florent de Bazelaire répond."
page.o-nas.letter.portraitAlt: "Florent de Bazelaire dirigeant VoctEnsemble"
page.o-nas.letter.portraitCaption: "Florent de Bazelaire · direction artistique"
page.o-nas.letter.signatureMeta: "direction artistique · 2024"
page.o-nas.letter.stanzas.I.label: "De la nostalgie"
page.o-nas.letter.stanzas.I.paraHtml: "De la nostalgie, de l'inspiration et d'un rêve. Comme des anachorètes, dans le retrait, loin du vacarme et de la musique, une nostalgie de la musique est née. Une vision de la musique comme un souffle de l'esprit qui transforme le monde par sa polyphonie, enveloppant l'être humain et le pénétrant jusqu'au plus profond — résonnant et trouvant place en son âme comme un organisme vivant."
page.o-nas.letter.stanzas.II.label: "Dans le silence"
page.o-nas.letter.stanzas.II.paraHtml: "Dans le silence naît la musique. Dans le silence, on contemple. La musique est la contemplation de l'âme dans le temps. Ainsi est né Voct — du silence et de la contemplation."
page.o-nas.letter.stanzas.III.label: "L'échange"
page.o-nas.letter.stanzas.III.paraHtml: "L'échange des pensées et l'effort de se plonger dans l'interprétation de l'autre éveillaient l'invention musicale et ouvraient de nouvelles voies d'interprétation. L'interprétation repose sur un échange de savoir-faire et d'intuitions humaines qui s'entrelacent, dynamiquement, pour découvrir les profondeurs cachées dans une œuvre."
page.o-nas.letter.stanzas.IV.label: "La fragilité"
page.o-nas.letter.stanzas.IV.paraHtml: "Nous ne nous sentirions pas nous-mêmes à chanter une musique qui n'embrasserait pas l'être tout entier, ne toucherait pas ses profondeurs et ne chercherait pas à le charmer par la beauté, malgré sa complexité et sa fragilité."
page.o-nas.meta.description: "VoctEnsemble — un ensemble vocal cracovien et l'ensemble en résidence de la Fondation VoctFoundation. Concerts spirituels, liturgies et musique sacrée, de la polyphonie médiévale au minimalisme contemporain."
page.o-nas.meta.title: "À propos — VoctEnsemble | Fondation VoctFoundation"
page.o-nas.milestones.cardLink: "Page du concert →"
page.o-nas.milestones.eyebrow: "Ce qui a déjà résonné"
page.o-nas.milestones.h2: "Un chemin court, mais déjà inscrit dans des lieux et des intentions."
page.o-nas.milestones.moreLink: "Voir le répertoire et le détail des concerts →"
page.o-nas.plate.quote: "Par-dessus tout, nous partageons."
page.obrazy.colophon.back: "Retour aux Concerts Spirituels"
page.obrazy.colophon.eyebrow: "Photographies"
page.obrazy.colophon.note: "Les autres photographies proviennent des archives de l'ensemble."
page.obrazy.head.eyebrow: "Archives photographiques"
page.obrazy.head.lede: "C'est tout ce qui reste de ces soirées en dehors du son. Les photographies se suivent dans l'ordre où elles ont été prises — de la première répétition au dernier concert."
page.obrazy.head.title: "Images"
page.obrazy.meta.description: "Les archives photographiques de VoctEnsemble. Des photographies documentaires des Concerts Spirituels, dans l'ordre où les soirées ont eu lieu."
page.obrazy.meta.galleryName: "Images — photographies des Concerts Spirituels"
page.obrazy.meta.title: "Images — photographies des Concerts Spirituels · VoctEnsemble"
page.polityka-prywatnosci.head.kicker: "Document · RGPD"
page.polityka-prywatnosci.head.ledeHtml: "Le site <em>voctensemble.com</em> est un site d'information et un canal de réception des dons destinés aux buts statutaires de la Fondation. Nous n'utilisons ni cookies publicitaires ni outils d'analyse, nous ne faisons aucun profilage et nous ne prenons aucune décision automatisée à l'égard des utilisateurs. Nous exposons ci-dessous, précisément, quelles données peuvent être traitées lors de votre visite — y compris lors d'un don — et qui en répond."
page.polityka-prywatnosci.head.tocLabel: "Sommaire"
page.polityka-prywatnosci.history.entries.v1-0.note: "Version initiale de la politique, publiée avec le lancement du site voctensemble.com."
page.polityka-prywatnosci.history.entries.v1-1.note: "Précision du déroulement d'un paiement en ligne : le paiement suit une redirection vers la page hébergée par l'opérateur, et les données de paiement complètes ne transitent pas par les serveurs de la Fondation. Ajout d'une mention des virements récurrents (virements permanents) comme forme de soutien régulier. Ajout de la prise en charge du formulaire de mécénat (enregistrement des demandes : prénom, nom, e-mail — sur la base du consentement ; données conservées sur des serveurs situés dans l'Union européenne)."
page.polityka-prywatnosci.history.entries.v1-2.note: "Ajout du § 12 : la politique est également publiée en traduction anglaise et française, la version polonaise restant celle qui fait foi. Précision au § 4 : le paiement est traité par l'opérateur — la rédaction antérieure évoquait une intermédiation de la Fondation dans la transmission des données de paiement, ce qui contredisait le § 11."
page.polityka-prywatnosci.history.label: "Historique des versions"
page.polityka-prywatnosci.meta.description: "Quelles données nous traitons et pourquoi. Politique de confidentialité de la Fondation VoctFoundation (voctensemble.com)."
page.polityka-prywatnosci.s1.p1Html: "Le responsable du traitement des données personnelles traitées dans le cadre de l'utilisation du site <em>voctensemble.com</em> est :"
page.polityka-prywatnosci.s1.p2: "La Fondation poursuit des buts statutaires dans le domaine de la culture et de l'art sacré. Le site est son site d'information et son canal de réception des dons."
page.polityka-prywatnosci.s1.title: "Responsable du traitement"
page.polityka-prywatnosci.s10.gateway.items.fraud.text: "détecter les abus (fraud detection, device fingerprinting),"
page.polityka-prywatnosci.s10.gateway.items.sca.text: "gérer le 3-D Secure / Strong Customer Authentication (PSD2 SCA)."
page.polityka-prywatnosci.s10.gateway.items.session.text: "autoriser le paiement et en maintenir la session,"
page.polityka-prywatnosci.s10.gateway.items.tokenization.text: "tokeniser les données de carte,"
page.polityka-prywatnosci.s10.gateway.p1Html: "Après un clic sur « Nous soutenir », vous êtes redirigé vers la page de paiement hébergée par l'opérateur. C'est sur cette page — déjà hors du site voctensemble.com — que se chargent les <strong>bibliothèques JavaScript techniques fournies par BNP Paribas / PayU</strong>, qui peuvent déposer des cookies ou recourir à d'autres mécanismes de stockage dans le navigateur afin de :"
page.polityka-prywatnosci.s10.gateway.p2Html: "Ces mécanismes sont <strong>strictement nécessaires</strong> à l'exécution sécurisée d'un paiement et ne requièrent pas de consentement distinct. Le responsable du traitement des données traitées par ces scripts est <em>BNP Paribas Bank Polska S.A.</em> et — pour un paiement par carte — <em>PayU S.A.</em>, selon les modalités décrites dans leurs politiques de confidentialité (les liens figurent à la section « Destinataires des données »). Ils n'apparaissent pas sur notre site : ils ne fonctionnent que sur la page de l'opérateur, après la redirection, lorsque vous engagez le paiement."
page.polityka-prywatnosci.s10.gateway.title: "Scripts techniques et cookies de la passerelle de paiement"
page.polityka-prywatnosci.s10.own.p1Html: "<strong>Nous n'utilisons aucun cookie qui nous soit propre</strong> — ni de mesure ni de publicité. Le site ne contient ni Google Analytics, ni Meta Pixel, ni aucun outil de profilage comparable."
page.polityka-prywatnosci.s10.own.title: "Nos propres cookies"
page.polityka-prywatnosci.s10.storage.items.audio.note: "Votre choix au seuil d'entrée (« avec la voix » / « en silence »). L'entrée expire 3 heures après son enregistrement."
page.polityka-prywatnosci.s10.storage.items.preloaderLastLoad.note: "Un horodatage technique du dernier chargement du document, qui ne sert qu'à distinguer un rechargement de page d'une navigation interne."
page.polityka-prywatnosci.s10.storage.items.preloaderSeen.note: "Un indicateur signalant que vous avez déjà vu le rite d'entrée au cours de cette session ; il permet de le passer lorsque vous revenez à la page d'accueil depuis une autre page. Effacé automatiquement à la fermeture de l'onglet et au rechargement de la page."
page.polityka-prywatnosci.s10.storage.p1: "Nous n'utilisons les mécanismes localStorage et sessionStorage du navigateur que pour mémoriser quelques préférences techniques d'interface. Aucune des entrées ci-dessous n'identifie l'utilisateur, ne contient de données personnelles ni ne sert au pistage. Ce sont des mécanismes « strictement nécessaires » à des fonctions du site que vous avez choisies — au sens du considérant 30 de la directive 2002/58/CE et de la jurisprudence, ils ne requièrent donc pas de consentement préalable."
page.polityka-prywatnosci.s10.storage.title: "localStorage et sessionStorage du navigateur"
page.polityka-prywatnosci.s10.title: "Cookies, localStorage et scripts de tiers"
page.polityka-prywatnosci.s11.items.cards.textHtml: "<strong>Nous ne conservons ni données complètes de cartes de paiement ni codes BLIK</strong> sur les serveurs de la Fondation — vous les saisissez directement sur la page hébergée par l'opérateur (Axepta BNP Paribas / PayU), qui les tokenise et répond de leur sécurité conformément à la norme PCI DSS."
page.polityka-prywatnosci.s11.items.hsts.textHtml: "Nous imposons le <em>HTTP Strict Transport Security</em> (HSTS) avec l'option preload — un navigateur n'autorisera aucune connexion non chiffrée à notre domaine."
page.polityka-prywatnosci.s11.items.mailboxes.textHtml: "Les adresses e-mail sont conservées dans des boîtes protégées par une authentification multifacteur."
page.polityka-prywatnosci.s11.items.relay.textHtml: "Notre serveur ne sert pas d'intermédiaire dans la transmission des données de paiement — nous ne transmettons à la passerelle que le montant, la devise, l'adresse e-mail et l'identifiant du don, par une connexion TLS chiffrée exclusivement, afin de générer le lien vers la page de paiement."
page.polityka-prywatnosci.s11.items.tls.textHtml: "Le site n'est accessible que par une connexion chiffrée <strong>HTTPS (TLS 1.3)</strong>."
page.polityka-prywatnosci.s11.title: "Sécurité"
page.polityka-prywatnosci.s12.p1: "Nous actualisons la politique lorsque la manière dont nous traitons les données change — par exemple lorsque nous ouvrons de nouveaux moyens de paiement, ajoutons des formulaires ou modifions notre infrastructure technique. Chaque modification porte un nouveau numéro de version et une date d'entrée en vigueur (en tête de ce document)."
page.polityka-prywatnosci.s12.p2: "La présente politique est publiée en polonais, ainsi qu'en traduction anglaise et française. La version polonaise est celle qui fait foi ; les traductions n'ont qu'une valeur informative et, en cas de divergence entre les versions linguistiques, c'est le texte polonais qui prévaut."
page.polityka-prywatnosci.s12.p3Html: "Vous pouvez à tout moment obtenir l'historique complet des modifications en écrivant à <a href=\"mailto:rodo@voctensemble.com\">rodo@voctensemble.com</a>."
page.polityka-prywatnosci.s12.title: "Modifications de la politique"
page.polityka-prywatnosci.s2.cardNote: "ou par courrier, au siège de la fondation"
page.polityka-prywatnosci.s2.p1: "Pour toute question relative au traitement des données personnelles, écrivez-nous à :"
page.polityka-prywatnosci.s2.p2: "Nous n'avons pas désigné de délégué à la protection des données — l'étendue et la nature de nos traitements ne l'exigent pas (art. 37 RGPD)."
page.polityka-prywatnosci.s2.title: "Contact pour les questions relatives aux données"
page.polityka-prywatnosci.s3.audio.p1Html: "Après le choix « Entrer avec la voix » ou « Entrer en silence », nous enregistrons votre choix dans la mémoire locale du navigateur (<em>localStorage</em>), sous la clé <code>voct.demo.audio</code>. L'entrée expire au bout de 3 heures et ne contient que la valeur de la préférence et un horodatage. Ce ne sont pas des données personnelles et elles ne quittent pas votre navigateur."
page.polityka-prywatnosci.s3.audio.title: "Préférence audio (localStorage)"
page.polityka-prywatnosci.s3.donors.p1: "Lors d'un don, nous traitons les données nécessaires à la réalisation de la transaction, à l'établissement d'une éventuelle attestation de don et à l'exécution des obligations comptables de la Fondation. L'étendue et les modalités du traitement dépendent du moyen choisi :"
page.polityka-prywatnosci.s3.donors.title: "Donateurs"
page.polityka-prywatnosci.s3.email.p1: "Si vous nous écrivez à l'une de nos adresses, nous traitons les données contenues dans cette correspondance — adresse e-mail de l'expéditeur, signature, contenu du message — dans le seul but de vous répondre."
page.polityka-prywatnosci.s3.email.title: "Correspondance par e-mail"
page.polityka-prywatnosci.s3.gateway.items.handoff.textHtml: "Après le choix du montant et la saisie de l'adresse e-mail, notre serveur ne transmet à la passerelle que <strong>le montant, la devise, l'adresse e-mail et l'identifiant du don</strong>, et reçoit en retour un lien à usage unique vers une page de paiement."
page.polityka-prywatnosci.s3.gateway.items.redirect.textHtml: "Vous êtes redirigé vers la <strong>page de paiement hébergée par l'opérateur</strong>, où vous saisissez directement vos données de paiement (code BLIK, données de carte, choix de la banque pour un virement instantané). Une fois l'opération terminée, vous revenez sur notre site avec l'état de la transaction."
page.polityka-prywatnosci.s3.gateway.p1Html: "Nous utilisons la passerelle de paiement <strong>Axepta BNP Paribas</strong>, exploitée par <em>BNP Paribas Bank Polska S.A.</em> Pour les transactions par carte, l'établissement acquéreur est <em>PayU S.A.</em> Le paiement suit un modèle de redirection vers la page sécurisée de l'opérateur :"
page.polityka-prywatnosci.s3.gateway.p2Html: "Les données de paiement complètes (numéro de carte, code BLIK, identifiants de banque en ligne) ne sont saisies que sur la page de l'opérateur — <strong>elles ne transitent pas par les serveurs de la Fondation et nous ne les conservons pas</strong>. C'est l'opérateur qui les tokenise et qui assume la charge de l'autorisation ainsi que les obligations de sécurité de la norme <strong>PCI DSS</strong>. Du côté de la Fondation, nous ne conservons que l'adresse e-mail du donateur, le montant, la devise, la date, l'identifiant de la transaction et son état — dans la seule mesure nécessaire à la tenue de nos comptes et à l'établissement d'une confirmation de don."
page.polityka-prywatnosci.s3.gateway.title: "Passerelle de paiement Axepta BNP Paribas (BLIK, virements instantanés, Apple Pay, Google Pay, cartes)"
page.polityka-prywatnosci.s3.patronage.p1Html: "Si vous décidez de rejoindre les mécènes du cycle et remplissez le formulaire de la section « Mécénat », nous traitons les <strong>prénom, nom et adresse e-mail</strong> que vous nous communiquez. Nous ne les enregistrons que pour vous contacter au sujet du soutien régulier. Le formulaire <strong>ne recueille aucune donnée de paiement</strong> — le soutien lui-même se fait par virement (permanent), que vous mettez en place et contrôlez depuis votre banque. Vos données sont conservées sur nos serveurs situés dans l'Union européenne ; la notification interne d'une nouvelle demande, que nous nous envoyons à nous-mêmes, <strong>ne contient aucune de vos données personnelles</strong>."
page.polityka-prywatnosci.s3.patronage.title: "Adhésion au mécénat (formulaire de soutien régulier)"
page.polityka-prywatnosci.s3.title: "Quelles données nous traitons"
page.polityka-prywatnosci.s3.transfer.p1: "Les données proviennent de l'ordre de virement lui-même (émetteur, libellé, montant) et ne nous parviennent que par l'intermédiaire de la banque qui tient notre compte. Il en va de même des virements récurrents (virements permanents) : leur mise en place, leur modification et leur annulation se font entièrement depuis la banque du donateur — nous ne conservons à cette fin ni les données de votre carte ni d'autorisation de prélèvement, et l'ordre demeure sous votre seul contrôle."
page.polityka-prywatnosci.s3.transfer.title: "Virement bancaire (ponctuel ou permanent)"
page.polityka-prywatnosci.s3.visitors.items.headers.text: "les en-têtes HTTP (notamment le type de navigateur, la langue et la provenance),"
page.polityka-prywatnosci.s3.visitors.items.ip.text: "l'adresse IP de l'appareil,"
page.polityka-prywatnosci.s3.visitors.items.resource.text: "l'adresse de la ressource demandée."
page.polityka-prywatnosci.s3.visitors.items.timestamp.text: "la date et l'heure de la requête,"
page.polityka-prywatnosci.s3.visitors.p1: "La seule ouverture du site entraîne le traitement automatique de données techniques par les serveurs d'hébergement et les réseaux de diffusion de contenu (CDN) :"
page.polityka-prywatnosci.s3.visitors.p2: "Ce sont les journaux standard d'un serveur HTTP. Nous ne les croisons avec aucune autre donnée et nous ne les utilisons ni pour du profilage ni pour de la publicité. Ils ne servent qu'au fonctionnement et à la sécurité du site (blocage d'un trafic abusif, par exemple)."
page.polityka-prywatnosci.s3.visitors.title: "Visiteurs du site"
page.polityka-prywatnosci.s3.zrzutka.p1Html: "L'étendue des données est déterminée par la politique de Zrzutka.pl ; au sein de ce service, le responsable du traitement des données des contributeurs est <em>Zrzutka Sp. z o.o.</em>"
page.polityka-prywatnosci.s3.zrzutka.title: "Zrzutka.pl"
page.polityka-prywatnosci.s4.items.claims.textHtml: "<strong>Constatation, exercice ou défense de droits</strong> — art. 6, § 1, f) RGPD, l'intérêt légitime de la Fondation (à l'occasion d'un versement erroné ou d'un litige, par exemple)."
page.polityka-prywatnosci.s4.items.correspondence.textHtml: "<strong>Réponse à la correspondance</strong> — art. 6, § 1, f) RGPD, notre intérêt légitime à communiquer avec les personnes que l'activité de la fondation intéresse."
page.polityka-prywatnosci.s4.items.donation.textHtml: "<strong>Réalisation d'un don</strong> — art. 6, § 1, b) RGPD (nécessité à l'exécution du contrat de donation) ainsi que c) (obligations légales en matière de comptabilité et de reporting d'une fondation). À ce titre, le paiement est traité par l'opérateur Axepta BNP Paribas / PayU."
page.polityka-prywatnosci.s4.items.hosting.textHtml: "<strong>Fonctionnement et sécurité du site</strong> (journaux du serveur) — art. 6, § 1, f) RGPD, l'intérêt légitime du responsable du traitement à assurer la continuité et la sécurité du site."
page.polityka-prywatnosci.s4.items.patronage.textHtml: "<strong>Contact au sujet du mécénat</strong> — art. 6, § 1, a) RGPD (le consentement que vous donnez dans le formulaire). Vous pouvez le retirer à tout moment en écrivant à <a href=\"mailto:rodo@voctensemble.com\">rodo@voctensemble.com</a> ; le retrait n'affecte pas la licéité du traitement effectué avant celui-ci."
page.polityka-prywatnosci.s4.items.receipt.textHtml: "<strong>Établissement d'une attestation de don</strong> — art. 6, § 1, c) RGPD, exécution d'obligations résultant du droit fiscal."
page.polityka-prywatnosci.s4.p1: "Nous traitons vos données aux finalités suivantes et sur les bases légales suivantes du RGPD :"
page.polityka-prywatnosci.s4.title: "Finalités et bases légales"
page.polityka-prywatnosci.s5.items.accountant.badge: "Cabinet comptable"
page.polityka-prywatnosci.s5.items.accountant.textHtml: "<strong>Le cabinet comptable de la fondation</strong> — dans la mesure nécessaire à la tenue des livres comptables et du registre des dons."
page.polityka-prywatnosci.s5.items.bnp.badge: "BNP Paribas"
page.polityka-prywatnosci.s5.items.bnp.textHtml: "<strong>BNP Paribas Bank Polska S.A.</strong> (ul. Kasprzaka 2, 01-211 Warszawa) — exploitant de la passerelle <em>Axepta BNP Paribas</em>. Elle traite les données de transaction (BLIK, virements instantanés, Apple Pay, Google Pay) afin d'autoriser et de régler les paiements. Aux termes du contrat conclu avec elle, elle est un <strong>responsable du traitement distinct (indépendant)</strong> des données personnelles traitées pour l'exécution d'un paiement. Politique de confidentialité : <a href=\"https://www.bnpparibas.pl/repozytorium/rodo\">bnpparibas.pl/repozytorium/rodo</a>."
page.polityka-prywatnosci.s5.items.infra.badge: "Fournisseurs d'infrastructure IT"
page.polityka-prywatnosci.s5.items.infra.textHtml: "<strong>Fournisseurs d'infrastructure technique (hébergement, CDN)</strong> — des prestataires de confiance qui nous fournissent les serveurs et le réseau de diffusion de contenu nécessaires au fonctionnement et à la protection du site. Ils agissent en qualité de sous-traitants, sur nos instructions. Nous servons nos polices de caractères localement et ne transmettons aucune adresse IP à des fournisseurs de polices tiers."
page.polityka-prywatnosci.s5.items.payu.badge: "PayU"
page.polityka-prywatnosci.s5.items.payu.textHtml: "<strong>PayU S.A.</strong> (ul. Grunwaldzka 186, 60-166 Poznań) — établissement acquéreur pour les transactions par carte. Elle assure l'autorisation, la tokenisation et le traitement des données de carte conformément à la norme PCI DSS. Elle est elle aussi un <strong>responsable du traitement distinct (indépendant)</strong> des données personnelles. Politique de confidentialité : <a href=\"https://poland.payu.com/prywatnosc/\">poland.payu.com/prywatnosc</a>."
page.polityka-prywatnosci.s5.items.zrzutka.badge: "Zrzutka.pl"
page.polityka-prywatnosci.s5.items.zrzutka.textHtml: "<strong>Zrzutka Sp. z o.o.</strong> — dès l'instant où vous suivez le lien vers notre collecte et versez par Zrzutka. Elle est un responsable du traitement distinct ; sa politique : <a href=\"https://zrzutka.pl/privacy\">https://zrzutka.pl/privacy</a>."
page.polityka-prywatnosci.s5.p1: "Selon l'opération effectuée, vos données peuvent parvenir aux entités suivantes (sous-traitants ou responsables du traitement distincts) :"
page.polityka-prywatnosci.s5.title: "Destinataires des données"
page.polityka-prywatnosci.s6.p1: "La Fondation limite les transferts de données hors de l'Espace économique européen partout où cela est possible. Notre infrastructure serveur principale se trouve sur le territoire de l'Union européenne."
page.polityka-prywatnosci.s6.p2: "Si l'exploitation technique du site donne lieu à un transfert hors EEE (par les réseaux de diffusion de contenu, par exemple), celui-ci n'a lieu que sur le fondement des clauses contractuelles types (CCT) ou d'autres garanties prévues par le RGPD."
page.polityka-prywatnosci.s6.p3: "L'exploitant de la passerelle de paiement (BNP Paribas Bank Polska S.A.) et l'établissement acquéreur pour les cartes (PayU S.A.) sont établis en Pologne. Ils peuvent toutefois — dans le cadre de leurs propres systèmes de lutte contre la fraude — traiter des données également hors EEE, ce dont ils répondent selon les modalités définies dans leurs politiques de confidentialité."
page.polityka-prywatnosci.s6.title: "Transferts hors EEE"
page.polityka-prywatnosci.s7.items.audio.textHtml: "<strong>Préférence audio</strong> dans le localStorage — 3 heures après son enregistrement, ou jusqu'à l'effacement des données du navigateur par l'utilisateur."
page.polityka-prywatnosci.s7.items.correspondence.textHtml: "<strong>Correspondance par e-mail</strong> — jusqu'à la clôture de l'affaire, et pas plus de 3 ans après le dernier échange. Ce délai peut être prolongé jusqu'à la prescription d'éventuelles réclamations si la correspondance constitue une preuve dans une affaire."
page.polityka-prywatnosci.s7.items.donors.textHtml: "<strong>Données des donateurs (documents comptables et justificatifs de versement)</strong> — pendant 5 ans, à compter du début de l'année suivant l'exercice auquel les données se rapportent. Cette obligation découle directement de l'art. 74 de la loi polonaise sur la comptabilité et des dispositions de l'Ordonnance fiscale."
page.polityka-prywatnosci.s7.items.logs.textHtml: "<strong>Journaux du serveur HTTP</strong> — en principe jusqu'à 12 mois, sauf si la loi ou une procédure en cours (une analyse d'abus, par exemple) justifie une conservation plus longue."
page.polityka-prywatnosci.s7.items.patronage.textHtml: "<strong>Demandes de mécénat</strong> — jusqu'à la fin du contact au sujet du mécénat ou jusqu'au retrait du consentement. Si une collaboration durable s'engage, les données passent sous le régime de conservation des donateurs (documents comptables, 5 ans) ; sinon, nous les supprimons sans délai à la fin du contact."
page.polityka-prywatnosci.s7.title: "Durée de conservation"
page.polityka-prywatnosci.s8.items.access.textHtml: "<strong>Le droit d'accès</strong> à vos données et à l'obtention d'une copie de celles-ci (art. 15 RGPD)."
page.polityka-prywatnosci.s8.items.complaint.textHtml: "<strong>Le droit d'introduire une réclamation</strong> auprès du Président de l'Office de protection des données personnelles (ul. Stawki 2, 00-193 Warszawa, <a href=\"https://uodo.gov.pl/\">uodo.gov.pl</a>)."
page.polityka-prywatnosci.s8.items.erasure.textHtml: "<strong>Le droit à l'effacement</strong> des données (« droit à l'oubli », art. 17)."
page.polityka-prywatnosci.s8.items.objection.textHtml: "<strong>Le droit d'opposition</strong> au traitement fondé sur l'intérêt légitime du responsable du traitement (art. 21)."
page.polityka-prywatnosci.s8.items.portability.textHtml: "<strong>Le droit à la portabilité des données</strong>, lorsque le traitement repose sur le consentement ou sur un contrat et qu'il est effectué de façon automatisée (art. 20)."
page.polityka-prywatnosci.s8.items.rectification.textHtml: "<strong>Le droit de rectification</strong> des données inexactes ou incomplètes (art. 16)."
page.polityka-prywatnosci.s8.items.restriction.textHtml: "<strong>Le droit à la limitation du traitement</strong> (art. 18)."
page.polityka-prywatnosci.s8.p1: "Conformément au RGPD, vous disposez des droits suivants :"
page.polityka-prywatnosci.s8.p2Html: "Pour exercer l'un de ces droits, écrivez à <a href=\"mailto:rodo@voctensemble.com\">rodo@voctensemble.com</a>. Nous répondons sans retard injustifié, et au plus tard dans le mois suivant la réception de la demande."
page.polityka-prywatnosci.s8.title: "Vos droits"
page.polityka-prywatnosci.s9.items.anonymous.textHtml: "<strong>Anonymat complet :</strong> nous ne collectons ni adresses IP, ni données de localisation, ni aucune information permettant d'identifier une personne."
page.polityka-prywatnosci.s9.items.cookieless.textHtml: "<strong>Aucun cookie :</strong> l'outil n'utilise aucun fichier cookie et n'enregistre aucune donnée dans la mémoire de votre navigateur."
page.polityka-prywatnosci.s9.items.minimal.textHtml: "<strong>Minimalisme :</strong> nous ne traitons que des données statistiques brutes et agrégées (nombre de visites, pages les plus consultées), qui ne nous servent qu'à améliorer le site."
page.polityka-prywatnosci.s9.p1Html: "Afin d'améliorer le site et de comprendre quels contenus vous intéressent, nous utilisons l'outil <strong>Plausible Analytics</strong>. C'est une solution centrée sur la vie privée :"
page.polityka-prywatnosci.s9.p2Html: "Le détail de la manière dont cet outil protège la vie privée figure dans la <a href=\"https://plausible.io/data-policy\">Politique de données (Data Policy)</a> officielle de Plausible."
page.polityka-prywatnosci.s9.title: "Statistiques de visite"
page.regulamin-darowizn.head.kicker: "Document · dons"
page.regulamin-darowizn.head.lede: "Le présent règlement définit les modalités des dons faits à la Fondation VoctFoundation par l'intermédiaire du site voctensemble.com — par paiement en ligne et par virement bancaire."
page.regulamin-darowizn.head.title: "Règlement des dons"
page.regulamin-darowizn.history.entries.v1-0.note: "Version initiale du règlement, publiée avec la mise en ligne du site voctensemble.com."
page.regulamin-darowizn.history.entries.v1-1.note: "Le § 2 a été complété par les moyens de don en dehors de la passerelle de paiement en ligne : le virement bancaire ordinaire (ponctuel ou sous forme de virement permanent) et le service de collecte Zrzutka.pl."
page.regulamin-darowizn.history.entries.v1-2.note: "Ajout du § 5, alinéa 3 : le règlement est également publié en traduction anglaise et française, la version polonaise restant celle qui fait foi."
page.regulamin-darowizn.history.label: "Historique des versions"
page.regulamin-darowizn.s1.p1Html: "Le présent règlement définit les modalités des dons faits à la <strong>Fundacja VoctFoundation</strong>, dont le siège est à Cracovie (ul. Św. Filipa 23/3, 31-150 Kraków), inscrite au Registre national judiciaire sous le numéro KRS : 0001237252, NIP : 6762718992, REGON : 544621525, ci-après « la Fondation »."
page.regulamin-darowizn.s1.p2Html: "Conformément aux § 5 et § 6 des <a href=\"/docs/Statut-VoctFoundation.pdf\">Statuts de la Fondation</a>, publiés sur le site de la Fondation, tous les dons faits à la Fondation sont affectés exclusivement à la réalisation de ses buts statutaires, en particulier l'activité artistique, notamment musicale, le développement et la diffusion de la création musicale, la documentation, la protection et la diffusion du patrimoine musical, l'action éducative et de sensibilisation dans le domaine de la culture, l'élargissement de l'accès à la culture, le soutien aux jeunes artistes ainsi que la réalisation de projets artistiques, y compris l'activité de l'ensemble en résidence de la Fondation."
page.regulamin-darowizn.s1.p3: "Peut être donateur toute personne physique majeure, toute personne morale ou toute entité dépourvue de la personnalité juridique."
page.regulamin-darowizn.s1.p4: "Conformément à l'art. 890 § 1, 2e phrase du Code civil polonais, le contrat de donation d'une somme d'argent devient valable et effectif au moment de l'exécution de la prestation (c'est-à-dire lorsque les fonds parviennent sur le compte de la Fondation), quelle que soit la forme de la déclaration de volonté."
page.regulamin-darowizn.s1.title: "Dispositions générales"
page.regulamin-darowizn.s2.p1: "Les dons en ligne se font au moyen du formulaire de soutien disponible sur le site voctensemble.com."
page.regulamin-darowizn.s2.p2: "L'opérateur des paiements en ligne est BNP Paribas Bank Polska S.A., dont le siège est à Varsovie (passerelle Axepta BNP Paribas) ; pour les transactions par carte, l'établissement acquéreur est PayU S.A., dont le siège est à Poznań."
page.regulamin-darowizn.s2.p3: "Le donateur peut faire un don par des moyens de paiement modernes et chiffrés, en particulier : cartes de paiement (Visa, Mastercard), système BLIK, virements bancaires instantanés (Pay-By-Link) et portefeuilles électroniques (Apple Pay, Google Pay)."
page.regulamin-darowizn.s2.p4: "Indépendamment du paiement en ligne, le donateur peut faire un don par virement bancaire ordinaire directement sur le compte de la Fondation — de manière ponctuelle ou sous forme de virement permanent, que le donateur met en place, modifie et annule lui-même depuis sa banque ; la Fondation ne conserve à cette fin ni données de carte ni autorisation de prélèvement. Un don peut également être fait par l'intermédiaire du service de collecte Zrzutka.pl, dans les conditions prévues par le règlement de ce service."
page.regulamin-darowizn.s2.p5: "Les dons peuvent être faits en PLN et en EUR. La disponibilité des différents moyens de paiement dépend de la devise choisie."
page.regulamin-darowizn.s2.p6: "Le fait de cliquer sur le bouton confirmant la volonté de soutenir et d'effectuer le paiement vaut conclusion du contrat de donation et acceptation du présent règlement."
page.regulamin-darowizn.s2.title: "Modalités des dons et moyens de paiement"
page.regulamin-darowizn.s3.p1: "Le donateur a le droit de signaler toute irrégularité survenue dans le processus de don (par exemple un dysfonctionnement technique du système de paiement)."
page.regulamin-darowizn.s3.p2Html: "Merci d'adresser vos signalements par voie électronique à l'adresse e-mail : <a href=\"mailto:kontakt@voctensemble.com\">kontakt@voctensemble.com</a>."
page.regulamin-darowizn.s3.p3: "La Fondation examine les signalements avec le plus grand soin et sans délai, et en tout état de cause dans les 14 jours suivant leur réception."
page.regulamin-darowizn.s3.p4: "En cas de paiement effectué par erreur ou de défaillance de la banque du donateur ayant entraîné un double débit, le donateur a le droit de demander le remboursement du don dans les 14 jours suivant sa réalisation. La demande doit être envoyée à l'adresse indiquée à l'alinéa 2, en précisant l'identifiant de la transaction et l'adresse e-mail utilisée lors du paiement."
page.regulamin-darowizn.s3.p5: "Pour la sécurité financière des donateurs, tout remboursement est effectué exclusivement sur le moyen de paiement d'origine (le même compte bancaire ou la même carte de paiement) que celui utilisé lors du versement initial, conformément à la loi et aux règlements des opérateurs de paiement."
page.regulamin-darowizn.s3.title: "Réclamations et remboursements"
page.regulamin-darowizn.s4.p1: "Le responsable du traitement des données personnelles des donateurs est la Fondation VoctFoundation."
page.regulamin-darowizn.s4.p2Html: "Les informations détaillées relatives au traitement des données personnelles, aux finalités de ce traitement, au rôle des opérateurs de paiement (Axepta BNP Paribas, PayU) et aux droits dont disposent les donateurs figurent dans la <a href=\"/polityka-prywatnosci\">Politique de confidentialité</a> disponible sur le site voctensemble.com."
page.regulamin-darowizn.s4.title: "Données personnelles (RGPD)"
page.regulamin-darowizn.s5.p1: "La Fondation se réserve le droit d'apporter des modifications au présent règlement ; elle en informera par la mise à jour de son texte sur le site internet."
page.regulamin-darowizn.s5.p2: "Pour tout ce que le présent règlement ne prévoit pas, les dispositions du droit polonais s'appliquent, en particulier celles du Code civil."
page.regulamin-darowizn.s5.p3: "Le présent règlement est publié en polonais, ainsi qu'en traduction anglaise et française. La version polonaise est celle qui fait foi ; les traductions n'ont qu'une valeur informative et, en cas de divergence entre les versions linguistiques, c'est le texte polonais qui prévaut."
page.regulamin-darowizn.s5.title: "Dispositions finales"
page.skarbiec.failure.strap: "Nous sommes désolés, le paiement n'a pas pu être traité. Rien n'a été prélevé sur votre compte. Merci de réessayer ou de choisir un autre moyen."
page.skarbiec.failure.title1: "Le paiement"
page.skarbiec.failure.title2: "n'a pas abouti."
page.skarbiec.gratitude.strap: "Merci. Que cette musique continue de résonner — grâce à vous aussi."
page.skarbiec.gratitude.title1: "Votre voix"
page.skarbiec.gratitude.title2: "a rejoint le chœur."
page.skarbiec.head.kicker: "Trésor de musique · cycle MMXXVI"
page.skarbiec.head.title: "Soutenir le cycle"
page.skarbiec.mecenat.benefit1: "Un remerciement personnel et un contact direct avec le fondateur de la Fondation."
page.skarbiec.mecenat.benefit2: "Votre nom parmi les mécènes du cycle, si vous y consentez."
page.skarbiec.mecenat.benefit3: "La priorité sur les invitations aux concerts et aux événements à venir."
page.skarbiec.mecenat.benefit4: "Un récapitulatif annuel de vos dons — utile au moment de votre déclaration d'impôts."
page.skarbiec.mecenat.benefitsLabel: "Ce que nous offrons à nos mécènes"
page.skarbiec.mecenat.confirmBody: "Nous avons enregistré votre demande — nous vous écrirons dès que votre premier virement nous parviendra."
page.skarbiec.mecenat.confirmContact: "Pour toute question, écrivez à"
page.skarbiec.mecenat.confirmFallbackName: "cher mécène"
page.skarbiec.mecenat.confirmGreeting: "Merci"
page.skarbiec.mecenat.consentHtml: "Je consens au traitement de mes données (prénom, nom, adresse e-mail) afin d'être contacté au sujet du mécénat, conformément à la <a href=\"/polityka-prywatnosci\">Politique de confidentialité</a>."
page.skarbiec.mecenat.howHtml: "Le mécénat repose sur un <strong>virement permanent</strong> — un versement mensuel que vous mettez en place et contrôlez entièrement depuis votre banque (par exemple 50, 100 ou 200 zł par mois). Vous pouvez le modifier ou l'annuler à tout moment, sans nous contacter. Sans commission et sans transmettre vos données de carte."
page.skarbiec.mecenat.howLabel: "Comment cela fonctionne"
page.skarbiec.mecenat.joinLabel: "Dites-nous que vous nous rejoignez"
page.skarbiec.mecenat.note: "Le mécénat est plus qu'un don ponctuel — c'est une relation durable avec l'ensemble et sa musique. Votre soutien régulier nous permet de préparer la suite : les répétitions, les enregistrements et les prochains volets du cycle des Concerts Spirituels. En retour, nous vous invitons au plus près de ce que nous faisons."
page.skarbiec.mecenat.tag: "soutien régulier · une relation"
page.skarbiec.mecenat.talkLabel: "Vous préférez en parler d'abord ?"
page.skarbiec.mecenat.talkNote: "Écrivez-nous — nous répondrons personnellement et vous aiderons à trouver la forme de soutien qui vous convient."
page.skarbiec.mecenat.title: "Devenez mécène du cycle"
page.skarbiec.methods.label: "Choisissez votre voie"
page.skarbiec.online.consentLead: "J'ai lu et j'accepte le"
page.skarbiec.online.methodsNoteEur: "Les paiements en EUR passent uniquement par les cartes de paiement et Apple/Google Pay."
page.skarbiec.online.methodsNotePln: "Les paiements en PLN passent par BLIK, les cartes de paiement, Apple/Google Pay et les virements bancaires instantanés."
page.skarbiec.online.note: "Directement sur le compte de la Fondation — par la passerelle Axepta BNP Paribas. Sans intermédiaire, sans création de compte."
page.skarbiec.online.tag: "immédiat · sécurisé"
page.skarbiec.online.title: "Faire un don en ligne"
page.skarbiec.progress.awaiting: "le cycle des Concerts Spirituels"
page.skarbiec.progress.open: "Collecte ouverte"
page.skarbiec.qr.hintHtml: "Ouvrez l'application de votre banque, choisissez <strong>« Virement QR »</strong> et scannez. Vous saisissez le montant dans l'application."
page.skarbiec.qr.note: "Scannez le code avec l'appareil photo de votre application bancaire — tous les champs se remplissent d'eux-mêmes."
page.skarbiec.qr.recurringLabel: "Un soutien chaque mois · virement permanent"
page.skarbiec.qr.recurringNoteHtml: "Vous souhaitez soutenir le cycle régulièrement ? Copiez les données ci-dessus et enregistrez-les dans votre application bancaire comme <strong>virement permanent</strong> (rubrique « virements permanents » / « paiements récurrents ») — par exemple 25, 50 ou 100 zł par mois. Le code QR ci-dessus crée un virement ponctuel ; un ordre récurrent se saisit à la main. Il reste entièrement sous votre contrôle — vous pouvez le modifier ou l'annuler à tout moment depuis votre banque, sans nous contacter. Sans commission et sans transmettre vos données de carte."
page.skarbiec.qr.tag: "sans commission"
page.skarbiec.qr.title: "Virement depuis votre application bancaire"
page.skarbiec.result.kicker: "VoctEnsemble · cycle MMXXVI"
page.skarbiec.zrzutka.note: "BLIK, carte, Apple Pay, Google Pay. Dons réguliers possibles. Rejoignez la communauté des auditeurs."
page.skarbiec.zrzutka.tag: "communauté · instantané"
