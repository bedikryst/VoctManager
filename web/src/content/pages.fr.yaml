page.kontakt.hero.lede: "La cathédrale de Łódź, un manoir à Szczawnica, la synagogue Tempel, des mariages à l'abbaye de Tyniec — chacune de ces soirées a commencé par l'invitation de quelqu'un. La prochaine peut être la vôtre."
