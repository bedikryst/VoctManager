# biogramy.pdf, in this order, Polish then English. The ensemble's Polish biogram is not here: the
# generator opens the Polish half with the page's full biogram (`press.yaml` about.longHtml), the
# one text the site has. Its English is here, first, because the page has none.
biograms:
  pl:
    - name: "Florent de Bazelaire"
      role: "dyrygent"
      body:
        - >-
          Florent de Bazelaire jest dyrygentem, założycielem i kierownikiem artystycznym
          VoctEnsemble, niezależnego profesjonalnego zespołu wokalnego, który powołał do życia
          w 2024 roku. Jest absolwentem Royal Academy of Music w Londynie, gdzie studiował
          dyrygenturę symfoniczną. Jego obecna działalność artystyczna koncentruje się wokół
          muzyki chóralnej, ze szczególnym zainteresowaniem repertuarem sakralnym, od renesansowej
          polifonii po muzykę współczesną.
        - >-
          Jego wrażliwość muzyczna wyrasta z głębokiego zakorzenienia w kulturze francuskiej oraz
          zainteresowania językiem i literaturą. W pracy nad muzyką szczególne miejsce zajmuje dla
          niego relacja między słowem, brzmieniem i znaczeniem. Interesuje go nie tylko to, jak
          utwór brzmi, ale także to, co poprzez muzykę może zostać odkryte i przeżyte.
        - >-
          W centrum jego pracy znajduje się przekonanie, że muzyka może być nie tylko
          doświadczeniem estetycznym, ale także przestrzenią kontemplacji, spotkania i duchowej
          refleksji. Z VoctEnsemble tworzy autorskie Koncerty Duchowe, nawiązujące do
          XVIII-wiecznej tradycji Concerts Spirituels. Każdy projekt budowany jest wokół
          określonej idei, pytania lub zagadnienia duchowego. Wśród dotychczasowych projektów
          znalazły się m.in. Kontemplacja Wcielenia, 9 Kart z Księgi Psalmów, Wołanie Gór, Hymn
          Poległym oraz Aeternam – Epitafium dla Gazy.
        - >-
          Jako dyrygent szczególnie interesuje się procesem interpretacji – tym momentem wspólnej
          pracy z muzykami, kiedy utwór zaczyna się odsłaniać, a jego kierunek staje się coraz
          bardziej czytelny. Ważna jest dla niego również relacja między muzyką a przestrzenią.
          W swoich projektach wykorzystuje ciszę, światło i elementy scenografii jako część
          doświadczenia muzyki.
        - >-
          Jest również założycielem VoctFoundation, której celem jest wspieranie rozwoju
          artystycznego i organizacyjnego VoctEnsemble oraz tworzenie trwałych warunków dla jego
          działalności.
    - name: "Sebastian Kuczyński"
      role: "organy"
      body:
        - >-
          Organista, improwizator i muzyk kościelny, absolwent Uniwersytetu Muzycznego Fryderyka
          Chopina w Warszawie, gdzie studiował instrumentalistykę i muzykę kościelną. W ramach
          programu Erasmus+ kształcił się w Hochschule für Musik und Theater w Hamburgu u Wolfganga
          Zerera oraz Menno van Delfta. Ukończył również podyplomowe studia „Menedżer muzyki” na
          UMFC.
        - >-
          Laureat II nagrody XII Międzynarodowego Konkursu Interpretacji Muzyki Organowej im.
          J.P. Sweelincka w Gdańsku (2024), jako jedyny Polak zakwalifikowany do finału, oraz
          zwycięzca konkursów organowych i improwizatorskich w Olsztynie, Krasnobrodzie, Legnicy
          i Turku. Stypendysta programu „Młoda Polska”.
        - >-
          Jako solista i kameralista koncertuje w Polsce i za granicą; występował m.in. w NOSPR
          oraz podczas międzynarodowych festiwali organowych w Gdańsku i Kamieniu Pomorskim.
          Współpracował z Orkiestrą i Chórem Filharmonii Narodowej oraz Operą i Filharmonią
          Podlaską. Jest głównym organistą Sanktuarium Narodowego św. Andrzeja Boboli w Warszawie
          oraz inicjatorem i dyrektorem artystycznym Mokotowskiego Międzynarodowego Festiwalu
          Muzyki Organowej i Kameralnej.
    - name: "Radu Ropotan"
      role: "skrzypce"
      body:
        - >-
          Rumuński skrzypek, absolwent Royal College of Music oraz Royal Academy of Music
          w Londynie, gdzie w 2014 roku ukończył studia magisterskie. Kształcił się m.in. pod
          kierunkiem Yuriego Zhislina, Macieja Rakowskiego, Igora Petrushevsky’ego i Levona
          Chilingiriana; pracował także z Thomasem Brandisem, Anną Lisą Bezrodny i Maximem
          Vengerovem.
        - >-
          Laureat ponad 30 nagród i wyróżnień w konkursach krajowych i międzynarodowych, m.in.
          Remember Enescu International Violin Competition, Andrea Postacchini International
          Competition oraz Winifred Prize Royal Academy of Music. Koncertował w Europie i Azji,
          występując m.in. w Southbank Centre w Londynie, Suntory Hall w Tokio oraz Ateneum
          Rumuńskim w Bukareszcie. W Japonii występował jako gość Pacific Music Festival.
        - >-
          W 2021 roku uzyskał stopień doktora na Uniwersytecie Transilvania w Braszowie, na
          podstawie pracy poświęconej stylistycznym i interpretacyjnym aspektom utworów na
          skrzypce solo Eugène’a Ysaÿe’a. Prowadzi również kursy mistrzowskie, a jako
          współzałożyciel Pavilionul Artiștilor angażuje się w rozwój młodych muzyków i promocję
          muzyki klasycznej.
  en:
    - name: "VoctEnsemble"
      role: "vocal ensemble"
      body:
        - >-
          VoctEnsemble is a Kraków-based vocal ensemble founded by Florent de Bazelaire, who
          passionately seeks to redefine the concept of the spiritual concert. The ensemble draws
          inspiration from the 18th-century Concerts Spirituels, giving this tradition
          a contemporary dimension and creating a space for exploring the mysteries of reality
          through vocal music. Its rich and diverse repertoire comprises over 60 works, ranging
          from Renaissance polyphony to contemporary music, with a particular emphasis on sacred
          music.
        - >-
          The ensemble is distinguished by a particular sensitivity to events in the world,
          treating art as a form of prayer and reflection on the human condition. Among its most
          significant achievements are its inaugural concert, Kontemplacja Wcielenia
          (Contemplation of the Incarnation), recorded by Ars Sonora Studio, and its socially
          engaged projects Hymn Poległym (Hymn to the Fallen), marking the third anniversary of
          the war in Ukraine, and Aeternam – Epitafium dla Gazy (Aeternam – Epitaph for Gaza).
          VoctEnsemble regularly performs at prestigious festivals, including the 39th edition of
          the Days of Organ and Chamber Music in Rybnik and the Organy solo i kameralnie (Organ
          Solo and Chamber Music) series at Łódź Cathedral.
        - >-
          The ensemble’s distinctive identity grows from its commitment to ensemble unity and its
          continuous work towards a cohesive sound. Performances are often enhanced by Ada
          Bystrzycka’s contemporary lighting design or animations by Sebastian Kuźma, creating
          a multisensory experience of music for the audience.
    - name: "Florent de Bazelaire"
      role: "conductor"
      body:
        - >-
          Florent de Bazelaire is a conductor, founder and artistic director of VoctEnsemble, an
          independent professional vocal ensemble he founded in 2024. He is a graduate of the
          Royal Academy of Music in London, where he studied orchestral conducting. His artistic
          work focuses on choral music, with a particular interest in sacred repertoire, from
          Renaissance polyphony to contemporary music.
        - >-
          His musical sensibility is deeply rooted in French culture and shaped by his interest in
          language and literature. He is particularly interested in the relationship between
          words, sound and meaning, and in what music can reveal and open up to experience. His
          work is concerned not only with how a piece sounds, but also with what lies beyond the
          purely musical experience.
        - >-
          At the heart of his work is the conviction that music can be more than an aesthetic
          experience: it can also create a space for contemplation, encounter and spiritual
          reflection. With VoctEnsemble, he creates original Koncerty Duchowe (Spiritual
          Concerts), inspired by the 18th-century tradition of the Concerts Spirituels. Each
          project is built around a particular idea, question or spiritual theme. Previous
          projects include Kontemplacja Wcielenia, 9 Kart z Księgi Psalmów, Wołanie Gór, Hymn
          Poległym and Aeternam – Epitafium dla Gazy.
        - >-
          As a conductor, he is particularly interested in the process of interpretation: in the
          moment when musicians work together and a piece begins to reveal itself, gradually
          finding its direction and form. He is also interested in the relationship between music
          and space. In his projects, silence, light and elements of scenography become part of
          the musical experience.
        - >-
          He is also the founder of VoctFoundation, whose aim is to support the artistic and
          organisational development of VoctEnsemble and to create sustainable conditions for its
          continued work.
    - name: "Sebastian Kuczyński"
      role: "organ"
      body:
        - >-
          Organist, improviser and church musician, Sebastian Kuczyński is a graduate of the
          Fryderyk Chopin University of Music in Warsaw, where he studied instrumental performance
          and church music. As part of the Erasmus+ programme, he continued his studies at the
          Hochschule für Musik und Theater Hamburg with Wolfgang Zerer and Menno van Delft. He also
          completed a postgraduate programme in Music Management at the Fryderyk Chopin University
          of Music.
        - >-
          He was awarded Second Prize at the 12th International J. P. Sweelinck Organ
          Interpretation Competition in Gdańsk (2024), having been the only Polish finalist, and
          has won organ and improvisation competitions in Olsztyn, Krasnobród, Legnica and Turek.
          He is a recipient of the Young Poland scholarship programme.
        - >-
          As a soloist and chamber musician, he performs in Poland and abroad, appearing at venues
          including NOSPR and at international organ festivals in Gdańsk and Kamień Pomorski. He
          has collaborated with the National Philharmonic Orchestra and Choir and with the Podlasie
          Opera and Philharmonic. He is principal organist at the National Shrine of St Andrew
          Bobola in Warsaw and the founder and artistic director of the Mokotów International
          Festival of Organ and Chamber Music.
    - name: "Radu Ropotan"
      role: "violin"
      body:
        - >-
          Romanian violinist Radu Mihai Ropotan is a graduate of the Royal College of Music and the
          Royal Academy of Music in London, where he completed his Master’s degree in 2014. He
          studied with, among others, Yuri Zhislin, Maciej Rakowski, Igor Petrushevsky and Levon
          Chilingirian, and has also worked with Thomas Brandis, Anna-Lisa Bezrodny and Maxim
          Vengerov.
        - >-
          He has received more than 30 prizes and distinctions at national and international
          competitions, including the Remember Enescu International Violin Competition, the Andrea
          Postacchini International Competition and the Winifred Prize at the Royal Academy of
          Music. He has performed across Europe and Asia, including at London’s Southbank Centre,
          Suntory Hall in Tokyo and the Romanian Athenaeum in Bucharest. In Japan, he has appeared
          as a guest artist at the Pacific Music Festival.
        - >-
          In 2021, he was awarded a doctorate by Transilvania University of Brașov for research
          into the stylistic and interpretative aspects of Eugène Ysaÿe’s works for solo violin.
          He also gives masterclasses and, as co-founder of Pavilionul Artiștilor, is involved in
          supporting young musicians and promoting classical music.
