# The press kit for Pochwała Stworzenia (11.10.2026) — the texts /press offers to copy and the pack
# ships as files. Schema and every string built from it: `src/lib/pressKit.ts`.
#
# ONLY COPY LIVES HERE. Title, day, hour, venue, address, festival, door, composers and the
# conductor are printed from `concerts.yaml`. The prose below has to name the day and the hour
# anyway — an announcement is pasted whole into somebody's listing — so the loader checks that
# every dated text still names the corpus's; move the concert and the build fails until this file
# follows.
#
# THESE ARE APPROVED TEXTS, delivered as PDFs on 28.09.2026 (press-pack/inbox/2026-09-28/, outside
# git) and transcribed here word for word. The departures, which the PDFs do not carry:
#   · the conductor's name is NEVER DECLINED — „pod dyrekcją Florent de Bazelaire”, „przez Florent
#     de Bazelaire” — because he reads it as French; the PDFs mix both forms;
#   · „Pieśń słoneczna” keeps a lower-case second word, as a work's title does and as the corpus
#     writes it; the festival is „Fenomen Człowieka”, an event's name, capitalised as its
#     organiser writes it (both settled 28.09.2026);
#   · „utwory Masseneta, Ešenvalds, …” → „Ešenvaldsa”;
#   · EN: „Jacek Sykułski” → „Sykulski”, „hope..” → „hope.”, „1:30 p.m” → „1.30 pm” (the form
#     the other EN text uses), „39thedition” → „39th edition”.
#
# WHAT THESE TEXTS MUST NEVER SAY, from docs/specs/koncert-pochwala-stworzenia-2026-10.md — check
# any later edit against it:
#   · the relation is VERTICAL — creation as the road to the Creator, the human as God's image
#     (§9); never the human as a brother of the creatures (§12);
#   · the encore is never named: it is the ensemble's to give, and a press text that lists it has
#     promised it;
#   · nothing about how often the Pärt returns or where: the conductor's numbering has moved twice,
#     and a printed listing cannot follow a third move;
#   · the Stetit Angelus / All Saints rhyme is spent ONCE per text;
#   · no Polish Canticle but our own glosses: Leopold Staff's translation is protected to the end of
#     2027 (§11).
#
# NO PROGRAMME IN THE PACK. The running order is not published on /press; the concert page carries
# it, and that is where it is kept true.

concert: pochwala-stworzenia
forces: "12 głosów · skrzypce · organy"

# The concert card's paragraph on /press, and the paragraph its Kopiuj carries.
lede: >-
  „Pochwała Stworzenia” to kolejny koncert z autorskiego cyklu Koncertów Duchowych VoctEnsemble,
  inspirowanego XVIII-wieczną tradycją francuskich Concerts Spirituels. Osią, a zarazem inspiracją
  dla koncertu, jest „Pieśń słoneczna” św. Franciszka z Asyżu. Muzyka różnych epok rozwija
  przesłanie kantyku, prowadząc od zachwytu nad stworzeniem przez doświadczenie ludzkiej kruchości
  i śmierci ku modlitwie i nadziei ostatecznej.

frame:
  organizers: "VoctFoundation i VoctEnsemble"
  within: "III edycji „Fenomenu Człowieka” Fundacji Hospicyjnej „Mój Dom”"

release:
  title: "Pochwała Stworzenia"
  subtitle: >-
    Koncert Duchowy VoctEnsemble inspirowany kantykiem Laudes creaturarum św. Franciszka z Asyżu
  lead: >-
    11 października o godz. 13:30 w kościele Wszystkich Świętych w Warszawie zabrzmi „Pochwała
    Stworzenia”, kolejny projekt autorskiego cyklu Koncertów Duchowych VoctEnsemble, nawiązującego
    do francuskiej tradycji Concerts Spirituels. Punktem wyjścia programu jest franciszkańskie
    Laudes creaturarum; jego perspektywę rozwijają dzieła od końca XIX wieku do dziś, ze
    szczególnym miejscem dla muzyki współczesnych polskich kompozytorów Mariana Borkowskiego
    i Jacka Sykulskiego.
  sections:
    - heading: "Jeden kantyk, cały koncert"
      body:
        - >-
          Laudes creaturarum nie jest katalogiem piękna natury, lecz aktem pochwały: Franciszek
          zwraca się ku Stwórcy poprzez stworzenie, a perspektywa kantyku rozszerza się od światła
          i żywiołów aż po ludzkie cierpienie, śmierć i ludzką nadzieję.
        - >-
          „Pochwała Stworzenia” przenosi ten ruch na cały koncert. Kolejne utwory nie ilustrują
          obrazów Franciszka, lecz odsłaniają kolejne wymiary tej samej pochwały: Boga Stwórcy,
          stworzenia, przebaczenia i śmierci, która otwiera się ku nadziei. Centralne Laudes
          creaturarum Carla Orffa, skomponowane do XIII-wiecznego tekstu w jego starowłoskim
          brzmieniu, kondensuje kantyk w zwartej ośmiogłosowej formie; pozostałe dzieła rozwijają
          jego przesłanie.
        - >-
          Pomiędzy kolejnymi częściami powraca Spiegel im Spiegel Arvo Pärta „Lustro w lustrze” –
          muzyczny obraz relacji stworzenia i Stwórcy.
    - heading: "Polska muzyka w przebiegu koncertu"
      body:
        - >-
          Współczesna muzyka polska nie tworzy w programie osobnego bloku, lecz wyznacza jego
          kluczowe momenty. Trzy utwory Mariana Borkowskiego pojawiają się na różnych etapach
          koncertu: Gloria II i Lumen na początku, Dona eis requiem I niemal u jego końca. Pochwała,
          światło i modlitwa za zmarłych prowadzą program od jego otwarcia ku doświadczeniu
          śmierci. Obok nich Stoi lód na Prośnie Jacka Sykulskiego kieruje uwagę ku ziemi
          i ludzkiemu doświadczeniu, naznaczonemu trudem i przemijaniem.
        - >-
          Dalszą część koncertu wypełniają utwory Masseneta, Ešenvaldsa, Vaughana Williamsa
          i Enescu. Całość zamyka Stetit Angelus Rihardsa Dubry – muzyczny obraz modlitwy świętych
          przed Bogiem, który w przestrzeni kościoła Wszystkich Świętych zyskuje szczególną wymowę.
    - heading: "Głos, skrzypce i organy"
      body:
        - >-
          Zmienna obsada wokalna pozwala ukazać różne oblicza brzmienia zespołu: VoctEnsemble
          wykona kompozycje na 5, 7, 8, 9 i 12 głosów pod kierunkiem Florent de Bazelaire. Partie
          wokalne dopełnią skrzypce i organy.
        - >-
          Z zespołem wystąpią Radu Ropotan, wybitny rumuński skrzypek, absolwent Royal Academy of
          Music w Londynie, oraz Sebastian Kuczyński, organista i improwizator, absolwent
          Uniwersytetu Muzycznego Fryderyka Chopina i dyrektor artystyczny Mokotowskiego
          Międzynarodowego Festiwalu Muzyki Organowej i Kameralnej.
    - heading: "Finał Fenomenu Człowieka"
      body:
        - >-
          „Pochwała Stworzenia” zamknie III edycję „Fenomenu Człowieka”, poświęconą pięknu.
          Wydarzenie organizowane przez Fundację Hospicyjną „Mój Dom” wyrasta z doświadczenia
          towarzyszenia osobom ze stwardnieniem zanikowym bocznym. Symbolem Fenomenu jest oko.
          W „Pochwale Stworzenia” spojrzenie otwiera na piękno świata; w doświadczeniu SLA może
          pozostać jednym z ostatnich sposobów kontaktu z drugim człowiekiem. Ten sam gest
          patrzenia łączy więc zachwyt z obecnością przy człowieku w jego kruchości.
        - >-
          Koncert rozpocznie się o godz. 13:30, po niedzielnej liturgii w kościele Wszystkich
          Świętych. Wstęp wolny.
  # After the practical block and the links: who the ensemble and the foundation are, and where
  # the pictures are.
  about:
    - heading: "O VoctEnsemble"
      body:
        - >-
          VoctEnsemble to niezależny zespół wokalny założony w Krakowie w 2024 roku przez Florent
          de Bazelaire. W centrum jego pracy znajduje się człowiek i doświadczenia, wobec których
          muzyka pozwala zatrzymać się uważniej: piękno, cierpienie, pamięć, tajemnica czy
          nadzieja. Z tej perspektywy wyrastają autorskie Koncerty Duchowe, budowane wokół jednej
          idei lub pytania i nawiązujące do XVIII-wiecznej tradycji francuskich Concerts
          Spirituels. Repertuar zespołu rozciąga się od renesansowej polifonii po muzykę
          współczesną, ze szczególnym miejscem dla repertuaru sakralnego, traktowanego jako żywe
          świadectwo ludzkiego doświadczenia.
    - heading: "O VoctFoundation"
      body:
        - >-
          VoctFoundation, powołana w 2026 roku, tworzy organizacyjne, produkcyjne i finansowe
          warunki dla projektów wyrastających z konkretnych idei artystycznych. Wokół każdej
          realizacji łączy twórców, wykonawców, instytucje i partnerów, dobierając skalę i sposób
          działania do potrzeb projektu. Jakość dzieła i jego spotkanie z publicznością traktuje
          jako części tego samego procesu: projekt ma nie tylko przyjąć właściwą sobie formę, lecz
          także stać się doświadczeniem wspólnym. VoctEnsemble jest zespołem rezydentem Fundacji,
          a „Pochwała Stworzenia” jej pierwszą realizacją.
    - body:
        - >-
          Materiały wizualne do publikacji, w tym zdjęcia VoctEnsemble i plakat koncertu „Pochwała
          Stworzenia”, można pobrać bezpośrednio z zakładki Press.
  # The address is printed after these from `data/foundation.ts`.
  contact: { name: "Anna Marcisz", role: "wiceprezes VoctFoundation" }

announce:
  # ≤ 500 characters as copied: for listings and calendars.
  short: >-
    „Pochwała Stworzenia” to kolejny koncert z autorskiego cyklu Koncertów Duchowych VoctEnsemble,
    inspirowanego XVIII-wieczną tradycją francuskich Concerts Spirituels. Osią, a zarazem
    inspiracją dla koncertu, jest „Pieśń słoneczna” św. Franciszka z Asyżu. Muzyka różnych epok
    rozwija przesłanie kantyku, prowadząc od zachwytu nad stworzeniem przez doświadczenie ludzkiej
    kruchości i śmierci ku modlitwie i nadziei ostatecznej. 11 października, godz. 13:30, kościół
    Wszystkich Świętych w Warszawie. 12 głosów, skrzypce i organy. Wstęp wolny.
  # ≤ 1500 characters as copied: for a column's announcement. The last block is lines, not prose.
  long:
    - >-
      „Pochwała Stworzenia” — nowy Koncert Duchowy VoctEnsemble inspirowany „Pieśnią słoneczną”
      św. Franciszka z Asyżu
    - >-
      11 października o godz. 13:30 w kościele Wszystkich Świętych w Warszawie odbędzie się
      „Pochwała Stworzenia”, VI projekt autorskiego cyklu Koncertów Duchowych VoctEnsemble, będący
      finałem III edycji „Fenomenu Człowieka” Fundacji Hospicyjnej „Mój Dom”.
    - >-
      Inspiracją dla koncertu jest „Pieśń słoneczna” (Laudes creaturarum) św. Franciszka z Asyżu,
      w której całe stworzenie staje się drogą ku Stwórcy. Kantyk prowadzi od słońca, księżyca
      i gwiazd, przez wiatr, wodę, ogień i ziemię, aż po przebaczenie, cierpienie i „siostrę
      śmierć”. Program podejmuje tę drogę, prowadząc od zachwytu nad stworzeniem ku doświadczeniu
      człowieka, jego kruchości i przemijania, aż po modlitwę i ostateczną nadzieję.
    - >-
      W programie znalazły się m.in. Spiegel im Spiegel Arvo Pärta, ośmiogłosowe Laudes
      creaturarum Carla Orffa, Gloria II, Lumen i Dona eis requiem I Mariana Borkowskiego, a także
      utwory Jacka Sykulskiego, Jules’a Masseneta, Ēriksa Ešenvaldsa, Ralpha Vaughana Williamsa,
      George’a Enescu i Rihardsa Dubry. Zestawienie muzyki różnych epok i estetyk pozwala ukazać
      kolejne aspekty franciszkańskiej wizji stworzenia, od kontemplacji świata po doświadczenie
      przemijania i modlitwę.
    - >-
      VoctEnsemble wystąpi w dwunastoosobowym składzie pod dyrekcją Florent de Bazelaire,
      z udziałem rumuńskiego skrzypka Radu Ropotana i organisty Sebastiana Kuczyńskiego.
    - "Wstęp wolny."
    - |-
      Pochwała Stworzenia
      niedziela, 11.10.2026 — 13:30
      Kościół Wszystkich Świętych
      Warszawa · pl. Grzybowski 3/5
      Finał III edycji Fenomenu Człowieka
      wstęp wolny
  # The same two measures in English, for foreign media and for patrons who ask for both.
  en:
    short: >-
      In Praise of Creation is the latest concert in VoctEnsemble’s original Spiritual Concerts
      series, inspired by the tradition of the 18th-century French Concerts Spirituels. At its
      heart is St Francis of Assisi’s Canticle of the Sun, which provides both the inspiration and
      the central thread of the concert. Music from different periods unfolds the canticle’s
      message, leading from wonder at creation through the experience of human fragility and death
      towards prayer and ultimate hope. 11 October, 1.30 pm, Church of All Saints, Warsaw. Twelve
      voices, violin and organ. Admission free.
    long:
      - >-
        “In Praise of Creation” — a new Spiritual Concert by VoctEnsemble, inspired by St Francis
        of Assisi’s Canticle of the Sun
      - >-
        On 11 October at 1.30 pm, the Church of All Saints in Warsaw will host In Praise of
        Creation, the sixth project in VoctEnsemble’s original Spiritual Concerts series, marking
        the finale of the third edition of the Fenomen Człowieka festival organised by the Mój Dom
        Hospice Foundation.
      - >-
        The concert is inspired by St Francis of Assisi’s Canticle of the Sun (Laudes
        creaturarum), in which all of creation becomes a path towards the Creator. The canticle
        moves from the sun, moon and stars, through wind, water, fire and earth, to forgiveness,
        suffering and “Sister Death”. The programme follows this journey, moving from wonder at
        creation towards the human experience of fragility and transience, and ultimately towards
        prayer and hope.
      - >-
        The programme includes, among other works, Arvo Pärt’s Spiegel im Spiegel, Carl Orff’s
        eight-part Laudes creaturarum, and Marian Borkowski’s Gloria II, Lumen and Dona eis
        requiem I, alongside works by Jacek Sykulski, Jules Massenet, Ēriks Ešenvalds, Ralph
        Vaughan Williams, George Enescu and Rihards Dubra. Bringing together music from different
        periods and aesthetic traditions, the programme explores different aspects of the
        Franciscan vision of creation, from contemplation of the world to an awareness of
        transience and prayer.
      - >-
        VoctEnsemble will perform with twelve singers under the direction of Florent de Bazelaire,
        joined by Romanian violinist Radu Ropotan and organist Sebastian Kuczyński. Admission is
        free.
      - |-
        In Praise of Creation
        Sunday, 11 October 2026 — 1.30 pm
        Church of All Saints
        Warsaw · pl. Grzybowski 3/5
        Final event of the third edition of Fenomen Człowieka
        Free admission

