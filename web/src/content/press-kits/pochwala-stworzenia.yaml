# The press kit for Pochwała Stworzenia in Poznań (15.11.2026, Chóralne Koncerty Kameralne Grand
# Prix Polskiej Chóralistyki): the board's documents /press offers, the texts it offers to copy,
# and the lines it prints about them. Schema and every string built from it: `src/lib/pressKit.ts`.
#
# A PROGRAMME SUNG AGAIN. The concert row in `concerts.yaml` stays the record of the Warsaw evening
# (11.10.2026); Poznań is its second performance in `dates`, and while it is ahead `lib/cycle`
# hands this kit the row with the Poznań facts laid over it. So the facts this kit's card prints
# (day, hour, venue, address, series, door, poster) are Poznań's, and the loader holds every dated
# text below to 15 listopada and 19:00. The Warsaw kit is in git history; its served files sit in
# `press-pack/inbox/2026-10-11-warszawa-wydane/`.
#
# ONLY COPY LIVES HERE. Title, day, hour, venue, address, series, door, composers and the conductor
# are printed from `concerts.yaml`. The prose below has to name the day and the hour anyway — an
# announcement is pasted whole into somebody's listing — so the loader checks that every dated text
# still names the corpus's; move the concert and the build fails until this file follows.
#
# THE RELEASES, THE ANNOUNCEMENTS AND THE BIOGRAMS ARE THE BOARD'S (Ania, 26–27.10.2026), served
# under the names they were sent with, corrected (29.10.2026): two files swapped under each other's
# names, two PDFs sent without an extension, and fourteen wording fixes, all listed in
# `press-pack/inbox/2026-10-29/CORRECTIONS.txt` beside the untouched originals. The four Word files
# in `press-pack/kits/pochwala-stworzenia/` carry those fixes and their PDFs are set again from them
# by `tools/press-docs/board_docs.py` (Word's own export hangs on this machine). The biogram PDF is
# the board's as sent.
#
# `release` AND `announce` ARE THOSE DOCUMENTS TRANSCRIBED, WORD FOR WORD (`pandoc -t plain` of the
# corrected DOCX, 29.10.2026), for the page's Kopiuj: a text copied out of a PDF breaks at every
# line, and an editor pastes into a form. Nothing in the build reads a PDF or a DOCX, so whoever
# replaces one compares its text with its twin and with its block here and makes the three agree.
# They agree but for the layout, which Kopiuj does not carry: the composers' line under the
# release's title, the practical block (printed from the corpus by `releaseText`), the empty
# "Patroni medialni:" heading the board kept, separators and the closing metadata. The ~500
# announcement's three short paragraphs are one here, as a listing takes it. The English release
# has no transcription, so its row downloads and previews without Kopiuj.
#
# The measures in the announcements' names (~500, ~1500) are the board's approximate values, not
# counts: the practical lines closing the long one do not count towards it (28.09.2026).
#
# WHAT A TEXT HERE MUST NEVER SAY — check any later edit against it, and the board's files too:
#   · the encore is never named: it is the ensemble's to give, and a press text that lists it has
#     promised it;
#   · nothing about how often the Pärt returns or where: the conductor's numbering has moved twice,
#     and a printed listing cannot follow a third move;
#   · no Polish Canticle but our own glosses: Leopold Staff's translation is protected to the end of
#     2027.
# The Warsaw kit also barred the human as a brother of the creatures; the developer lifted that for
# this kit (29.10.2026), and the board's HEAD paragraph below keeps its sentence about it.
#
# NO PROGRAMME ON /press. The board sent one (in the inbox); it lists the Pärt's returns and an
# encore, and the concert page is where the running order is kept true.

concert: pochwala-stworzenia
forces: "12 głosów · skrzypce · organy"

# The concert card's paragraph on /press, and the paragraph its Kopiuj carries: the board's "HEAD"
# paragraph from the master pack, with our sentence on the second performance after its first. Its
# fact lines are not carried — the card prints them from the corpus.
lede: >-
  „Pochwała Stworzenia” to kolejna odsłona autorskiego cyklu Koncertów Duchowych VoctEnsemble,
  inspirowanego XVIII-wieczną francuską tradycją Concerts Spirituels. Po październikowej premierze
  w Warszawie koncert zabrzmi po raz drugi, tym razem w Poznaniu, w kościele franciszkanów. Osią
  programu jest Pieśń słoneczna św. Franciszka z Asyżu – kantyk, w którym cały świat, od żywiołów
  po człowieka, zostaje włączony w jedną pochwałę Stwórcy. Franciszek zwraca się do stworzenia jak do rodzeństwa,
  ukazując człowieka nie jako kogoś stojącego ponad światem, lecz jako jego część. Pochwała obejmuje
  zarówno piękno i życiodajność stworzenia, jak i ludzkie doświadczenie przebaczenia, cierpienia
  i śmierci. Muzyka różnych epok podejmuje tę franciszkańską wizję, w której zachwyt nad światem
  i doświadczenie ludzkiego losu pozostają nierozdzielne od relacji ze Stwórcą.

# The board's files, in the order the page lists them. `sub` is the row's second line (the
# concert's title where absent); `text` names the transcription below that the row's Kopiuj writes.
