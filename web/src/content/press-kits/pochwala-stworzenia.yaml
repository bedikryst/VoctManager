    docx: "[Press-PL]_InformacjaPrasowa_PochwalaStworzenia_VoctEnsemble_2026.10.docx"
    title: "Informacja prasowa PL"
    text: release
  - file: "[Press-EN]_PressRelease_PochwalaStworzenia_VoctEnsemble_2026.10.pdf"
    docx: "[Press-EN]_PressRelease_PochwalaStworzenia_VoctEnsemble_2026.10.docx"
    title: "Informacja prasowa EN"
    sub: "In Praise of Creation"
  - file: "[500zzs-PL_EN]_Zapowiedz _PochwalaStworzenia_VoctEnsemble_2026.10.pdf"
    docx: "[500zzs-PL_EN]_Zapowiedz _PochwalaStworzenia_VoctEnsemble_2026.10.docx"
    title: "Zapowiedź PL/EN ~500 znaków"
    text: announceShort
  - file: "[1500zzs-PL_EN]_Zapowiedz _PochwalaStworzenia_VoctEnsemble_2026.10.pdf"
    docx: "[1500zzs-PL_EN]_Zapowiedz _PochwalaStworzenia_VoctEnsemble_2026.10.docx"
    title: "Zapowiedź PL/EN ~1500 znaków"
    text: announceLong
  - file: "[Biogramy-PL_EN]_Pochwala_Stworzenia_VoctEnsemble_2026.10.27.pdf"
    title: "Biogramy PL/EN"
    # The people the PDF holds, in its order.
    sub: "VoctEnsemble · Florent de Bazelaire · Jakub Kapała · Radu Ropotan"

# The poster rows' second line after the concert's title: the design's credit in the form the
# board set for /press, and the print file's sheet. The concert page credits the same design from
# `concerts.yaml` (the Poznań performance's `posterCredit`), in the site's own form.
#
# ONE SHEET, SHOWN AND DOWNLOADED. The board re-issued the poster as A3 with the corrected address
# line (29.10.2026). The site's sheet is `poster-stworzenie-poznan` in `src/assets/photos/` (its
# original in `.original-photos/`, the board's JPG as sent); `plakat.jpg` is rendered from it, and
# `press-pack/posters/pochwala-stworzenia.pdf` is the board's print file, 309 × 432 mm.
poster:
  credit: "VoctEnsemble / Anna Marcisz"
  printSheet: "A3, spady 6 mm"

frame:
  organizer: "Fundacja Grand Prix Polskiej Chóralistyki im. Stefana Stuligrosza"
  coOrganizers: "Fundacja VoctFoundation i VoctEnsemble"
  within: "Chóralnych Koncertów Kameralnych Grand Prix Polskiej Chóralistyki"
  funding: "Koncert współfinansowany ze środków Miasta Poznania."

release:
  title: "Pochwała Stworzenia"
  subtitle: >-
    Koncert Duchowy VoctEnsemble inspirowany kantykiem Laudes creaturarum św. Franciszka z Asyżu,
    znanym jako „Pieśń słoneczna”
  lead: >-
    15 listopada o godz. 19:00 VoctEnsemble wystąpi po raz pierwszy w Poznaniu. W kościele pw.
    św. Antoniego z Padwy na poznańskim Starym Mieście zabrzmi „Pochwała Stworzenia”, kolejna
    odsłona autorskiego cyklu Koncertów Duchowych VoctEnsemble, inspirowanego XVIII-wieczną
    francuską tradycją Concerts Spirituels.
  sections:
    # The second paragraph of the opening, then the conductor's words with their attribution on
    # its own line, as the board's release carries them.
    - body:
        - >-
          Program obejmuje muzykę od końca XIX wieku po twórczość najnowszą, ze szczególnym
          miejscem dla kompozycji Mariana Borkowskiego. Zabrzmi również Stoi lód na Prośnie Jacka
          Sykulskiego, kompozytora i dyrygenta od lat związanego z poznańskim środowiskiem
          chóralnym.
        - |-
          „To koncert o zachwycie nad światem stworzonym i o odkrywaniu w nim obecności Boga. Jest w nim również ludzkie doświadczenie kruchości, cierpienia i śmierci, ale także nadzieja życia wiecznego.”
          — Florent de Bazelaire, dyrygent i kierownik artystyczny VoctEnsemble
    - heading: "Jeden kantyk, cały koncert"
      body:
        - >-
          Laudes creaturarum jest pochwałą Boga poprzez stworzenie. Franciszek wysławia Stwórcę
          przywołując słońce, księżyc i żywioły, a następnie zwraca się ku ludzkiemu doświadczeniu
          cierpienia, przebaczenia i śmierci. Ta perspektywa wyznacza dramaturgię „Pochwały
          Stworzenia”: kolejne utwory rozwijają zawarte w kantyku motywy i prowadzą ku pytaniom
          o człowieka, jego kruchość i nadzieję.
        - >-
          Centralne miejsce zajmuje Laudes creaturarum Carla Orffa, ośmiogłosowe opracowanie
          XIII-wiecznego tekstu w oryginalnym języku włoskim epoki, określanym jako volgare.
          Pomiędzy kolejnymi częściami koncertu powraca Spiegel im Spiegel Arvo Pärta, tworząc
          muzyczną klamrę całego programu.
    - heading: "Polska muzyka w przebiegu koncertu"
      body:
        - >-
          Utwory polskich kompozytorów zostały rozmieszczone w różnych częściach programu, zgodnie
          z jego dramaturgią. Koncert otwierają Gloria II i Lumen Mariana Borkowskiego, których
          materiał słowny ogranicza się odpowiednio do jednego słowa: „Gloria” i „Lumen”. W tej
          części pojawia się Stoi lód na Prośnie Jacka Sykulskiego. Utwór konkretyzuje
          franciszkański motyw ziemi, która żywi człowieka — tutaj przestaje go żywić, gdy rzeka
          zamarza i unieruchamia młyn, od którego zależy byt lokalnej społeczności. Historia
          dziewczyny oczekującej pocieszenia staje się obrazem ludzkiej bezradności wobec sił natury
          i kruchości warunków, które pozwalają człowiekowi żyć. Niemal pod koniec koncertu powraca
          muzyka Borkowskiego w Dona eis requiem I, opartej na słowach „Pie Jesu, dona eis
          requiem” — prośbie o wieczny odpoczynek.
        - >-
          Program zamyka Stetit Angelus Rihardsa Dubry, którego tekst zaczerpnięty jest
          z Apokalipsy św. Jana: anioł stoi przy ołtarzu z kadzielnicą, a dym kadzideł wznosi się
          przed Bogiem wraz z modlitwami świętych.
    - heading: "Głos, skrzypce i organy"
      body:
        - >-
          Dwunastoosobowy VoctEnsemble wykona utwory o różnej obsadzie wokalnej — od pięciu do
          dwunastu partii. Partie wokalne uzupełnią skrzypce i organy, a całość poprowadzi Florent
          de Bazelaire.
        - >-
          Z VoctEnsemble wystąpią Radu Ropotan, rumuński skrzypek i absolwent Royal Academy of Music
          w Londynie, oraz Jakub Kapała, organista i laureat międzynarodowych konkursów, związany
          z krakowską bazyliką jezuitów.
    - heading: "W przededniu Grand Prix Polskiej Chóralistyki"
      body:
        - >-
          Na zaproszenie Fundacji Grand Prix Polskiej Chóralistyki im. Stefana Stuligrosza
          VoctEnsemble wystąpi w Poznaniu w ramach Chóralnych Koncertów Kameralnych, poprzedzających
          tegoroczną edycję Grand Prix.
        - >-
          Organizowane od 2018 roku Grand Prix skupia laureatów sześciu ogólnopolskich konkursów
          chóralnych. Towarzyszący mu całoroczny cykl koncertów kameralnych poszerza tę formułę
          o prezentację różnorodnych praktyk wykonawczych i autorskich koncepcji programowych.
        - >-
          „Pochwała Stworzenia” pokazuje, że spójność programu koncertowego nie musi wynikać ze
          stylistycznego pokrewieństwa utworów, lecz z relacji między nimi: następstwa, kontrastów
          i znaczeń ujawniających się w przebiegu całego koncertu. Kameralna obsada VoctEnsemble
          nadaje tej koncepcji dodatkowy wymiar. Indywidualność poszczególnych głosów pozostaje
          czytelna, a różnorodność faktur i języków kompozytorskich służy budowaniu jednej,
          konsekwentnej dramaturgii.
        - >-
          Koncert odbędzie się 15 listopada o godz. 19:00, po wieczornej liturgii w kościele
          św. Antoniego z Padwy przy ul. Franciszkańskiej 2 w Poznaniu. Wstęp wolny.
  # After the practical block and the links: who the ensemble and the foundation are.
  about:
    - heading: "O VoctEnsemble"
      body:
        - >-
          VoctEnsemble to niezależny profesjonalny zespół wokalny założony przez Florent
          de Bazelaire w Krakowie w 2024 roku. Tworzy autorskie Koncerty Duchowe, w których muzyka,
          tekst, przestrzeń i światło składają się na spójną całość. Każdy projekt wyrasta
          z konkretnej idei, pytania lub intencji, wokół których budowane są repertuar, jego
          dramaturgia i sposób wykonania. Zespół sięga po muzykę od renesansowej polifonii po
          twórczość najnowszą, ze szczególnym miejscem dla repertuaru sakralnego oraz muzyki
          podejmującej tematy duchowe i egzystencjalne. VoctEnsemble występował w Krakowie,
          Warszawie, Łodzi, Rybniku, Szczawnicy i Niedzicy, prezentując swoje projekty podczas
          koncertów i wydarzeń muzycznych w całej Polsce.
    - heading: "O VoctFoundation"
      body:
        - >-
          VoctFoundation, powołana w 2026 roku, wspiera realizację projektów artystycznych,
          łącząc ich twórców i wykonawców z partnerami instytucjonalnymi i publicznością.
          Rezydujący przy niej VoctEnsemble prezentuje „Pochwałę Stworzenia” po raz drugi. Tym
          razem projekt powstaje we współpracy z Fundacją Grand Prix Polskiej Chóralistyki
          im. Stefana Stuligrosza.
  # The address is printed after these from `data/foundation.ts`.
  contact: { name: "Anna Marcisz", role: "wiceprezes VoctFoundation" }

announce:
  # The ~500 measure (the board's approximate value): for listings and calendars.
  short: >-
    „Pochwała Stworzenia” to kolejny koncert z autorskiego cyklu Koncertów Duchowych VoctEnsemble,
    inspirowanego XVIII-wieczną tradycją francuskich Concerts Spirituels. Osią, a zarazem
    inspiracją dla koncertu, jest „Pieśń słoneczna” św. Franciszka z Asyżu. Muzyka różnych epok
    rozwija przesłanie kantyku, prowadząc od zachwytu nad stworzeniem przez doświadczenie ludzkiej
    kruchości i śmierci ku modlitwie i nadziei życia wiecznego. 12 głosów, skrzypce i organy. Wstęp
    wolny. 15 listopada, godz. 19:00, kościół św. Antoniego z Padwy (oo. franciszkanie) na Wzgórzu
    Przemysła, ul. Franciszkańska 2, Poznań.
  # The ~1500 measure, the closing practical lines not counted: for a column's announcement. The
  # last block is lines, not prose.
  long:
    - >-
      „Pochwała Stworzenia” — Koncert Duchowy VoctEnsemble inspirowany „Pieśnią słoneczną”
      św. Franciszka z Asyżu
    - >-
      W niedzielę 15 listopada 2026 r. o godz. 19:00 w kościele św. Antoniego z Padwy
      (oo. franciszkanie) przy ul. Franciszkańskiej 2 w Poznaniu VoctEnsemble zaprezentuje
      „Pochwałę Stworzenia”, szósty projekt autorskiego cyklu Koncertów Duchowych. Koncert odbędzie
      się w ramach Chóralnych Koncertów Kameralnych Grand Prix Polskiej Chóralistyki. Wstęp wolny.
    - >-
      Inspiracją dla koncertu jest „Pieśń słoneczna” (Laudes creaturarum) św. Franciszka z Asyżu,
      w której pochwała stworzenia staje się zarazem pochwałą Stwórcy. Kantyk obejmuje zarówno
      słońce, księżyc i żywioły, jak i ludzkie doświadczenie przebaczenia, cierpienia i „siostry
      śmierci”. Program rozwija te motywy, ukazując franciszkańską wizję stworzenia w perspektywie
      ludzkiej kruchości i przemijania, a ostatecznie — modlitwy i nadziei.
    - >-
      W programie znalazły się m.in. Spiegel im Spiegel Arvo Pärta, ośmiogłosowe Laudes
      creaturarum Carla Orffa, Gloria II, Lumen i Dona eis requiem I Mariana Borkowskiego, a także
      utwory Jacka Sykulskiego, Jules’a Masseneta, Ēriksa Ešenvaldsa, Ralpha Vaughana Williamsa,
      George’a Enescu i Rihardsa Dubry. Różnorodność języków muzycznych pozwala ukazać kolejne
      wymiary franciszkańskiej wizji stworzenia — od kontemplacji świata po refleksję nad
      przemijaniem i nadzieję chrześcijańską.
    - >-
      Koncert poprowadzi Florent de Bazelaire, a dwunastoosobowemu VoctEnsemble towarzyszyć będą
      rumuński skrzypek Radu Ropotan oraz krakowski organista Jakub Kapała. Wstęp wolny.
    - |-
      Pochwała Stworzenia
      niedziela, 15.11.2026 — 19:00
      Kościół św. Antoniego z Padwy (oo. franciszkanie)
      Poznań · ul. Franciszkańska 2
      Chóralne Koncerty Kameralne Grand Prix Polskiej Chóralistyki
      wstęp wolny
  # The same two measures in English: the second half of the same files.
  en:
    short: >-
      In Praise of Creation is another concert in VoctEnsemble’s original Spiritual Concerts series,
      inspired by the tradition of the 18th-century French Concerts Spirituels. At its heart is
      St Francis of Assisi’s Canticle of the Sun, which provides both the inspiration and the
      central thread of the concert. Music from different periods unfolds the canticle’s message,
      leading from wonder at creation through the experience of human fragility and death towards
      prayer and eschatological hope. Twelve voices, violin and organ. Admission free. 15 November,
      7 pm, St Anthony of Padua Franciscan Church on Przemysł Hill, 2 Franciszkańska Street, Poznań.
    long:
      - >-
        “In Praise of Creation” — a Spiritual Concert by VoctEnsemble, inspired by St Francis of
        Assisi’s Canticle of the Sun
      - >-
        On Sunday 15 November 2026 at 7 p.m., VoctEnsemble will present In Praise of Creation at the
        Franciscan Church of St Anthony of Padua in Poznań (2 Franciszkańska Street). The concert is
        the sixth project in the ensemble’s original Spiritual Concerts series and forms part of the
        chamber concert series organised by the Stefan Stuligrosz Grand Prix of Polish Choral Music
        Foundation. Admission is free.
      - >-
        The concert is inspired by St Francis of Assisi’s Canticle of the Sun (Laudes creaturarum),
        in which praise of creation becomes a means of praising the Creator. The canticle
        encompasses the sun, moon and elements, as well as the human experiences of forgiveness,
        suffering and “Sister Death”. The programme develops these themes, exploring the Franciscan
        vision of creation through human fragility and transience, ultimately leading towards
        Christian hope.
      - >-
        The programme includes, among other works, Arvo Pärt’s Spiegel im Spiegel, Carl Orff’s
        eight-part Laudes creaturarum, and Marian Borkowski’s Gloria II, Lumen and Dona eis
        requiem I, alongside works by Jacek Sykulski, Jules Massenet, Ēriks Ešenvalds, Ralph
        Vaughan Williams, George Enescu and Rihards Dubra. The diversity of musical languages
        reveals different dimensions of the Franciscan vision of creation, from contemplation of
        the world to reflection on transience and salvation.
      - >-
        VoctEnsemble will perform with twelve singers under the direction of Florent de Bazelaire,
        joined by Romanian violinist Radu Ropotan and organist Jakub Kapała. Admission is free.
      - |-
        In Praise of Creation
        Sunday, 15 November 2026 — 7 p.m.
        Franciscan Church of St Anthony of Padua
        Poznań · 2 Franciszkańska Street
        Choral Chamber Concerts · Grand Prix of Polish Choral Music
        Free admission

