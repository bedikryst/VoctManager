# The press photographs — the one hand-kept list `npm run press:pack` reads.
#
# WHAT THE SCRIPT DOES NOT ASK YOU. Everything else in the pack is GENERATED from the site's own
# data and is not listed here, because a second list is a second thing to keep true: the concert kit
# (texts, poster graphics, PDFs) from `src/content/press-kits/<concert>.yaml` and `concerts.yaml`,
# the biograms and usage terms from `src/content/pages/press.yaml`, the invoicing sheet from
# `src/data/foundation.ts`, and the logotype from `public/voct-mark.svg`.
#
# WHAT IT ASKS YOU IS THE PART NOBODY CAN DERIVE: which frames the ensemble released to the press,
# how each is cut, what it shows and whom to credit.
#
# THE ORIGINALS ARE NOT IN GIT. They sit in `press-pack/photos/` (gitignored, ~90 MB) on the machine
# that builds the pack, and the output (`public/press/`) is uploaded to the build host by hand.
#
# ONE FILE PER PHOTO, CUT TO EXACTLY ITS RATIO. `ratio` is "16:9" (sites, Facebook, YouTube) or "4:5"
# (Instagram, print). The crop is the largest box of that ratio inside the frame, centred as close to
# `focus` as the edges allow; `focus` is [x, y] as fractions of the upright frame, 0 = left/top, and
# it is set by looking at the crop, not by guessing. What the page shows is what a reader downloads.
#
# `credit` is required and is the name an editor prints under the photo. A frame from the ensemble's
# own archive is credited "VoctEnsemble" — who to credit, not where the frame came from — which
# deliberately differs from the site's own "archiwum zespołu" (lib/photoCredit).
#
# The script REFUSES on a row with no credit, a missing source file, or a source that is held in
# `src/assets/photos/.held-no-consent/`; it WARNS AND SKIPS a crop whose short edge is under 1080 px,
# so a thumbnail sent by mistake never ships as a press photo and the rest of the pack still builds.
#
# Captions are dated from each file's own EXIF and matched against `concerts.yaml`; a frame whose
# evening cannot be established says only what it shows.
#
# NOT ELIGIBLE, recorded so nobody re-adds them: `kd-hymn-4` and `kd-hymn-5` are Andrzej
# Płachetko's and are withheld from every surface until his consent is on record (concerts.yaml,
# Hymn Poległym) — and even then they were delivered with a matte border and a credit burnt into
# the frame, so they cannot be laid out by a designer; `kd-wolanie-4` is 900 px wide and sourced
# from PieninyInfo.

