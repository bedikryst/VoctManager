page.fundacja.costs.eyebrow: "What the money goes to"
page.fundacja.costs.h2: "What a concert is made of"
page.fundacja.costs.intro: "The audience hears the finished programme. Support goes to what cannot be heard: the preparation, and the people who carry it out."
page.fundacja.costs.body: "Before we meet at a concert, a programme has to be shaped, scores obtained, and the whole worked through in rehearsal. Then come the journeys and — where the space calls for it — sound and lighting. Support helps cover that work, above all the singers' fees."
page.fundacja.costs.itemsLabel: "What the cost is made of"
page.fundacja.costs.items.honoraria.term: "Singers' fees"
page.fundacja.costs.items.honoraria.what: "The largest cost of every concert. The ensemble is made of professional singers — the rehearsals and the evening are their work."
page.fundacja.costs.items.partytury.term: "Scores and programme"
page.fundacja.costs.items.partytury.what: "Buying the music, shaping the programme, preparing the singers' materials."
page.fundacja.costs.items.proby.term: "Rehearsals"
page.fundacja.costs.items.proby.what: "A room and a run of rehearsals in which the programme takes shape before an audience hears it."
page.fundacja.costs.items.dojazdy.term: "Travel"
page.fundacja.costs.items.dojazdy.what: "The ensemble's journeys to rehearsals and to concerts outside Kraków."
page.fundacja.costs.items.realizacja.term: "Sound and light"
page.fundacja.costs.items.realizacja.what: "Where the space and the programme call for it. Not every concert needs it."
page.fundacja.costs.current.labelAhead: "What we are preparing now"
page.fundacja.costs.current.labelPast: "The last programme we prepared"
page.fundacja.costs.current.programLink: "See the programme →"
page.fundacja.costs.current.note: "An example of the ensemble's current work, not a separate appeal. Donations support the foundation's statutory activity, including this concert and the ones to come."

page.fundacja.record.eyebrow: "The record"
page.fundacja.record.h2: "Music that has already sounded"
page.fundacja.record.intro: "Each of these programmes was built from the ground up: the repertoire, the shape of the evening, and the space it was to sound in. This is VoctEnsemble's record — and the measure of what support goes to."
page.fundacja.record.allLink: "See the other concerts →"

page.fundacja.support.eyebrow: "Support"
page.fundacja.support.h2: "Help prepare the next concerts"
page.fundacja.support.intro: "Two plain ways. The regular one first, because it is the one that lets us plan."
page.fundacja.support.monthly.label: "Give monthly"
page.fundacja.support.monthly.body: "Regular support lets us plan rehearsals and the next programmes ahead of time. You set up a standing order in your own bank; that is also where you change the amount or cancel it — without contacting us."
page.fundacja.support.monthly.amounts: "For example {amounts} PLN a month. These are examples, not thresholds — any amount is welcome."
page.fundacja.support.monthly.transferLink: "Bank details"
page.fundacja.support.once.label: "Give once"
page.fundacja.support.once.body: "Pay online through the payment gateway, or make an ordinary bank transfer to the foundation's account."
page.fundacja.support.once.vaultAction: "Pay online"
page.fundacja.support.once.transferLink: "I'd rather transfer"

page.fundacja.transfer.h3: "Bank details"
page.fundacja.transfer.recipientLabel: "Recipient"
page.fundacja.transfer.accountLabel: "Account number"
page.fundacja.transfer.eurLabel: "Euro account"
page.fundacja.transfer.eurNote: "For transfers from outside Poland."
page.fundacja.transfer.titleLabel: "Transfer title"
page.fundacja.transfer.standingOrderHint: "Standing order: the same details, in your bank, at the frequency you choose."
page.fundacja.transfer.scope: "Donations support the statutory activity of the VoctFoundation, including the preparation of VoctEnsemble's concerts."

page.fundacja.join.h3: "Let us know you are joining"
page.fundacja.join.body: "If you are setting up a standing order, leave us a way to reach you — we will thank you personally and tell you what your support has made possible. The form is optional: it moves no money and starts no standing order."
page.fundacja.join.consentHtml: "I consent to the processing of my data (first name, last name, e-mail) for the purpose of contact regarding patronage, in accordance with the <a href=\"/polityka-prywatnosci\">Privacy Policy</a>."
page.fundacja.join.successTitle: "Thank you."
page.fundacja.join.successBody: "We have passed your note to the foundation. If you would like to support us regularly, set up a standing order in your bank."
page.fundacja.join.contactLead: "Questions about support:"

page.fundacja.partnership.eyebrow: "Partnership"
page.fundacja.partnership.h2: "Make a concert with us"
page.fundacja.partnership.intro: "A company, an institution, a parish, a festival — there are three things we can talk about."
page.fundacja.partnership.rows.produkcja.term: "Supporting one production"
page.fundacja.partnership.rows.produkcja.what: "A share in the costs of an agreed concert, or of one named line — the singers' fees, say, or the scores."
page.fundacja.partnership.rows.ciaglosc.term: "Supporting continuity"
page.fundacja.partnership.rows.ciaglosc.what: "Cooperation over a defined period around the ensemble's concert work — a season, or a run of programmes."
page.fundacja.partnership.rows.zasoby.term: "Resources instead of money"
page.fundacja.partnership.rows.zasoby.what: "A space for rehearsals or a concert, transport, printing, production — where it answers a real need. These are possibilities to discuss, not a list of shortages."
page.fundacja.partnership.next: "Write and tell us which project or kind of cooperation interests you. We will agree the scope of the support, how we thank you, and how we report on what was done."
page.fundacja.partnership.thanks: "The thanks are agreed together: a mention or a logo in the programme and on the concert's page — where the venue and the organiser allow it."
page.fundacja.partnership.mailLabel: "Write about a partnership"
page.fundacja.partnership.mailSubject: "Partnership with the VoctFoundation"
