# page.fundacja — EN draft. Same flat shape as the overlay it will become.
# Keys carry the `page.` namespace; `Html` fields are written exactly as the reader receives them.
# Internal hrefs stay Polish (`/polityka-prywatnosci`); `lib/pageCopy` localizes them at render.
# `{slots}` are filled by the page (amounts, dates, counts) — keep every one of them.
# Links carry no arrow: the page draws it. Supporters' reasons carry no quotation marks.
# Not the overlay: `make copy-draft` carries these in as proposals; `make copy-apply` writes them.

page.fundacja.meta.title: "The VoctFoundation | VoctEnsemble"
page.fundacja.meta.description: "The VoctFoundation is a cultural foundation in Kraków and the base for VoctEnsemble's artistic projects. Its productions, people and documents, and the ways to support it: donation, patronage, partnership."

