page.fundacja.who.eyebrow: "The foundation and its documents"
page.fundacja.who.h2: "Who stands behind it"
page.fundacja.who.relation: "VoctEnsemble is the resident ensemble of the VoctFoundation: the ensemble sings, the foundation organises, keeps the accounts and is responsible for your data. Donations are received by the foundation."
page.fundacja.who.boardLabel: "The foundation's board"
page.fundacja.who.boardNote: "We answer together. Send questions about support to the patronage address — all three of us read it."
page.fundacja.who.identityLabel: "The foundation's details"
page.fundacja.who.documentsLabel: "Documents"
page.fundacja.who.statuteLink: "The foundation's statute (PDF)"
page.fundacja.who.privacyLink: "Privacy policy"
page.fundacja.who.termsLink: "Donation terms — when paying online"
page.fundacja.who.help.label: "In short"
page.fundacja.who.help.items.zlecenie.q: "Can I change or cancel a standing order?"
page.fundacja.who.help.items.zlecenie.a: "Yes, at any time — in your own bank, without contacting us."
page.fundacja.who.help.items.formularz.q: "Do I have to fill in the form to donate?"
page.fundacja.who.help.items.formularz.a: "No. The form is optional; the account details are all a transfer needs."
page.fundacja.who.help.items.kontakt.q: "Who do I write to about support?"
page.fundacja.who.help.items.kontakt.a: "The patronage address below — the foundation's board reads it."
page.fundacja.who.help.items.dokumenty.q: "Where are the foundation's documents?"
page.fundacja.who.help.items.dokumenty.a: "The statute, the privacy policy and the donation terms are beside this. The register entry can be checked under the KRS number above."
