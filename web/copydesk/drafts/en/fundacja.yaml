page.fundacja.support.h2: "Our projects happen thanks to donors, patrons and partners."
page.fundacja.support.donation.label: "Donation"
page.fundacja.support.donation.quote: "I want you to be able to keep doing what you do."
page.fundacja.support.donation.body: "Once or every month, in any amount. You set up a standing order in your own bank, and change or cancel it there as well."
page.fundacja.support.donation.scale: "One concert's budget is what {people} people would give over a year at PLN {monthly} a month."
page.fundacja.support.donation.promise: "After every concert we publish what it cost and where the funding came from."
page.fundacja.support.donation.vaultAction: "Give online"
page.fundacja.support.donation.transferLink: "Bank details"
page.fundacja.support.mecenat.label: "Patronage"
page.fundacja.support.mecenat.quote: "I want to be there when particular things come into being."
page.fundacja.support.mecenat.body: "A patron supports a specific project from the start: a whole concert or a part of one. Patronage can stay private or become part of the project's story. The first step is a conversation with Anna Marcisz."
page.fundacja.support.mecenat.link: "Patronage"
page.fundacja.support.partnership.label: "Partnership"
page.fundacja.support.partnership.quote: "We want to support a particular project with what we have."
page.fundacja.support.partnership.body: "Companies and institutions support us with a donation or with what a project needs: rehearsal space, transport, printing, sound production. We co-organise concerts with festivals, parishes and cultural institutions. The scope is agreed in conversation."
