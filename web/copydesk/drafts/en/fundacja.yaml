page.fundacja.hero.lead: "The VoctFoundation is a cultural foundation in Kraków, established in 2026. Its resident ensemble is VoctEnsemble. The foundation brings artists, skills and funding together around a specific artistic idea, and the idea sets the project's form, its line-up and the way it is made."
