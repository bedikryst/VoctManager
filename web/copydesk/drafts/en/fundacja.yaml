page.fundacja.record.h2: "The VoctFoundation grows out of VoctEnsemble's experience."
page.fundacja.record.bodyHtml: "Since January 2024 VoctEnsemble has been preparing its own Spiritual Concerts, which take up the French tradition of the <em>Concerts Spirituels</em>. Each programme is built from the beginning, for a specific place, together with artists, production professionals and institutions. The foundation, established in April 2026, gives this work a permanent base: it makes it possible to invite more artists and to build more complex productions."
