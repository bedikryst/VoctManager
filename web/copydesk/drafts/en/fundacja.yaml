page.fundacja.meta.title: "Foundation and support — VoctEnsemble | VoctFoundation"
page.fundacja.meta.description: "The VoctFoundation is the organisational and financial backbone of VoctEnsemble. See what a concert is made of, and help prepare the next programmes of the Concerts Spirituels cycle — monthly, once, or as a company or institution."

page.fundacja.hero.eyebrow: "The VoctFoundation"
page.fundacja.hero.title1: "So the music"
page.fundacja.hero.title2Html: "can <em>go on.</em>"
page.fundacja.hero.lede: "The VoctFoundation is the organisational and financial backbone of VoctEnsemble. We help prepare the next concerts of the Concerts Spirituels cycle — from the work on a programme and its rehearsals to the evening with an audience."
