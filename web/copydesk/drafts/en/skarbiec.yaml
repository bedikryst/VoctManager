page.skarbiec.qr.tag: "no commission"
page.skarbiec.qr.title: "Transfer from your banking app"
page.skarbiec.qr.note: "Scan the code with the camera in your banking app — every field fills itself in."
page.skarbiec.qr.hintHtml: "Open your bank's app, choose <strong>“QR transfer”</strong> and scan. You enter the amount in the app."
page.skarbiec.qr.recurringLabel: "Monthly support · standing order"
page.skarbiec.qr.recurringNoteHtml: "Would you like to support the cycle regularly? Copy the details above and set them up in your banking app as a <strong>standing order</strong> (under “standing orders” / “recurring payments”) — say 25, 50 or 100&nbsp;zł a month. The QR code above makes a one-off transfer; a recurring order is entered by hand. It stays entirely under your control — you can change or cancel it at any time in your banking, without contacting us. No commission, and no card details to hand over."

page.skarbiec.mecenat.tag: "regular support · a relationship"
page.skarbiec.mecenat.title: "Become a patron of the cycle"
page.skarbiec.mecenat.note: "Patronage is more than a single donation — it is a lasting relationship with the ensemble and its music. Your regular support lets us plan ahead: rehearsals, recordings and the next instalments of the Spiritual Concerts cycle. In return we invite you closer to what we do."
page.skarbiec.mecenat.benefitsLabel: "What we offer our patrons"
page.skarbiec.mecenat.benefit1: "A personal thank-you and direct contact with the Foundation's founder."
page.skarbiec.mecenat.benefit2: "Your name among the patrons of the cycle, if you agree to it."
page.skarbiec.mecenat.benefit3: "First call on invitations to future concerts and events."
page.skarbiec.mecenat.benefit4: "A yearly summary of your donations — useful when you file your tax return."
page.skarbiec.mecenat.howLabel: "How it works"
page.skarbiec.mecenat.howHtml: "Patronage rests on a <strong>standing order</strong> — a monthly transfer you set up and control entirely from your own banking (say 50, 100 or 200&nbsp;zł a month). You can change or cancel it at any time, without contacting us. No commission, and no card details to hand over."
page.skarbiec.mecenat.talkLabel: "Would you rather talk first?"
page.skarbiec.mecenat.talkNote: "Write to us — we will answer personally and help you find the form of support that suits you."
page.skarbiec.mecenat.joinLabel: "Let us know you are joining"
