# page.skarbiec — EN draft (stage I). Same flat shape as the overlay it will become.
#
# THE VAULT IS READ ON EVERY PAGE OF THE SITE, not on a page of its own — the "Support us" button
# in the nav opens it in place. Which is why it was the largest live gap left after stage G: the
# chrome has said "Support us" since stage F and the sheet behind it answered in Polish.
#
# WHAT IS NOT HERE, because it is not copy: every affordance, form label and validation message is
# a typed triple in `i18n/content/skarbiecChrome.ts`; the account number, the foundation's register
# and the transfer title are constants (the transfer title stays POLISH in every locale — it is
# what the foundation's bank statement has to carry); Zrzutka.pl, Axepta BNP Paribas, BLIK, Apple
# and Google Pay and the six banks under the QR are brands.
#
# THE CYCLE'S NAME, AND ONE THING TO PUT TO FLORENT. This page's Polish calls the cycle
# "Concerts Spirituels" — the FRENCH name — where /koncerty calls it "Koncerty Duchowe". The
# English follows the name the site publishes in English, "the Spiritual Concerts cycle"
# (`i18n/content/koncert.ts`), rather than reproducing the Polish page's choice. The divergence is
# in the SOURCE language, so it is an editorial question for the editor and not a translation
# defect (spec §6aa found the same shape in /o-nas's `Via`).
#
# THE QR CARD IS FOR A POLISH ACCOUNT, and its banks are named on the card itself. The Polish 2D
# (KIR) code it prints is only read by Polish banking apps, so "QR transfer" keeps close to the
# label those apps use rather than being renamed for a bank that cannot scan it at all.
#
# ONE FRAGMENT IS HALF A SENTENCE, by design — the other half is a link the desk cannot hold:
# `online.consentLead` ends in "the" because the document's own title follows it as a button.
# `qr.recurringNoteHtml` holds no link and asks no question: the sheet's closing line, chrome
# outside the desk, is the one road to /fundacja#mecenat and it asks the question itself.
#
# Not the overlay: `npm run copy:propose --locale en` carries these in as proposals, which is the
# only door that stamps the provenance hash the stale state is computed from.

