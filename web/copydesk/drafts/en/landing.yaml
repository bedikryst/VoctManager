# page.landing — EN draft (stage K, pass 2). Same flat shape as the overlay it will become.
#
# WHAT PASS 2 CHANGED, and why it could not be seen from inside the sentence that wrote it (§2):
# eight values, six of them found by reading these 89 beside the REST of the site rather than
# beside the Polish. The landing was the last page translated, so every term it shares with
# /o-nas, /skarbiec, /koncerty or a concert page already had a published English word, and where
# the two differed the site was saying one Polish thing twice. Two quoted sentences /o-nas prints
# verbatim, the vault's transfer label, the concert page's programme label, the Mariacki
# altarpiece, the Canticle of Simeon — plus two the Polish itself named: an evening is performed
# rather than sung (a violin plays in one of them), and "stałe miejsce" is not "swoje miejsce".
# The reasons sit above the keys they belong to.
#
# 89 FIELDS, AND WHAT IS DELIBERATELY NOT AMONG THEM:
#   - the five evenings' TITLES. The register and the Imagines band read them from
#     `concerts.en.yaml` through the copy overlay, so this page holds no second name for a night;
#   - the threshold's two BUTTONS ("Enter with voice" / "Enter in silence"). They are chrome, a
#     complete triple in `i18n/content/landing.ts`, because § 3 and § 10 of the privacy policy
#     quote them by name in all three languages — two documents on one site may not call one
#     button two things, and a locale falling back to Polish here would leave a legal text citing
#     a control that does not exist;
#   - the Latin tier (Lumen Christi, Vox memoriae, Sustinete nos, Imagines, Vox, Repertorium,
#     Introitus, De nobis, Via, Scribe nobis, tacet.) and `Concerts Spirituels`, the French name of
#     the historical form, which stays itself on every page of this site.
#
# THE RENDERINGS THE SITE HAS ALREADY PUBLISHED, followed rather than invented:
#   Koncert Duchowy / cykl      → Spiritual Concert / the Spiritual Concerts cycle
#   anachoreci · tęsknota       → anchorites · longing        (page.o-nas.letter.stanzas.I, hero)
#   W ciszy rodzi się muzyka.   → "In silence, music is born."  (word-identical Polish on both
#   Tak powstał Voct              pages → word-identical English; /o-nas stanza II)
#                               → "So Voct came to be"
#   „zostaje w duszy niczym     → "stays in the soul like a living organism" — NOT /o-nas's
#    żywy organizm"                "finding a place in the soul", because the landing's Polish
#                                 condensed "znajdując miejsce" to "zostaje"
#   „słowo i muzyka są swoimi   → "word and music are each other's mirror image"
#    lustrzanymi odbiciami"        (page.o-nas.cantus.lead)
#   Bazylika NSPJ · Mariacka    → Sacred Heart Basilica · St Mary's Basilica
#   Archikatedra w Łodzi        → Łódź Cathedral               (page.kontakt.hero.lede)
#   Zapowiedź · zawierzenie     → Prophecy · commendation      (glossary §2)
#   Tytuł przelewu · Odbiorca   → Transfer title · Recipient   (skarbiecChrome.ts, the vault this
#                                 section links to — same two labels, same account number)
#   Program koncertu            → The concert programme        (koncert.ts, the same programme)
#   ołtarz Mariacki             → the altarpiece of St Mary's Basilica (concert.hymn-poleglym)
#   VII wieków repertuaru       → seven centuries              (page.koncerty.repertoire.eyebrow)
#   Fundacja Carpe Diem         → the Carpe Diem Foundation    (page.o-nas.ensemble.collabText)
#
# ONE FRAME HELD ACROSS THREE SECTIONS, and it is the page's spine rather than a stylistic
# preference: the hero's "Z ciszy / głos.", the Vox moment's "Z tej ciszy — głos." and the
# Imagines band's "Z tego głosu — pamięć." are one figure said three times, each handing the last
# word to the next. English keeps the frame — "Out of silence / a voice." → "Out of that
# silence — a voice." → "Out of that voice — memory." — because a rendering that varies the
# preposition turns a reprise into three unrelated lines.
#
# THE TRANSFER LINES KEEP THEIR POLISH, and only their LABELS are rendered. "Fundacja
# VoctFoundation" is the foundation's registered name and "Darowizna na cele statutowe
# VoctFoundation" is the reference a donor copies into a Polish bank's form — translating either
# would hand a reader words to type that the receiving bank does not expect. It is the same rule
# the footer's postal address already keeps: an address is written the way it must be written on
# an envelope.
#
# `zł` STAYS `zł` IN EVERY LOCALE. The site already publishes "50, 100 or 200 zł" in English
# (page.skarbiec.mecenat.howHtml); what does change is the thousands separator, which English
# writes with a comma.
#
# TWO EDITORIAL FINDINGS, NAMED RATHER THAN HARMONISED — both are questions for the desk, in the
# SOURCE language, and neither is a translation defect:
#   1. `ensemble.title1` + `title2` ("Zaczęło się / od tęsknoty.") is the SAME Polish sentence
#      /o-nas prints as its own hero title. One line, two files: an edit to either leaves the
#      site saying it two ways. The English here follows /o-nas's published rendering so that the
#      two agree today.
#   2. `register.title` ("Co już zabrzmiało.") is the fourth Polish wording of one section:
#      /koncerty calls it "Droga koncertów", /o-nas "Co już wybrzmiało", the landing's own chrome
#      calls it "Z drogi". §6aa filed the same finding for the rubric `Via`; this is it again with
#      one more variant. The English follows THIS Polish rather than /o-nas's, which is why the
#      two read "What has already sounded." and "What has sounded".
#
# Not the overlay: `npm run copy:propose --locale en` carries these in as proposals, which is the
# only door that stamps the provenance hash the stale state is computed from.

