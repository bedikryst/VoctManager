page.landing.ensemble.title2: "with longing."
# The closing clause is another sentence /o-nas prints unchanged ("Tak powstał Voct"), so it takes
# that page's published words. Only the middle differs on purpose: the landing's Polish condenses
# "znajdując miejsce w duszy" to "zostaje", and stays/finds a place are two verbs, not one.
page.landing.ensemble.origin: "Like anchorites — in seclusion, far from the clamour — we came to long for music that enfolds a person, reaches into them and stays in the soul like a living organism. So Voct came to be: out of silence and contemplation."
page.landing.ensemble.p2: "There are more than forty of us today; twelve voices usually go on stage. We adore heterophony, polytonality and polyphony — we weave our programmes out of works in which word and music are each other's mirror image."
