page.landing.register.entries.wcielenie.tag: "Spiritual Concert · debut"
page.landing.register.entries.wcielenie.place: "Sacred Heart Basilica in Kraków"
page.landing.register.entries.wcielenie.note: "An entrance into the mystery of the Incarnation, from Isaiah's prophecy to the Canticle of Simeon. Renaissance polyphony, Pärt, Vivancos."
page.landing.register.entries.wcielenie.credit: "Recording: Jakub Garbacz, Ars Sonora Studio. Reprise under the auspices of the Carpe Diem Foundation."

page.landing.register.entries.wolanie-gor.tag: "12 voices and violin"
page.landing.register.entries.wolanie-gor.place: "Dworek Gościnny · Szczawnica"
page.landing.register.entries.wolanie-gor.note: "A programme for which the mountains were the breath. Sacred polyphony and folk songs from Poland, Corsica, France and the British Isles, with Radu Ropotan's violin."
page.landing.register.entries.wolanie-gor.videoNote: "J. Sykulski — Stoi lód na Prośnie · recorded from the audience · live sound"

page.landing.register.entries.9-kart.tag: "A cycle of psalms · 6–12 voices"
page.landing.register.entries.9-kart.place: "St Anthony's Basilica in Rybnik · Łódź Cathedral · Sacred Heart Basilica in Kraków"
page.landing.register.entries.9-kart.note: "Nine psalms: penitence, lament, praise. Allegri's Miserere, divided into nine parts, is woven through the whole evening."

page.landing.register.entries.hymn-poleglym.tag: "A prayer for peace"
page.landing.register.entries.hymn-poleglym.place: "St Mary's Basilica in Kraków"
# "ołtarz Mariacki" is the concert page's "the altarpiece of St Mary's Basilica"; "Mariacki" is a
# Polish adjective an English reader cannot parse, two lines under a `place` that says the name.
page.landing.register.entries.hymn-poleglym.note: "A tribute to those who gave their lives defending Ukraine. At the climax, as the altarpiece of St Mary's Basilica was opened, the anthem of Ukraine sounded."

page.landing.register.entries.aeternam.tag: "An epitaph · 4, 8 and 12 voices"
page.landing.register.entries.aeternam.place: "Mistrzejowice · Niedzica"
page.landing.register.entries.aeternam.note: "An evening for the people of Gaza. Vivancos's Aeternam, the two Taveners, the commendation of the victims to the Mother of God."
page.landing.register.entries.aeternam.credit: "Partners: Łapsze Niżne Commune · Łapsze Niżne Cultural Centre · ZEW Niedzica · Dunajec Castle · ACN — Aid to the Church in Need. Media patrons: Gość Niedzielny · Radio Alex · Tygodnik Podhalański."
page.landing.register.entries.aeternam.videoNote: "C. Shaw — and the swallow (Psalm 84) · recorded from the nave · live sound"

