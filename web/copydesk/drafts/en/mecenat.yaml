page.mecenat.about.h2: "About the production"
page.mecenat.about.body: "The budget given above is the scale of funding the concert needs in its planned form. Part of the conceptual and organisational work is the VoctFoundation's own contribution. Patronage can cover the whole project or a chosen area:"

page.mecenat.presence.h2: "Being present"
page.mecenat.presence.body: "Some patrons want to be close: to learn the idea and how the project is made, and to come to the dress rehearsal. Others prefer to meet only the finished work. Patronage can remain private or become part of the project's public story. After the concert we give our patrons an account of its costs and funding."
page.mecenat.presence.photoCaption: "VoctEnsemble rehearsal"

page.mecenat.coda: "What later becomes the listeners' shared experience begins earlier, between the people who make it possible for the concert to take its form."

page.mecenat.contact.lead: "If this project is close to your heart, or you would like to know it better, let us begin with a conversation."
