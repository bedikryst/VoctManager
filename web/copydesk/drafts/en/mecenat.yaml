page.mecenat.meta.title: "Patronage | The VoctFoundation"
page.mecenat.meta.description: "Patronage at the VoctFoundation: a part in how concerts come into being, before they meet their audience. The current project, its budget and the person to talk to."
page.mecenat.eyebrow: "Patronage · VoctFoundation"
page.mecenat.h1: "Patronage begins before a work meets its audience."
page.mecenat.idea: "It is one of the oldest ways of being present in the arts: the decision that an idea deserves to come into being, with its artistic shape left to the artists."

page.mecenat.realisation.rubricAhead: "In production"
page.mecenat.realisation.rubricPast: "Latest production"
