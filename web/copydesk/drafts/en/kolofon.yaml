# page.kolofon — EN draft (stage G7). Same flat shape as the overlay it will become.
#
# THE PAGE ONLY. The colophon prints four typefaces, six collaborators, six photographers, a board
# of three and a registry of numbers, and none of them is here: a name and a number are the same in
# every language. What is here is what a language renders — the vernacular tier of each Latin
# rubric, the four sentences the page is set by, the materials, the type notes, and the roles.
#
# The foundation's MISSION is not here either: /kolofon reads /kontakt's `locus.mission`, so the
# English it prints is the one already in this overlay under that key.
#
# THE RENDERINGS THE SITE HAS ALREADY PUBLISHED, followed rather than invented:
#   Koncerty Duchowe        → Spiritual Concerts       (koncert.ts, o-nas.ts, concerts.en.yaml)
#   Fundacja (rubryka)      → The foundation           (page.kontakt.locus.eyebrow — one rubric,
#                             one gloss, because `Fundatio` stands over both pages)
#   Fotografie (rubryka)    → Photographs              (page.obrazy.colophon.eyebrow — same)
#   Zarząd                  → Board                    (page.kontakt.voices.note, "The board of
#                             the VoctFoundation")
#   archiwum zespołu        → the ensemble's own archive  (photoCredit CREDIT_LABELS.en.ownArchive)
#   Statut Fundacji …       → Statute of the VoctFoundation  (ui.ts footer.statuteAria)
#   Obrazy (materiał)       → Images                   (ui.ts footer.images)
#   reżyseria świateł       → lighting design          (concert.9-kart.credits.2.role)
#   realizacja              → production               (concert.wcielenie.realizacja)
#   skrzypce · organy       → violin · organ           (concert.*.realizacja)
#   Wołanie Gór · Hymn Poległym · Kontemplacja Wcielenia
#                           → The Call of the Mountains · Hymn to the Fallen ·
#                             Contemplation of the Incarnation   (concerts.en.yaml titles)
#
# THE REGULA IS FOUR INSCRIPTIONS, not four sentences of prose: one clause each, no explanation
# added. The page demonstrates every one of them, which is why none of them may be glossed here.
#
# British spelling (`co-organisation`). Not the overlay: `npm run copy:propose --locale en` carries
# these in as proposals, which is the only door that stamps the provenance hash the stale state is
# computed from.

