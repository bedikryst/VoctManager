# page.kolofon — FR draft (stage G7). Same flat shape as the overlay it will become.
#
# THE PAGE ONLY. The colophon prints four typefaces, six collaborators, six photographers, a board
# of three and a registry of numbers, and none of them is here: a name and a number are the same in
# every language. What is here is what a language renders — the vernacular tier of each Latin
# rubric, the four sentences the page is set by, the materials, the type notes, and the roles.
#
# The foundation's MISSION is not here either: /kolofon reads /kontakt's `locus.mission`, so the
# French it prints is the one already in this overlay under that key.
#
# THE RENDERINGS THE SITE HAS ALREADY PUBLISHED, followed rather than invented:
#   Koncerty Duchowe        → Concerts Spirituels      (koncert.ts, o-nas.ts, concerts.fr.yaml)
#   Fundacja (rubryka)      → La fondation             (page.kontakt.locus.eyebrow — one rubric,
#                             one gloss, because `Fundatio` stands over both pages)
#   Fotografie (rubryka)    → Photographies            (page.obrazy.colophon.eyebrow — same)
#   Zarząd                  → Conseil                  (page.kontakt.voices.note, "Le conseil de
#                             la Fondation VoctFoundation")
#   archiwum zespołu        → archives de l'ensemble   (photoCredit CREDIT_LABELS.fr.ownArchive)
#   Statut Fundacji …       → Statuts de la Fondation VoctFoundation  (ui.ts footer.statuteAria)
#   Obrazy (materiał)       → Images                   (ui.ts footer.images)
#   reżyseria świateł       → création lumière         (concert.9-kart.credits.2.role)
#   realizacja              → réalisation              (concert.wcielenie.realizacja)
#   skrzypce · organy       → violon · orgue           (concert.*.realizacja)
#   Wołanie Gór · Hymn Poległym · Kontemplacja Wcielenia
#                           → L'Appel des montagnes · Hymne aux morts ·
#                             Contemplation de l'Incarnation   (concerts.fr.yaml titles)
#
# ONE WORD FOR ONE THING: `kroje pisma` is « caractères » in the rubric AND in the privacy row, so
# the page does not name its own type twice. `fonty wariacyjne` stays « polices variables » — the
# Polish itself uses two registers there (the material vs the technical feature) and French keeps
# the same pair. `sans-serif` and `monospace` stay as the Polish keeps them: loanwords in a type
# note, not Vox classifications to be turned into « linéale ».
#
# THE REGULA IS FOUR INSCRIPTIONS, not four sentences of prose: one clause each, no explanation
# added. The page demonstrates every one of them, which is why none of them may be glossed here.
#
# NEVER TYPE A HARD SPACE before `; : ? !` — `lib/typo.ts` inserts the narrow no-break space at
# build and a hand-typed one doubles up (glossary §3). Not the overlay:
# `npm run copy:propose --locale fr` carries these in as proposals, which is the only door that
# stamps the provenance hash the stale state is computed from.

