# page.skarbiec — brouillon FR (étape I). Traduit du polonais, jamais de l'anglais.
#
# LE SKARBIEC SE LIT SUR TOUTES LES PAGES DU SITE, et non sur une page à lui : le bouton « Nous
# soutenir » de la barre l'ouvre sur place. C'est ce qui en faisait la plus grande lacune restée
# ouverte après l'étape G — la barre dit « Nous soutenir » depuis l'étape F et le panneau derrière
# elle répondait en polonais.
#
# CE QUI N'EST PAS ICI, parce que ce n'est pas de la copie : les affordances, les libellés de
# formulaire et les messages de validation forment un triplet typé
# (`i18n/content/skarbiecChrome.ts`) ; le numéro de compte, le registre de la fondation et
# l'intitulé du virement sont des constantes — l'intitulé reste POLONAIS dans toutes les langues,
# c'est la chaîne que le relevé bancaire de la fondation doit porter ; Zrzutka.pl, Axepta BNP
# Paribas, BLIK, Apple et Google Pay ainsi que les six banques sous le QR sont des marques.
#
# LE NOM DU CYCLE est celui que le site publie en français, « les Concerts Spirituels »
# (`i18n/content/koncert.ts`), là où le polonais dit « Koncerty Duchowe » : dans le titre, dans la
# ligne qui remplace le nombre de donateurs et dans le remerciement.
#
# LA CARTE QR VISE UN COMPTE POLONAIS, et ses banques sont nommées sur la carte elle-même. Le code
# 2D polonais (KIR) qu'elle imprime n'est lu que par les applications bancaires polonaises ; le
# libellé « Virement QR » reste donc proche de celui de ces applications.
#
# PAS D'ESPACES INSÉCABLES TAPÉES À LA MAIN : `lib/typo.ts` les insère au build avant « ? ! : ; »
# et autour des guillemets. Les guillemets polonais „…" deviennent « … ».
#
# UN FRAGMENT EST LA MOITIÉ D'UNE PHRASE, par construction — l'autre moitié est un lien que le
# pupitre ne peut pas porter : `online.consentLead` se termine par l'article du titre qui le suit.
# `qr.recurringNoteHtml` ne porte ni lien ni question : la ligne qui ferme le volet, chrome hors
# pupitre, est la seule route vers /fundacja#mecenat et pose la question elle-même.

