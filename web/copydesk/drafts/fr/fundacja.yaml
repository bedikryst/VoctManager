# page.fundacja — FR draft. Same flat shape as the overlay it will become.
# Keys carry the `page.` namespace; `Html` fields are written exactly as the reader receives them.
# Internal hrefs stay Polish (`/polityka-prywatnosci`); `lib/pageCopy` localizes them at render.
# French punctuation spacing (before « : », « ; », « ? ») is applied by `lib/typo.ts` at build — write
# it plainly here. `{slots}` are filled by the page (amounts, dates, counts) — keep every one of them.
# The board's functions name the office, not the person: one word stands under a woman's and a
# man's name alike. Links carry no arrow: the page draws it. Supporters' reasons carry no « ».
# Not the overlay: `make copy-draft` carries these in as proposals; `make copy-apply` writes them.

page.fundacja.meta.title: "Fondation VoctFoundation | VoctEnsemble"
page.fundacja.meta.description: "La fondation VoctFoundation est une fondation culturelle cracovienne, le socle des projets artistiques de l'ensemble VoctEnsemble. Réalisations, équipe, documents et formes de soutien : don, mécénat, partenariat."

page.fundacja.hero.eyebrow: "Fondation VoctFoundation"
page.fundacja.hero.title1: "Nous adaptons les moyens"
page.fundacja.hero.title2Html: "<em>à l'idée.</em>"
page.fundacja.hero.lead: "La fondation VoctFoundation est une fondation culturelle cracovienne, créée en 2026. Son ensemble en résidence est VoctEnsemble. La fondation réunit des artistes, des compétences et des financements autour d'une idée artistique précise, et c'est l'idée qui détermine la forme du projet, sa distribution et sa manière d'être réalisé."
