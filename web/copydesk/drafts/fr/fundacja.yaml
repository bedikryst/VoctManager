page.fundacja.record.h2: "La fondation VoctFoundation est née de l'expérience de VoctEnsemble."
page.fundacja.record.bodyHtml: "Depuis janvier 2024, VoctEnsemble prépare ses propres Concerts Spirituels, dans la lignée de la tradition française du <em>Concert Spirituel</em>. Chaque programme est conçu depuis le début, pour un lieu précis, avec des artistes, des professionnels de la production et des institutions. La fondation, créée en avril 2026, donne à ce travail un socle durable : elle permet d'inviter de nouveaux artistes et de monter des productions plus ambitieuses."
