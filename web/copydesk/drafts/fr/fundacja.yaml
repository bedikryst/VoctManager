page.fundacja.costs.eyebrow: "À quoi servent les fonds"
page.fundacja.costs.h2: "De quoi se compose un concert"
page.fundacja.costs.intro: "Le public entend le programme achevé. Le soutien va à ce qui ne s'entend pas : la préparation, et les personnes qui la mènent."
page.fundacja.costs.body: "Avant de nous retrouver au concert, il faut composer le programme, se procurer les partitions et le travailler en répétition. Viennent ensuite les déplacements et — là où le lieu l'exige — la sonorisation et l'éclairage. Le soutien aide à couvrir ce travail, avant tout les cachets des chanteurs."
page.fundacja.costs.itemsLabel: "De quoi se compose le coût"
page.fundacja.costs.items.honoraria.term: "Cachets des chanteurs"
page.fundacja.costs.items.honoraria.what: "Le premier poste de chaque concert. L'ensemble est formé de chanteurs professionnels — les répétitions et la soirée sont leur travail."
page.fundacja.costs.items.partytury.term: "Partitions et programme"
page.fundacja.costs.items.partytury.what: "L'achat des partitions, la composition du programme et le matériel des chanteurs."
page.fundacja.costs.items.proby.term: "Répétitions"
page.fundacja.costs.items.proby.what: "Une salle et une série de répétitions où le programme prend forme avant que le public ne l'entende."
page.fundacja.costs.items.dojazdy.term: "Déplacements"
page.fundacja.costs.items.dojazdy.what: "Les trajets de l'ensemble vers les répétitions et les concerts hors de Cracovie."
page.fundacja.costs.items.realizacja.term: "Son et lumière"
page.fundacja.costs.items.realizacja.what: "Là où le lieu et le programme l'exigent. Tous les concerts n'en ont pas besoin."
page.fundacja.costs.current.labelAhead: "Ce que nous préparons en ce moment"
page.fundacja.costs.current.labelPast: "Le dernier programme préparé"
page.fundacja.costs.current.programLink: "Voir le programme →"
page.fundacja.costs.current.note: "Un exemple du travail en cours de l'ensemble, non une collecte à part. Les dons soutiennent l'activité statutaire de la fondation, ce concert et les suivants compris."

page.fundacja.record.eyebrow: "Parcours"
page.fundacja.record.h2: "La musique qui a déjà résonné"
page.fundacja.record.intro: "Chacun de ces programmes a été construit depuis le début : le répertoire, la dramaturgie de la soirée et le lieu où il devait résonner. C'est le parcours de VoctEnsemble — et la mesure de ce à quoi va le soutien."
page.fundacja.record.allLink: "Découvrir les autres concerts →"

page.fundacja.support.eyebrow: "Soutien"
page.fundacja.support.h2: "Aidez à préparer les prochains concerts"
page.fundacja.support.intro: "Deux voies simples. La régulière d'abord, car c'est elle qui permet de planifier."
page.fundacja.support.monthly.label: "Soutenir chaque mois"
page.fundacja.support.monthly.body: "Un soutien régulier permet de planifier les répétitions et les prochains programmes à l'avance. Vous mettez en place un virement permanent dans votre banque ; c'est là aussi que vous modifiez le montant ou l'annulez — sans nous contacter."
page.fundacja.support.monthly.amounts: "Par exemple {amounts} PLN par mois. Ce sont des exemples, non des seuils — tout montant est bienvenu."
page.fundacja.support.monthly.transferLink: "Coordonnées bancaires"
page.fundacja.support.once.label: "Soutenir une fois"
page.fundacja.support.once.body: "Payez en ligne via la plateforme de paiement, ou faites un virement ordinaire sur le compte de la fondation."
page.fundacja.support.once.vaultAction: "Payer en ligne"
page.fundacja.support.once.transferLink: "Je préfère un virement"

page.fundacja.transfer.h3: "Coordonnées bancaires"
page.fundacja.transfer.recipientLabel: "Bénéficiaire"
page.fundacja.transfer.accountLabel: "Numéro de compte"
page.fundacja.transfer.eurLabel: "Compte en euros"
page.fundacja.transfer.eurNote: "Pour les virements depuis l'étranger."
page.fundacja.transfer.titleLabel: "Libellé du virement"
page.fundacja.transfer.standingOrderHint: "Virement permanent : les mêmes coordonnées, dans votre banque, à la fréquence de votre choix."
page.fundacja.transfer.scope: "Les dons soutiennent l'activité statutaire de la fondation VoctFoundation, dont la préparation des concerts de VoctEnsemble."

page.fundacja.join.h3: "Dites-nous que vous nous rejoignez"
page.fundacja.join.body: "Si vous mettez en place un virement permanent, laissez-nous un moyen de vous joindre — nous vous remercierons personnellement et vous dirons ce que votre soutien a rendu possible. Le formulaire est facultatif : il ne transfère aucun argent et ne déclenche aucun virement."
page.fundacja.join.consentHtml: "J'accepte le traitement de mes données (prénom, nom, e-mail) afin d'être contacté au sujet du mécénat, conformément à la <a href=\"/polityka-prywatnosci\">politique de confidentialité</a>."
page.fundacja.join.successTitle: "Merci."
page.fundacja.join.successBody: "Nous avons transmis votre message à la fondation. Si vous souhaitez nous soutenir régulièrement, mettez en place un virement permanent dans votre banque."
page.fundacja.join.contactLead: "Questions sur le soutien :"

page.fundacja.partnership.eyebrow: "Partenariat"
page.fundacja.partnership.h2: "Créez un concert avec nous"
page.fundacja.partnership.intro: "Entreprise, institution, paroisse, festival — il y a trois choses dont nous pouvons parler."
page.fundacja.partnership.rows.produkcja.term: "Soutenir une production"
page.fundacja.partnership.rows.produkcja.what: "Une participation aux coûts d'un concert convenu, ou d'un poste précis — les cachets, par exemple, ou les partitions."
page.fundacja.partnership.rows.ciaglosc.term: "Soutenir la continuité"
page.fundacja.partnership.rows.ciaglosc.what: "Une collaboration sur une période définie autour de l'activité de concert de l'ensemble — une saison, ou un cycle de programmes."
page.fundacja.partnership.rows.zasoby.term: "Des ressources plutôt que de l'argent"
page.fundacja.partnership.rows.zasoby.what: "Un lieu de répétition ou de concert, le transport, l'impression, la technique — là où cela répond à un besoin réel. Ce sont des possibilités à discuter, non une liste de manques."
page.fundacja.partnership.next: "Écrivez-nous quel projet ou quel type de collaboration vous intéresse. Nous conviendrons de l'étendue du soutien, de la manière de vous remercier et du bilan de la réalisation."
page.fundacja.partnership.thanks: "Les remerciements se conviennent ensemble : une mention ou un logo dans le programme et sur la page du concert — là où le lieu et l'organisateur le permettent."
page.fundacja.partnership.mailLabel: "Écrire au sujet d'un partenariat"
page.fundacja.partnership.mailSubject: "Partenariat avec la fondation VoctFoundation"
page.fundacja.partnership.bookingLead: "Vous souhaitez inviter l'ensemble à chanter ?"
page.fundacja.partnership.bookingLink: "Écrire à l'adresse des concerts →"
page.fundacja.partnership.bookingSubject: "Invitation pour VoctEnsemble"

page.fundacja.who.eyebrow: "La fondation et ses documents"
page.fundacja.who.h2: "Qui est derrière"
page.fundacja.who.relation: "VoctEnsemble est l'ensemble résident de la fondation VoctFoundation : l'ensemble chante, la fondation organise, tient les comptes et répond de vos données. Les dons sont reçus par la fondation."
page.fundacja.who.boardLabel: "Le conseil de la fondation"
page.fundacja.who.boardNote: "Nous répondons ensemble. Adressez vos questions sur le soutien à l'adresse du mécénat — nous la lisons tous les trois."
page.fundacja.who.identityLabel: "Coordonnées de la fondation"
page.fundacja.who.documentsLabel: "Documents"
page.fundacja.who.statuteLink: "Statuts de la fondation (PDF)"
page.fundacja.who.privacyLink: "Politique de confidentialité"
page.fundacja.who.termsLink: "Conditions des dons — lors du paiement en ligne"
page.fundacja.who.help.label: "En bref"
page.fundacja.who.help.items.zlecenie.q: "Puis-je modifier ou annuler un virement permanent ?"
page.fundacja.who.help.items.zlecenie.a: "Oui, à tout moment — dans votre banque, sans nous contacter."
page.fundacja.who.help.items.formularz.q: "Dois-je remplir le formulaire pour faire un don ?"
page.fundacja.who.help.items.formularz.a: "Non. Le formulaire est facultatif ; les coordonnées du compte suffisent pour un virement."
page.fundacja.who.help.items.kontakt.q: "À qui écrire au sujet du soutien ?"
page.fundacja.who.help.items.kontakt.a: "À l'adresse du mécénat ci-dessous — le conseil de la fondation la lit."
page.fundacja.who.help.items.dokumenty.q: "Où sont les documents de la fondation ?"
page.fundacja.who.help.items.dokumenty.a: "Les statuts, la politique de confidentialité et les conditions des dons sont ici même. L'inscription au registre peut être vérifiée avec le numéro KRS ci-dessus."
page.fundacja.who.contactLabel: "Contact au sujet du soutien"
