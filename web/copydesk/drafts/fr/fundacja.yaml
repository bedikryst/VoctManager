# page.fundacja — FR draft. Same flat shape as the overlay it will become.
# Keys carry the `page.` namespace; `Html` fields are written exactly as the reader receives them.
# Internal hrefs stay Polish (`/polityka-prywatnosci`); `lib/pageCopy` localizes them at render.
# French punctuation spacing (before « : », « ; », « ? ») is applied by `lib/typo.ts` at build — write
# it plainly here. `{amounts}` in support.monthly.amounts is a slot the page fills ("50, 100 ou 200").
# Not the overlay: `make copy-draft` carries these in as proposals; `make copy-apply` writes them.

page.fundacja.meta.title: "Fondation et soutien — VoctEnsemble | VoctFoundation"
page.fundacja.meta.description: "La fondation VoctFoundation est l'assise organisationnelle et financière de VoctEnsemble. Découvrez de quoi se compose un concert et aidez à préparer les prochains programmes du cycle Concerts Spirituels — chaque mois, une fois, ou en tant qu'entreprise ou institution."

page.fundacja.hero.eyebrow: "Fondation VoctFoundation"
page.fundacja.hero.title1: "Pour que la musique"
page.fundacja.hero.title2Html: "ait <em>une suite.</em>"
page.fundacja.hero.lede: "La fondation VoctFoundation est l'assise organisationnelle et financière de VoctEnsemble. Nous aidons à préparer les prochains concerts du cycle Concerts Spirituels — du travail sur le programme et des répétitions jusqu'à la rencontre avec le public."
