page.fundacja.transfer.tax: "Selon le droit fiscal polonais, un don est déductible du revenu : jusqu'à 6 % pour l'impôt sur le revenu des personnes physiques (PIT), jusqu'à 10 % pour l'impôt sur les sociétés (CIT). Une preuve du virement suffit."

page.fundacja.join.summary: "Vous avez mis en place un virement permanent ? Dites-le-nous."
page.fundacja.join.note: "Laissez vos coordonnées et nous vous remercierons personnellement. Le formulaire ne transfère pas d'argent et ne crée aucun virement."
page.fundacja.join.supportConsentHtml: "J'accepte le traitement de mes données (prénom, nom, adresse e-mail) afin d'être contacté au sujet du soutien à la fondation, conformément à la <a href=\"/polityka-prywatnosci\">politique de confidentialité</a>."
