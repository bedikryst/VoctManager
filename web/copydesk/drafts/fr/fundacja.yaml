page.fundacja.support.h2: "Qui rend nos projets possibles"
page.fundacja.support.donation.label: "Don"
page.fundacja.support.donation.quote: "« Je veux que vous puissiez continuer à faire ce que vous faites. »"
page.fundacja.support.donation.body: "Une fois ou chaque mois, du montant de votre choix. Le virement permanent se met en place dans votre banque, et c'est là aussi que vous le modifiez ou l'annulez."
page.fundacja.support.donation.scale: "Le budget d'un concert correspond à ce que {people} personnes donnent en un an, à raison de {monthly} PLN par mois."
page.fundacja.support.donation.promise: "Après chaque concert, nous publions ce qu'il a coûté et qui l'a financé."
page.fundacja.support.donation.vaultAction: "Donner en ligne"
page.fundacja.support.donation.transferLink: "Coordonnées bancaires"
page.fundacja.support.mecenat.label: "Mécénat"
page.fundacja.support.mecenat.quote: "« Je veux être là quand certaines choses prennent forme. »"
page.fundacja.support.mecenat.body: "Le mécénat commence avant qu'un projet ne prenne sa forme définitive. Il peut porter sur tout un concert ou sur une partie, rester privé ou entrer dans l'histoire du projet. Il commence par une conversation."
page.fundacja.support.mecenat.link: "Mécénat →"
page.fundacja.support.partnership.label: "Partenariat"
page.fundacja.support.partnership.quote: "« Nous voulons soutenir un projet précis avec ce que nous avons. »"
page.fundacja.support.partnership.body: "Les entreprises et les institutions nous soutiennent par un don ou par ce dont un projet a besoin : un lieu de répétition, le transport, l'impression, la prise de son. Nous coorganisons des concerts avec des festivals, des paroisses et des institutions culturelles. Le périmètre se fixe en discutant."
