# concert.pochwala-stworzenia — brouillon FR. Même forme plate que la superposition qu’il deviendra.
#
# LES MOTS DE LA SOIRÉE, pas ceux de la page. Ce que /koncerty et la bande Proximum disent autour
# de ce concert vit sous `page.koncerty.*` et `page.landing.proximum.*`.
#
# Rendus suivis plutôt qu’inventés :
#   Koncert Duchowy        → Concert Spirituel                 (koncert.ts, o-nas.ts)
#   Warszawa               → Varsovie                          (concert.bobola.metaPlace)
#   Skrzypce : <nom>       → Violon : <nom>                    (concert.wolanie-gor.realizacja)
#   Plakat koncertu <X>    → Affiche du concert <X>            (tous les posterAlt du corpus)
#
# DEUX CHOSES PORTENT CETTE PAGE, et une traduction qui en perd une perd la soirée :
#   - *Stetit Angelus* met en musique l’ange encensant avec LES PRIÈRES DE TOUS LES SAINTS, et le
#     concert a lieu en l’église de Tous-les-Saints. La dernière proposition d’`essence` EST cette
#     rime : garder les deux formules identiques, sinon la phrase énonce deux faits sans rapport.
#   - « znanych po polsku jako Pieśń słoneczna » est une note de RÉCEPTION : elle devient l’énoncé
#     vrai équivalent pour le lecteur français, chez qui le texte est le Cantique des créatures.

concert.pochwala-stworzenia.title: "Louange de la Création"
concert.pochwala-stworzenia.metaPlace: "Église de Tous-les-Saints, Varsovie"
# PERSONNE NE LIT CE CHAMP AVANT LE 12 OCTOBRE : tant que la soirée est à venir il n'est que la
# description JSON-LD, et au premier build après la date il devient la <meta description> — la phrase
# qu'un résultat de recherche cite. Il tient seul, et c'est donc le seul endroit qui porte encore la
# rime de la Toussaint en entier ; les bandes visibles ne la dépensent plus qu'une fois. « Le
# concert » et non « la soirée » : l'heure imprimée sur cette page est 13:30. « Entre les groupes
# d'œuvres » est la correction du chef lui-même sur la fréquence du retour de Pärt.
concert.pochwala-stworzenia.essence: "Le concert naît des Laudes creaturarum de saint François, connues en français comme le Cantique des créatures : la création tout entière y est un chemin vers le Créateur. Le programme conduit de l’émerveillement devant le monde vers la fragilité de l’homme, vers la transformation, la souffrance et la mort, et entre les groupes d’œuvres le Spiegel im Spiegel de Pärt revient de la tribune, miroir de cette relation. Tout le chemin se referme sur le Stetit Angelus de Dubra, image de l’ange encensant l’autel avec les prières de tous les saints, chanté en l’église de Tous-les-Saints."

# `invitation` est un SECOND texte sur cette soirée, et non un `essence` raccourci : la station de
# /koncerty dit la note de programme, la bande « Najbliższy wieczór » de l’accueil dit l’invitation.
# Les deux ouvrent volontairement sur des faits différents — l’essence sur l’origine de la soirée,
# celui-ci sur ce que FAIT le Cantique, à savoir saluer ses sujets, la mort comprise, comme une
# fratrie. Garder cet écart en français : une traduction qui les rapproche pose une seule
# paraphrase sur deux surfaces.
concert.pochwala-stworzenia.invitation: "Le Cantique des créatures de saint François salue le soleil, le vent, l’eau et le feu comme une fratrie, et salue la mort dans les mêmes termes. Le programme suit ce chemin : de la lumière vers ce qui est fragile en l’homme, et plus loin — jusque là où la louange de la création devient la prière de tous les saints, en l’église qui porte leur nom."

concert.pochwala-stworzenia.facts.0: "Festival « Fenomen Człowieka »"
concert.pochwala-stworzenia.facts.1: "Voix, violon, orgue"
concert.pochwala-stworzenia.facts.2: "Le Cantique des créatures de saint François"
