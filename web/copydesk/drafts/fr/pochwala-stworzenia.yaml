# au requiem dans l'ordre définitif du chef (15.09.2026). L'INDICE désigne la ligne que le retour
# suit : un retour qui se déplace est une clé qui se déplace, et un indice périmé laisse au bureau
# une traduction pour une ligne qui n'en porte plus.
concert.pochwala-stworzenia.program.1.clasp: "Spiegel im Spiegel · Arvo Pärt"
concert.pochwala-stworzenia.program.4.clasp: "Spiegel im Spiegel · Arvo Pärt"
concert.pochwala-stworzenia.program.8.clasp: "Spiegel im Spiegel · Arvo Pärt"
