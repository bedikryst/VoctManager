concert.hymn-poleglym.pullQuote.text: "C'est la première fois que nous nous engageons dans un projet qui, au-delà de sa dimension spirituelle, touche aussi directement à la plus grande aspiration humaine — la liberté et l'autodétermination. Nous souhaitons que ce concert ne soit pas seulement un acte de mémoire, mais aussi un don d'apaisement pour ceux qui ont connu la perte, et l'expression de notre solidarité avec le peuple ukrainien."
concert.hymn-poleglym.pullQuote.attribution: "Anna Kaczka-Marcisz"
concert.hymn-poleglym.pullQuote.about: "manager de VoctEnsemble, extrait de l'annonce du concert"

