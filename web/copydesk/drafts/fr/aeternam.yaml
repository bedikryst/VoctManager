concert.aeternam.pullQuote.text: "Là où des civils, des enfants et des familles portent sur eux les traces de la guerre, nous demandons : que sont aujourd'hui la justice, la mémoire et la miséricorde ? Quelle inscription graver sur la tombe de Gaza ?"
