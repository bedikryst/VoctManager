page.landing.support.eyebrow: "Mécénat · don · partenariat"
page.landing.support.title: "Que la musique ait son lieu."
page.landing.support.lede: "Le plus grand poste d'un concert, ce sont les honoraires des chanteurs ; viennent ensuite les partitions, le son, la lumière et les déplacements. C'est là que vont les dons. Vous pouvez aussi nous inviter chez vous : nous chantons des concerts et des liturgies, des messes de mariage, des jubilés."
