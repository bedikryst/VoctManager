# page.landing — FR draft (stage K, pass 2). Same flat shape as the overlay it will become.
#
# WHAT PASS 2 CHANGED, and why it could not be seen from inside the sentence that wrote it (§2):
# fourteen values, most of them found by reading these 89 beside the REST of the site rather than
# beside the Polish. The landing was the last page translated, so every term it shares with
# /o-nas, /skarbiec, /koncerty or a concert page already had a published French word. Two video
# notes the corpus prints word for word, the vault's transfer label, the concert page's programme
# label, the altarpiece's supporting noun, the debut in the plural the corpus uses — plus what the
# Polish itself named: an evening is `donnée`, not `chantée` (a violin plays in one of them),
# "stałe miejsce" is not "swoje miejsce", "zostaje w duszy" is not "znajduje miejsce", and the
# manifest's locative is not the hero's ablative. French also lowercases a building's generic noun
# anywhere but the head of a value — `basilique`, `cathédrale` — which the site's own prose has
# done since /koncerty. The reasons sit above the keys they belong to.
#
# 89 FIELDS, AND WHAT IS DELIBERATELY NOT AMONG THEM:
#   - the five evenings' TITLES. The register and the Imagines band read them from
#     `concerts.fr.yaml` through the copy overlay, so this page holds no second name for a night;
#   - the threshold's two BUTTONS (« Entrer avec la voix » / « Entrer en silence »). They are
#     chrome, a complete triple in `i18n/content/landing.ts`, because § 3 and § 10 of the privacy
#     policy quote them by name in all three languages — two documents on one site may not call
#     one button two things;
#   - the Latin tier (Lumen Christi, Vox memoriae, Sustinete nos, Imagines, Vox, Repertorium,
#     Introitus, De nobis, Via, Scribe nobis, tacet.). `Concerts Spirituels` is French already and
#     is the name of the historical form on every page of this site.
#
# NO PUNCTUATION SPACING BY HAND: `lib/typo.ts` inserts the narrow no-break spaces before
# ? ! : ; and the ordinary ones inside « » at build. Typed here they would double up.
#
# THE RENDERINGS THE SITE HAS ALREADY PUBLISHED, followed rather than invented:
#   Koncert Duchowy / cykl      → Concert Spirituel / le cycle des Concerts Spirituels
#   anachoreci · tęsknota       → anachorètes · nostalgie      (page.o-nas.letter.stanzas.I, hero)
#   W ciszy rodzi się muzyka.   → « Dans le silence naît la musique. »  (le polonais est identique
#   Tak powstał Voct              sur les deux pages → le français aussi ; /o-nas strophe II)
#                               → « Ainsi est né Voct »
#   „zostaje w duszy niczym     → « demeure dans l'âme comme un organisme vivant » — et NON le
#    żywy organizm"                « trouvant place en son âme » de /o-nas, dont le polonais dit
#                                 « znajdując miejsce » là où le landing dit « zostaje »
#   „słowo i muzyka są swoimi   → « le mot et la musique sont l'image l'un de l'autre »
#    lustrzanymi odbiciami"        (page.o-nas.cantus.lead)
#   Bazylika NSPJ · Mariacka    → Basilique du Sacré-Cœur · Basilique Sainte-Marie
#   Archikatedra w Łodzi        → la cathédrale de Łódź        (page.kontakt.hero.lede)
#   Kraków                      → Cracovie · Łódź stays itself (glossary §3)
#   Zapowiedź · zawierzenie     → Annonce · Recommandation     (glossary §3)
#   Tytuł przelewu · Odbiorca   → Intitulé du virement · Bénéficiaire  (skarbiecChrome.ts, le
#                                 coffre vers lequel cette section renvoie — mêmes deux étiquettes,
#                                 même numéro de compte)
#   Program koncertu            → Le programme du concert      (koncert.ts, le même programme)
#   zapis z widowni / z nawy    → captation depuis la salle / depuis la nef  (concert.*.video.note)
#   debiut                      → les débuts                   (concert.wcielenie.about.blurb)
#   VII wieków repertuaru       → sept siècles                 (page.koncerty.repertoire.eyebrow)
#   Fundacja Carpe Diem         → la Fondation Carpe Diem      (page.o-nas.ensemble.collabText)
#
# ONE FRAME HELD ACROSS THREE SECTIONS, and it is the page's spine rather than a stylistic
# preference: the hero's « Z ciszy / głos. », the Vox moment's « Z tej ciszy — głos. » and the
# Imagines band's « Z tego głosu — pamięć. » are one figure said three times, each handing the
# last word to the next. French keeps the frame — « Du silence / une voix. » → « De ce silence —
# une voix. » → « De cette voix — la mémoire. »
#
# THE READER IS ADDRESSED FORMALLY (« vous »), as everywhere else on this site.
#
# THE TRANSFER LINES KEEP THEIR POLISH, and only their LABELS are rendered. « Fundacja
# VoctFoundation » is the foundation's registered name and « Darowizna na cele statutowe
# VoctFoundation » is the reference a donor copies into a Polish bank's form — translating either
# would hand a reader words to type that the receiving bank does not expect.
#
# `zł` STAYS `zł` IN EVERY LOCALE: the site already publishes « 50, 100 ou 200 zł » in French
# (page.skarbiec.mecenat.howHtml), and French writes the thousands break as a space, like Polish.
#
# TWO EDITORIAL FINDINGS, NAMED RATHER THAN HARMONISED — both are questions for the desk, in the
# SOURCE language, and neither is a translation defect:
#   1. `ensemble.title1` + `title2` (« Zaczęło się / od tęsknoty. ») is the SAME Polish sentence
#      /o-nas prints as its own hero title. One line, two files: an edit to either leaves the site
#      saying it two ways. The French here follows /o-nas's published rendering so the two agree.
#   2. `register.title` (« Co już zabrzmiało. ») is the fourth Polish wording of one section:
#      /koncerty calls it « Droga koncertów », /o-nas « Co już wybrzmiało », the landing's own
#      chrome « Z drogi ». §6aa filed the same finding for the rubric `Via`. French cannot see the
#      difference between the two verbs at all, so this line and /o-nas's come out identical —
#      which is itself the evidence that the Polish is carrying a distinction nothing else does.
#
# Not the overlay: `npm run copy:propose --locale fr` carries these in as proposals, which is the
# only door that stamps the provenance hash the stale state is computed from.

