page.landing.register.entries.wcielenie.tag: "Concert Spirituel · début"
page.landing.register.entries.wcielenie.place: "Basilique du Sacré-Cœur à Cracovie"
page.landing.register.entries.wcielenie.note: "Une entrée dans le mystère de l'Incarnation, de l'annonce d'Isaïe au cantique de Siméon. Polyphonie de la Renaissance, Pärt, Vivancos."
page.landing.register.entries.wcielenie.credit: "Enregistrement : Jakub Garbacz, Ars Sonora Studio. Reprise sous les auspices de la Fondation Carpe Diem."

page.landing.register.entries.wolanie-gor.tag: "12 voix et violon"
page.landing.register.entries.wolanie-gor.place: "Dworek Gościnny · Szczawnica"
page.landing.register.entries.wolanie-gor.note: "Un programme pour lequel les montagnes étaient le souffle. Polyphonie sacrée et chants populaires de Pologne, de Corse, de France et des îles Britanniques, avec le violon de Radu Ropotan."
page.landing.register.entries.wolanie-gor.videoNote: "J. Sykulski — Stoi lód na Prośnie · capté depuis la salle · son direct"

page.landing.register.entries.9-kart.tag: "Cycle de psaumes · 6–12 voix"
page.landing.register.entries.9-kart.place: "Basilique Saint-Antoine à Rybnik · cathédrale de Łódź · Basilique du Sacré-Cœur à Cracovie"
page.landing.register.entries.9-kart.note: "Neuf psaumes : pénitence, lamentation, louange. Le Miserere d'Allegri, divisé en neuf parties, enlace toute la soirée."

page.landing.register.entries.hymn-poleglym.tag: "Prière pour la paix"
page.landing.register.entries.hymn-poleglym.place: "Basilique Sainte-Marie à Cracovie"
page.landing.register.entries.hymn-poleglym.note: "Un hommage à ceux qui ont donné leur vie pour défendre l'Ukraine. Au point culminant, à l'ouverture du retable de Sainte-Marie, l'hymne de l'Ukraine a retenti."

page.landing.register.entries.aeternam.tag: "Épitaphe · 4, 8 et 12 voix"
page.landing.register.entries.aeternam.place: "Mistrzejowice · Niedzica"
page.landing.register.entries.aeternam.note: "Une soirée pour les habitants de Gaza. Aeternam de Vivancos, les deux Tavener, la recommandation des victimes à la Mère de Dieu."
page.landing.register.entries.aeternam.credit: "Partenaires : commune de Łapsze Niżne · centre culturel de Łapsze Niżne · ZEW Niedzica · château de Dunajec · ACN — Aide à l'Église en Détresse. Partenaires médias : Gość Niedzielny · Radio Alex · Tygodnik Podhalański."
page.landing.register.entries.aeternam.videoNote: "C. Shaw — and the swallow (Psaume 84) · capté depuis la nef · son direct"

