page.landing.ensemble.eyebrow: "D'où venons-nous ?"
page.landing.ensemble.title1: "Tout a commencé"
page.landing.ensemble.title2: "par la nostalgie."
# « zostaje w duszy », et non « znajduje miejsce » : le polonais du landing condense ce que /o-nas
# développe, et « demeurer » — le verbe que le site emploie déjà pour le silence entre les pièces —
# garde la distinction que « trouver place » effaçait.
page.landing.ensemble.origin: "Comme des anachorètes — dans le retrait, loin du vacarme — nous est venue la nostalgie d'une musique qui enveloppe, qui pénètre et qui demeure dans l'âme comme un organisme vivant. Ainsi est né Voct : du silence et de la contemplation."
page.landing.ensemble.p2: "Nous sommes aujourd'hui plus de quarante ; sur scène montent d'ordinaire douze voix. Nous adorons l'hétérophonie, la polytonalité et la polyphonie — nous tissons nos programmes d'œuvres où le mot et la musique sont l'image l'un de l'autre."
page.landing.ensemble.facts.singers.label: "chanteurs dans la communauté · douze voix sur scène"
page.landing.ensemble.facts.debut.label: "débuts · Contemplation de l'Incarnation · basilique du Sacré-Cœur"
page.landing.ensemble.facts.evenings.label: "soirées"

page.landing.director.role: "Direction artistique"
page.landing.director.p1: "Le nom du cycle remonte au Paris de 1725 : le Concert Spirituel chantait les soirs où l'opéra se taisait. Trois cents ans plus tard, Florent de Bazelaire reprend cette tradition dans les basiliques de Cracovie et de Łódź, à Szczawnica et à Niedzica."
page.landing.director.p2Html: "Il bâtit chaque programme autour d'une seule intention. <em>Contemplation de l'Incarnation</em> pour les débuts (2024), neuf feuillets du Livre des Psaumes, une prière pour la paix à la basilique Sainte-Marie, une épitaphe pour Gaza."
# « stałe miejsce » ici et « swoje miejsce » dans `support.title` sont deux formules polonaises
# différentes, rendues toutes deux par « un lieu qui lui soit propre ». Celle-ci parle de durée —
# /o-nas la rend par « une forme qui permet à la musique de durer ».
page.landing.director.p3: "Parallèlement, il dirige la Fondation VoctFoundation. La fondation doit donner à cette musique un lieu permanent."
page.landing.director.portraitAlt: "Florent de Bazelaire dirigeant VoctEnsemble"

