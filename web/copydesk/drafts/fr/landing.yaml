page.landing.register.entries.wcielenie.note: "Une entrée dans le mystère de l'Incarnation, de l'annonce d'Isaïe au cantique de Siméon. Polyphonie de la Renaissance, Pärt, Vivancos."
page.landing.register.entries.wcielenie.credit: "Enregistrement : Jakub Garbacz, Ars Sonora Studio. Reprise sous les auspices de la Fondation Carpe Diem."

