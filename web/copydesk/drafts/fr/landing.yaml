page.landing.manifest.label: "Manifeste"
# La même phrase fondatrice que /o-nas imprime dans la strophe II, mot pour mot en polonais — donc
# mot pour mot ici (`page.o-nas.letter.stanzas.II.paraHtml`). « naît du silence » disait autre
# chose : c'est la préposition du hero (« Du silence, une voix »), et le manifeste est locatif.
page.landing.manifest.lines.silentium.text: "Dans le silence naît la musique."
page.landing.manifest.lines.contemplatio.text: "La musique est la contemplation de l'âme dans le temps."
page.landing.manifest.statement: "Le sacré n'orne pas."
page.landing.manifest.answer: "Il dévoile."

page.landing.litany.inCatalogue: "Au répertoire"
