# docker-compose.prod.yml
# Production overrides focusing on performance and security (HTTPS).
# Always pair with the base file (build args and volumes live there):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# (wrapped as `make prod`).

services:
  web:
    # ASGI (uvicorn workers) — required for the async SSE progress stream
    # (config.asgi). Async views hold many open SSE connections on the event
    # loop instead of blocking a worker each, so live progress scales without
    # starving the API. All existing sync views run unchanged under ASGI
    # (Django runs them in a threadpool). This matches the image's default CMD.
    command: >
      gunicorn config.asgi:application
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000 --workers 3

  celery:
    # -B embeds the beat scheduler so CELERY_BEAT_SCHEDULE (reminders, daily
    # digest, stale-donation sweep) fires. Valid while this is the ONLY celery
    # container (beat must run as a single instance). To scale workers, remove
    # -B and add a separate one-replica `beat` service: `celery -A config beat`.
    command: celery -A config worker -B -l INFO

  frontend:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Load production Nginx config, GZIP core, and SSL certificates
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared security headers — prod.conf includes this snippet in every
      # location that declares its own add_header (nginx inheritance rule).
      - ./infra/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Let's Encrypt HTTP-01 challenge webroot — certbot (on host) writes to
      # /var/www/certbot, nginx (in container) serves it for ACME validation.
      - /var/www/certbot:/var/www/certbot:ro
      - ./infra/maintenance:/usr/share/nginx/html/maintenance:ro
      # The films, served off the host instead of out of the image. They are excluded from
      # the build context (root .dockerignore), so this mount is the ONLY thing that puts
      # them behind `/video/` — without it the pages render and the players 404. Re-cutting
      # a film is then an upload plus a VIDEO_REVISION bump, with no rebuild at all.
      - ./web/public/video:/usr/share/nginx/html/marketing/video:ro
      # Concert recordings, on the films' terms (web/src/lib/audio.ts). Not in git either: the
      # folder on the host holds exactly what was uploaded to it by hand.
      - ./web/public/audio:/usr/share/nginx/html/marketing/audio:ro
      # The Astro public site at /usr/share/nginx/html/marketing is baked INTO
      # the image, from the astro-dist image below. No host mount needed.
    build:
      # Build context = repo root so the Dockerfile sees both frontend/ and web/.
      # Photos under web/src/assets/photos/ and videos under web/src/assets/videos/
      # must be present on the build host (gitignored — see web/README.md §Conventions).
      context: .
      dockerfile: frontend/Dockerfile
      # The public site is NOT built here. `make astro-stage` builds it alone and tags it
      # (ASTRO_DIST_IMAGE in the Makefile — keep the two names equal); this named context
      # replaces the Dockerfile's astro-dist stage, so the build copies that image's site and
      # never runs Astro beside the panel build. Build this file only through `make prod` or
      # `make deploy`: a bare `docker compose … build` ships whatever site the tag last held,
      # and fails before the first `make astro-stage` has created it.
      additional_contexts:
        astro-dist: docker-image://voctmanager-astro-dist:latest
      args:
        - VITE_GOOGLE_MAPS_FRONTEND_KEY=${VITE_GOOGLE_MAPS_FRONTEND_KEY}
        - VITE_GOOGLE_MAP_ID=${VITE_GOOGLE_MAP_ID}
        - VITE_VAPID_PUBLIC_KEY=${VITE_VAPID_PUBLIC_KEY:-${VAPID_PUBLIC_KEY}}
        - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
        - APP_BUILD_SHA=${APP_BUILD_SHA:-}
