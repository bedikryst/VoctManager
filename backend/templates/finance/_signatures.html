{% comment %}Two signature lines under a contract. Included with `left` and `right`, the parties' names as defined in its text.{% endcomment %}
<table class="signatures">
    <tr>
        <td>
            <div class="sign-line"></div>
            <div class="sign-label">{{ left }}</div>
        </td>
        <td>
            <div class="sign-line"></div>
            <div class="sign-label">{{ right }}</div>
        </td>
    </tr>
</table>
