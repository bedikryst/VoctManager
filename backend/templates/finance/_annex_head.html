{% comment %}
    The head of an annex, which starts its own page and so has to say what it
    belongs to. Included with `n`, `of` (the document in the genitive, "do umowy
    o dzieło") and `title`.
{% endcomment %}
<div class="eyebrow">Załącznik nr {{ n }} {{ of }} nr {{ number }}</div>
<div class="annex-title">{{ title }}</div>
