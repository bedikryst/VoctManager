{% extends "emails/base.html" %}
{% block preheader %}{{ reply|truncatechars:90 }}{% endblock %}
{% block content %}
{% include "emails/partials/_eyebrow.html" with text=eyebrow %}<p class="sans" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 16px; line-height: 1.65; color: #34302b; margin: 0 0 32px; white-space: pre-wrap;">{{ reply }}</p>
<p class="sans" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; line-height: 1.4; letter-spacing: 0.06em; text-transform: uppercase; color: #735f35; margin: 0 0 8px;">{{ report_label }}</p>
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="width: 100%; margin: 0;"><tr><td style="border-left: 2px solid #c6a45b; padding: 2px 0 2px 16px;"><p class="sans" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 14px; line-height: 1.6; color: #746d62; margin: 0; white-space: pre-wrap;">{{ body }}</p></td></tr></table>
{% endblock %}
{% block outer_note %}<p style="margin: 0;">{{ note }}</p>{% endblock %}
