{% comment %}Primary action. A table cell, rather than link padding, keeps the target usable in classic Outlook. Params: url, label.{% endcomment %}
<table role="presentation" class="cta-table" border="0" cellpadding="0" cellspacing="0" style="border-collapse: separate;"><tr><td bgcolor="#161514" style="background-color: #161514;"><a class="cta-link sans" href="{{ url }}" style="display: inline-block; padding: 15px 22px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 700; line-height: 1.2; color: #fbfaf6; text-decoration: none; text-align: center;">{{ label }} &rarr;</a></td></tr></table>
